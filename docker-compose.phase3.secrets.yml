services:
  ghost-guard:
    secrets:
      - ghost_guard_admin_token
      - ghost_guard_private_key
      - ghost_guard_ai_private_key

  ai-monitor:
    secrets:
      - bridge_admin_token

  bridge-service:
    secrets:
      - bridge_admin_token

  ghost-relayer:
    secrets:
      - relayer_private_key
      - relayer_private_key_l2

secrets:
  ghost_guard_admin_token:
    file: ./infra/docker/secrets/ghost_guard_admin_token
  ghost_guard_private_key:
    file: ./infra/docker/secrets/ghost_guard_private_key
  ghost_guard_ai_private_key:
    file: ./infra/docker/secrets/ghost_guard_ai_private_key
  bridge_admin_token:
    file: ./infra/docker/secrets/bridge_admin_token
  relayer_private_key:
    file: ./infra/docker/secrets/relayer_private_key
  relayer_private_key_l2:
    file: ./infra/docker/secrets/relayer_private_key_l2

