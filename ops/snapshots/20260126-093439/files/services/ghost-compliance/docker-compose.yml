version: '3.9'
services:
  ghost-compliance:
    container_name: ghost_ghost-compliance
    image: ghostl/ghost-compliance:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    command:
    - node
    - dist/server.js
    environment:
      NODE_ENV: production
      PORT: 8090
      DATABASE_URL: postgresql://ghost:${POSTGRES_PASSWORD:-ghostpass}@postgres:5432/ghost_compliance
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${COMPLIANCE_JWT_SECRET:-change-me}
      ATTESTATION_PRIVATE_KEY: ${COMPLIANCE_ATTESTATION_PRIVATE_KEY:-0x59c6995e998f97a5a0044966f094538e4b1a8d9d0f0b8a8c64d124b5e5d6fcbf}
      ATTESTATION_EXPIRY_SECONDS: 900
      CORS_ORIGIN: http://localhost:3200
    ports:
    - 8090:8090
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghostchain-compliance_default
networks:
  ghostchain-compliance_default:
    external: true
