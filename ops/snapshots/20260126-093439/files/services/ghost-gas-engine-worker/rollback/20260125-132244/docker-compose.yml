version: '3.9'
services:
  ghost-gas-engine-worker:
    container_name: ghost_ghost-gas-engine-worker
    image: ghostl/ghost-gas-engine:local
    build:
      context: ../ghost-gas-engine
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    command:
    - node
    - dist/worker.js
    environment:
      DATABASE_URL: postgresql://ghost:${GAS_ENGINE_DB_PASSWORD:-ghostpass}@gas-engine-postgres:5432/ghost_gas
      REDIS_URL: redis://gas-engine-redis:6379
      CHAINS_CONFIG_PATH: /app/config/chains.json
      POLICIES_PATH: /app/config/gas-policies.json
      RPC_L1: ${RPC_L1}
      RPC_L2: ${RPC_L2}
      RPC_L3: ${RPC_L3}
      GAS_TOKEN_L1: ${GAS_TOKEN_L1}
      GAS_TOKEN_L2: ${GAS_TOKEN_L2}
      GAS_TOKEN_L3: ${GAS_TOKEN_L3}
      SIGNER_PRIVATE_KEY: ${GAS_ENGINE_SIGNER_PRIVATE_KEY}
      SIGNER_PRIVATE_KEY_L1: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L1}
      SIGNER_PRIVATE_KEY_L2: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L2}
      SIGNER_PRIVATE_KEY_L3: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L3}
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
