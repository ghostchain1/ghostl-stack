# GhostChain full localhost web mesh
# Usage: docker compose -f docker-compose.web-full.yml up -d --build

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  networks:
    - ghostweb-full
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-web-defaults: &web-defaults
  <<: *runtime-defaults
  environment:
    NEXT_PUBLIC_API_URL: http://localhost:4000
    NEXT_PUBLIC_RPC_L1: http://localhost:18545
    NEXT_PUBLIC_RPC_L2: http://localhost:7260
    NEXT_PUBLIC_RPC_L3: http://localhost:7270
  healthcheck:
    test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT||3000) + '/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  ghostl-api:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ghostweb-api
    environment:
      NODE_ENV: production
      PORT: 4000
      SQLITE_DB_PATH: /app/apps/api/data/ghostl.db
      AUTH_DB_PATH: /app/apps/api/data/ghostl.db
      NFT_DB_PATH: /app/apps/api/data/nfts.db
      NFT_STORE_PATH: /app/apps/api/data/nfts.json
      MARKET_DATA_FILE: /app/apps/api/data/market-data.json
      TREASURY_STATE_FILE: /app/apps/api/data/treasury-proposals.json
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10

  ghostl-web:
    <<: *web-defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ghostweb-console
    depends_on:
      ghostl-api:
        condition: service_healthy
    environment:
      PORT: 3200
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://ghostl-api:4000
      NEXT_PUBLIC_COMPLIANCE_URL: http://localhost:8090
      COMPLIANCE_URL: http://ghost-compliance:8090
      NEXT_PUBLIC_AI_CORE_URL: http://localhost:3210
      AI_CORE_URL: http://ghost-gas-engine:3210
      NEXT_PUBLIC_GAS_ENGINE_URL: http://localhost:3210
      GAS_ENGINE_URL: http://ghost-gas-engine:3210
      NEXT_PUBLIC_PIL_URL: http://localhost:3220
      PIL_URL: http://ghost-pil:3220
    ports:
      - "3200:3200"

  control-center:
    <<: *web-defaults
    build:
      context: .
      dockerfile: apps/control-center/Dockerfile
    container_name: ghostweb-control-center
    environment:
      PORT: 3027
    ports:
      - "3027:3027"

  ghostx:
    <<: *web-defaults
    build:
      context: apps/ghostx
      dockerfile: Dockerfile
    container_name: ghostweb-ghostx
    environment:
      PORT: 4200
    ports:
