# GhostBrain Core — Docker Compose (development / integration)
#
# Orchestrates:
#   ghostbrain-runtime   — TypeScript inference engine       :7900, :7901
#   ghostbrain-simulator — Python/C++ hardware simulator     :7920
#   ghostbrain-compiler  — MLIR/LLVM compiler daemon         :7930
#   vault                — HashiCorp Vault (key management)  :8200
#   prometheus           — Metrics scraping                  :9090
#   grafana              — Dashboard                         :3000
#
# Requires (from parent stack):
#   ghostchain-l1        — GhostChain L1 RPC :18545 (on host network or overlay)
#   ghostl2              — GhostL2 RPC       :29545
#   ghostl3              — GhostL3 RPC       :39545
#
# To start (standalone):
#   docker compose -f infrastructure/compose/docker-compose-ghostbrain.yml up -d
#
# Chain routing law: all chain RPC calls must target GhostChain L1/L2/L3.
#   Never point at external (non-GhostChain) mainnet or any external chain.

version: "3.9"

networks:
  ghostbrain-net:
    driver: bridge
  ghostchain-overlay:
    external: true
    name: ghostchain-net   # shared with main stack

volumes:
  vault-data:
  prometheus-data:
  grafana-data:
  ghostbrain-logs:

# ── Services ──────────────────────────────────────────────────────────────

services:

  # ── GhostBrain Runtime ────────────────────────────────────────────────────
  ghostbrain-runtime:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.runtime
    image: ghostchain/ghostbrain-runtime:latest
    container_name: ghostbrain-runtime
    restart: unless-stopped
    ports:
      - "7900:7900"   # inference API
      - "7901:7901"   # management sideband
    environment:
      - NODE_ENV=production
      - GHOSTCHAIN_L1_RPC=http://ghostchain-l1:18545
      - GHOSTL2_RPC=http://ghostl2:29545
      - GHOSTL3_RPC=http://ghostl3:39545
      - GHOSTBRAIN_URL=http://ghostbrain-runtime:7900
      - SIGNING_RELAY_URL=http://signing-relay:7910
      - GHOSTSCAN_INDEXER_URL=http://ghostscan:8545
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN_FILE=/run/secrets/vault_token
      - GHOSTBRAIN_DEVICE_ID=ghost-brain-prod-0
      - GHOSTBRAIN_LOG_DIR=/var/log/ghostbrain
      - NODE_OPTIONS=--max_old_space_size=4096
    volumes:
      - ghostbrain-logs:/var/log/ghostbrain
    secrets:
      - vault_token
    networks:
      - ghostbrain-net
      - ghostchain-overlay
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7900/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      vault:
        condition: service_healthy

  # ── GhostBrain Simulator ──────────────────────────────────────────────────
  ghostbrain-simulator:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.simulator
    image: ghostchain/ghostbrain-simulator:latest
    container_name: ghostbrain-simulator
    restart: unless-stopped
    ports:
      - "7920:7920"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ghostbrain-net
    healthcheck:
      test: ["CMD", "python3", "simulator/roofline/roofline_model.py", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── GhostBrain Compiler ───────────────────────────────────────────────────
  ghostbrain-compiler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.compiler
    image: ghostchain/ghostbrain-compiler:latest
    container_name: ghostbrain-compiler
    restart: unless-stopped
    ports:
      - "7930:7930"
    networks:
      - ghostbrain-net
    healthcheck:
      test: ["CMD", "./bin/ghostc", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── HashiCorp Vault ───────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.16
    container_name: ghostbrain-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=ghostbrain-dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    networks:
      - ghostbrain-net
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: ["vault", "server", "-dev"]

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ghostbrain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../../observability/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - ghostbrain-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ghostbrain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../grafana/datasources:/etc/grafana/provisioning/datasources:ro
    secrets:
      - grafana_admin_password
    networks:
      - ghostbrain-net
    depends_on:
      - prometheus

# ── Secrets ───────────────────────────────────────────────────────────────
# In production: use K8s secrets or Vault agent injection.
# In dev: mount from local files (NOT committed to VCS).

secrets:
  vault_token:
    file: ../../secrets/vault_token.txt       # create locally; NEVER commit
  grafana_admin_password:
    file: ../../secrets/grafana_password.txt  # create locally; NEVER commit
