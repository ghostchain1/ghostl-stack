name: GhostBrain Security Audit

on:
  push:
    branches: [main]
    paths: ['ghost-brain-core/**']
  schedule:
    # Weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for SARIF upload

defaults:
  run:
    working-directory: ghost-brain-core

jobs:
  # ── Rust: cargo audit ─────────────────────────────────────────────────────
  cargo-audit:
    name: cargo audit (Rust dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: ghost-brain-core/security
        run: cargo audit --deny warnings

  # ── npm audit ─────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit (Node.js dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        # Fail on high/critical severity only
        run: npm audit --audit-level=high

  # ── pip audit ─────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pip-audit numpy matplotlib scipy

      - name: Run pip-audit
        run: pip-audit --require-hashes || true   # informational in CI

  # ── SAST: Semgrep ─────────────────────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (TypeScript + Python + C++)
        run: |
          semgrep \
            --config=auto \
            --sarif \
            --output /tmp/semgrep.sarif \
            ghost-brain-core/

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/semgrep.sarif

  # ── OWASP Dependency Check ────────────────────────────────────────────────
  owasp-dep-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ghostbrain-core
          path:    ghost-brain-core
          format:  HTML
          args:    >
            --failOnCVSS 7
            --enableExperimental

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dep-check-report
          path: reports/

  # ── Secret scan: Gitleaks ─────────────────────────────────────────────────
  gitleaks:
    name: Secret scan — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for leak detection

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: trivy-secret.yaml   # re-use existing config

  # ── Rust: cargo clippy (strict) ───────────────────────────────────────────
  cargo-clippy-strict:
    name: cargo clippy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (strict — deny all warnings)
        working-directory: ghost-brain-core/security
        run: cargo clippy -- -D warnings -D clippy::all

  # ── TypeScript: detect hardcoded secrets ──────────────────────────────────
  ts-secret-lint:
    name: TS — no hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets in TS source
        run: |
          if grep -rn \
            --include="*.ts" \
            -E '(private_key|privateKey|mnemonic|seed_phrase|secret\s*=\s*["\x27][A-Za-z0-9+/]{20,})' \
            ghost-brain-core/ | grep -v "\.test\." | grep -v "SIMULATION ONLY"; then
            echo "FAIL: Potential hardcoded secrets found"
            exit 1
          fi
          echo "PASS: No hardcoded secrets detected"
