# ─────────────────────────────────────────────────────────────────
# @ghostchain/contracts — Foundry config
# Designed to be consumed by ghostl-stack as a lib submodule or
# npm-linked package under contracts/lib/ghostchain-contracts/
# ─────────────────────────────────────────────────────────────────

[profile.default]
solc_version = '0.8.24'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
src = 'contracts'
out = 'out-codex'
libs = ['node_modules', 'lib']
test = 'test'
cache_path = 'cache-codex'
build_info = true
build_info_path = 'out-codex/build-info'
fs_permissions = [{ access = "read", path = "./node_modules/hardhat-predeploy/bin" }]

# Remappings: when this package is used standalone
# When consumed by ghostl-stack (as lib/ghostchain-contracts),
# ghostl-stack's foundry.toml must include the ghostl-stack patch below.
remappings = [
  "@ghostchain/contracts/=contracts/",
  "@ghostchain/contracts-upgradeable/=contracts/",
]

# ─────────────────────────────────────────────────────────────────
# Legacy / L1 profile (no PUSH0, paris EVM) — mirrors ghostl-stack
# ─────────────────────────────────────────────────────────────────
[profile.legacy]
solc_version = '0.8.24'
evm_version = 'paris'
via_ir = false
optimizer_runs = 200
out = 'out-legacy'
cache_path = 'cache-legacy'
build_info_path = 'out-legacy/build-info'

[lint]
exclude_lints = ["mixed-case-function", "asm-keccak256", "screaming-snake-case-immutable", "incorrect-shift", "mixed-case-variable"]
ignore = ["./contracts/interfaces/**/*.sol", "./contracts/mocks/Stateless.sol"]
lint_on_build = false

[fuzz]
runs = 5000
max_test_rejects = 150000
