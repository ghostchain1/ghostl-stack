[profile.default]
src = "src"
test = "test"
script = "script"
out = "out-codex"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
cache_path = "cache-codex"
build_info = true
build_info_path = "out-codex/build-info"
test_failures_file = "cache-codex/test-failures"
fuzz = { runs = 128, failure_persist_dir = "cache-codex/fuzz" }
invariant = { runs = 64, failure_persist_dir = "cache-codex/invariant" }
via_ir = true
ffi = true
fs_permissions = [
  { access = "read", path = ".." },
  { access = "read", path = "../infra" },
  { access = "read", path = "../services" }
]

# GhostChain L1 may run a pre-Shanghai EVM; this profile disables via-IR and
# targets a pre-Shanghai EVM version to avoid PUSH0 bytecode.
[profile.legacy]
out = "out-legacy"
cache_path = "cache-legacy"
build_info_path = "out-legacy/build-info"
test_failures_file = "cache-legacy/test-failures"
fuzz = { runs = 128, failure_persist_dir = "cache-legacy/fuzz" }
invariant = { runs = 64, failure_persist_dir = "cache-legacy/invariant" }
via_ir = false
evm_version = "paris"

# Ghost Name Service test profile — run with: FOUNDRY_PROFILE=gns forge test
[profile.gns]
test = "test/gns"
out = "out-codex"
cache_path = "cache-codex"
