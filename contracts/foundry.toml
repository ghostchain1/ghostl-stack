[profile.default]
src = "src"
test = "test"
out = "out-codex"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
cache_path = "cache-codex"
test_failures_file = "cache-codex/test-failures"
fuzz = { runs = 128, failure_persist_dir = "cache-codex/fuzz" }
invariant = { runs = 64, failure_persist_dir = "cache-codex/invariant" }
via_ir = true
ffi = true
fs_permissions = [
  { access = "read", path = ".." },
  { access = "read", path = "../infra" },
  { access = "read", path = "../services" }
]
