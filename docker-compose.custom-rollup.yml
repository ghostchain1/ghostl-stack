# GhostChain Custom Rollup — Phase 2 / Phase 3 Devnet
#
# This compose file brings up the full custom GhostL2/GhostL3 execution stack
# (ghost-exec, ghost-sequencer, ghost-deriver, ghost-settlement, ghost-bridge, ghost-proof)
# wired against a running GhostChain L1 node.
#
# Usage:
#   docker compose -f docker-compose.custom-rollup.yml up
#
# For Phase 3 dual-run (old OP vs new Ghost modules for block comparison):
#   docker compose -f docker-compose.custom-rollup.yml \
#                  -f docker-compose.ghostchain.yml up
#
# Prerequisites:
#   - GhostChain L1 RPC reachable at ghostchain-l1:18545
#   - GhostL2 and GhostL3 EVM nodes reachable (ghostl2:8545, ghostl3:8545)
#   - Copy .env.example to .env and set required secrets
#
# Routing Law enforced in every service:
#   L3 (chain_id=903) -> L2 (chain_id=901) -> L1 (chain_id=14000101)
#   No direct L3->L1 allowed.

services:

  # ---------------------------------------------------------------------------
  # ghost-exec — EVM execution engine (L2 instance)
  # ---------------------------------------------------------------------------
  ghost-exec-l2:
    build:
      context: .
      dockerfile: services/ghost-exec/Dockerfile
    container_name: ghost-exec-l2
    environment:
      PORT: "7260"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      GHOST_EXEC_RPC_URL: "http://ghostl2:8545"
      GAS_LIMIT_CAP: "30000000"
      MAX_TX_PER_BLOCK: "1000"
      STATE_DIR: "/state"
    ports:
      - "7260:7260"
    volumes:
      - ghost-exec-l2-state:/state
    networks:
      - ghost-rollup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7260/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-sequencer — block sequencer (L2 instance)
  # ---------------------------------------------------------------------------
  ghost-sequencer-l2:
    build:
      context: .
      dockerfile: services/ghost-sequencer/Dockerfile
    container_name: ghost-sequencer-l2
    environment:
      PORT: "7261"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      GHOST_EXEC_URL: "http://ghost-exec-l2:7260"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l2:7263"
      BLOCK_TIME_MS: "2000"
      MAX_TX_PER_BLOCK: "1000"
      GAS_LIMIT_CAP: "30000000"
    ports:
      - "7261:7261"
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7261/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-deriver — batch deriver (L2 derives from L1)
  # ---------------------------------------------------------------------------
  ghost-deriver-l2:
    build:
      context: .
      dockerfile: services/ghost-deriver/Dockerfile
    container_name: ghost-deriver-l2
    environment:
      PORT: "7262"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      # L2 derives from L1 (routing law)
      GHOST_PARENT_RPC_URL: "http://ghostchain-l1:18545"
      GHOST_EXEC_URL: "http://ghost-exec-l2:7260"
      STATE_DIR: "/state"
      POLL_INTERVAL_MS: "4000"
    ports:
      - "7262:7262"
    volumes:
      - ghost-deriver-l2-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7262/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-settlement — commitment posting (L2 settles to L1)
  # ---------------------------------------------------------------------------
  ghost-settlement-l2:
    build:
      context: .
      dockerfile: services/ghost-settlement/Dockerfile
    container_name: ghost-settlement-l2
    environment:
      PORT: "7263"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      # L2 settles to L1 (routing law)
      GHOST_PARENT_RPC_URL: "http://ghostchain-l1:18545"
      ROLLUP_ADDRESS: "0xad32D5C2Da9f4159C4cc98686C005852b3905355"
      FINALITY_ORACLE_ADDRESS: "0x7B3Be2dDDdDf9A0a3fE1DC57B98980F662C3a422"
      GHOST_PROOF_URL: "http://ghost-proof-l2:7265"
      STATE_DIR: "/state"
      CHALLENGE_PERIOD_SECONDS: "300"
      CONFIRMATIONS: "12"
    ports:
      - "7263:7263"
    volumes:
      - ghost-settlement-l2-state:/state
    networks:
      - ghost-rollup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7263/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-bridge — L1 <-> L2 bridge relay
  # ---------------------------------------------------------------------------
  ghost-bridge-l2:
    build:
      context: .
      dockerfile: services/ghost-bridge/Dockerfile
    container_name: ghost-bridge-l2
    environment:
      PORT: "7264"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      BRIDGE_ADDRESS: "0xad32D5C2Da9f4159C4cc98686C005852b3905355"
      DEST_BRIDGE_ADDRESS: "0xad32D5C2Da9f4159C4cc98686C005852b3905355"
      GHOST_SOURCE_RPC_URL: "http://ghostchain-l1:18545"
      GHOST_DEST_RPC_URL: "http://ghostl2:8545"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l2:7263"
      STATE_DIR: "/state"
    ports:
      - "7264:7264"
    volumes:
      - ghost-bridge-l2-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-settlement-l2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7264/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-proof — fraud-proof & dispute (L2 instance)
  # ---------------------------------------------------------------------------
  ghost-proof-l2:
    build:
      context: .
      dockerfile: services/ghost-proof/Dockerfile
    container_name: ghost-proof-l2
    environment:
      PORT: "7265"
      CHAIN_ID: "901"
      GHOST_LAYER: "L2"
      PROOF_MODE: "fraud"
      GHOST_PARENT_RPC_URL: "http://ghostchain-l1:18545"
      ROLLUP_ADDRESS: "0xad32D5C2Da9f4159C4cc98686C005852b3905355"
      GHOST_EXEC_URL: "http://ghost-exec-l2:7260"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l2:7263"
      STATE_DIR: "/state"
    ports:
      - "7265:7265"
    volumes:
      - ghost-proof-l2-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7265/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-exec — EVM execution engine (L3 instance)
  # ---------------------------------------------------------------------------
  ghost-exec-l3:
    build:
      context: .
      dockerfile: services/ghost-exec/Dockerfile
    container_name: ghost-exec-l3
    environment:
      PORT: "7270"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      GHOST_EXEC_RPC_URL: "http://ghostl3:8545"
      GAS_LIMIT_CAP: "20000000"
      MAX_TX_PER_BLOCK: "500"
      STATE_DIR: "/state"
    ports:
      - "7270:7270"
    volumes:
      - ghost-exec-l3-state:/state
    networks:
      - ghost-rollup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7270/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-sequencer — block sequencer (L3 instance)
  # ---------------------------------------------------------------------------
  ghost-sequencer-l3:
    build:
      context: .
      dockerfile: services/ghost-sequencer/Dockerfile
    container_name: ghost-sequencer-l3
    environment:
      PORT: "7271"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      GHOST_EXEC_URL: "http://ghost-exec-l3:7270"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l3:7273"
      BLOCK_TIME_MS: "1000"
      MAX_TX_PER_BLOCK: "500"
      GAS_LIMIT_CAP: "20000000"
    ports:
      - "7271:7271"
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7271/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-deriver — batch deriver (L3 derives from L2, NOT L1 — routing law)
  # ---------------------------------------------------------------------------
  ghost-deriver-l3:
    build:
      context: .
      dockerfile: services/ghost-deriver/Dockerfile
    container_name: ghost-deriver-l3
    environment:
      PORT: "7272"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      # L3 MUST derive from L2, never L1 directly (routing law)
      GHOST_PARENT_RPC_URL: "http://ghost-exec-l2:7260"
      STATE_DIR: "/state"
      POLL_INTERVAL_MS: "3000"
    ports:
      - "7272:7272"
    volumes:
      - ghost-deriver-l3-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7272/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-settlement — commitment posting (L3 settles to L2, NOT L1 — routing law)
  # ---------------------------------------------------------------------------
  ghost-settlement-l3:
    build:
      context: .
      dockerfile: services/ghost-settlement/Dockerfile
    container_name: ghost-settlement-l3
    environment:
      PORT: "7273"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      # L3 MUST settle to L2, never L1 directly (routing law)
      GHOST_PARENT_RPC_URL: "http://ghost-exec-l2:7260"
      ROLLUP_ADDRESS: "0x130A46b6E41DB6E1e18fb9c759F223c459190e90"
      FINALITY_ORACLE_ADDRESS: "0x87F850cbC2cFfac086F20d0d7307E12d06fA2127"
      GHOST_PROOF_URL: "http://ghost-proof-l3:7275"
      STATE_DIR: "/state"
      CHALLENGE_PERIOD_SECONDS: "180"
      CONFIRMATIONS: "6"
    ports:
      - "7273:7273"
    volumes:
      - ghost-settlement-l3-state:/state
    networks:
      - ghost-rollup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7273/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-bridge — L2 <-> L3 bridge relay (enforces routing law)
  # ---------------------------------------------------------------------------
  ghost-bridge-l3:
    build:
      context: .
      dockerfile: services/ghost-bridge/Dockerfile
    container_name: ghost-bridge-l3
    environment:
      PORT: "7274"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      # L2L3Bridge canonical
      BRIDGE_ADDRESS: "0xDadd1125B8Df98A66Abd5EB302C0d9Ca5A061dC2"
      DEST_BRIDGE_ADDRESS: "0x130A46b6E41DB6E1e18fb9c759F223c459190e90"
      GHOST_SOURCE_RPC_URL: "http://ghost-exec-l2:7260"
      GHOST_DEST_RPC_URL: "http://ghost-exec-l3:7270"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l3:7273"
      STATE_DIR: "/state"
    ports:
      - "7274:7274"
    volumes:
      - ghost-bridge-l3-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-settlement-l3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7274/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # ghost-proof — fraud-proof & dispute (L3 instance, disputes against L2)
  # ---------------------------------------------------------------------------
  ghost-proof-l3:
    build:
      context: .
      dockerfile: services/ghost-proof/Dockerfile
    container_name: ghost-proof-l3
    environment:
      PORT: "7275"
      CHAIN_ID: "903"
      GHOST_LAYER: "L3"
      PROOF_MODE: "fraud"
      # L3 proof disputes are posted to L2 rollup (not L1 directly)
      GHOST_PARENT_RPC_URL: "http://ghost-exec-l2:7260"
      ROLLUP_ADDRESS: "0x130A46b6E41DB6E1e18fb9c759F223c459190e90"
      GHOST_EXEC_URL: "http://ghost-exec-l3:7270"
      GHOST_SETTLEMENT_URL: "http://ghost-settlement-l3:7273"
      STATE_DIR: "/state"
    ports:
      - "7275:7275"
    volumes:
      - ghost-proof-l3-state:/state
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7275/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  ghost-observability:
    build:
      context: ./services/ghost-observability
      dockerfile: Dockerfile
    image: ghostchain/ghost-observability:local
    container_name: ghost-observability
    environment:
      PORT: "7276"
      SCRAPE_INTERVAL_MS: "15000"
      ALERT_MISS_THRESHOLD: "3"
      GHOST_EXEC_L2_URL: "http://ghost-exec-l2:7260"
      GHOST_SEQUENCER_L2_URL: "http://ghost-sequencer-l2:7261"
      GHOST_DERIVER_L2_URL: "http://ghost-deriver-l2:7262"
      GHOST_SETTLEMENT_L2_URL: "http://ghost-settlement-l2:7263"
      GHOST_BRIDGE_L2_URL: "http://ghost-bridge-l2:7264"
      GHOST_PROOF_L2_URL: "http://ghost-proof-l2:7265"
      GHOST_EXEC_L3_URL: "http://ghost-exec-l3:7270"
      GHOST_SEQUENCER_L3_URL: "http://ghost-sequencer-l3:7271"
      GHOST_DERIVER_L3_URL: "http://ghost-deriver-l3:7272"
      GHOST_SETTLEMENT_L3_URL: "http://ghost-settlement-l3:7273"
      GHOST_BRIDGE_L3_URL: "http://ghost-bridge-l3:7274"
      GHOST_PROOF_L3_URL: "http://ghost-proof-l3:7275"
    ports:
      - "7276:7276"
    networks:
      - ghost-rollup
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
      ghost-exec-l3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7276/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  ghost-rollup:
    name: ghost-rollup
    driver: bridge

volumes:
  ghost-exec-l2-state:
  ghost-deriver-l2-state:
  ghost-settlement-l2-state:
  ghost-bridge-l2-state:
  ghost-proof-l2-state:
  ghost-exec-l3-state:
  ghost-deriver-l3-state:
  ghost-settlement-l3-state:
  ghost-bridge-l3-state:
  ghost-proof-l3-state:
