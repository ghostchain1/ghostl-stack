openapi: 3.0.3
info:
  title: Ghost Observability Logs API
  version: 1.0.0
paths:
  /observability/logs/api/query:
    get:
      summary: Query normalized logs
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: layers
          schema:
            type: string
          description: Comma-separated layers
        - in: query
          name: chains
          schema:
            type: string
        - in: query
          name: components
          schema:
            type: string
        - in: query
          name: severities
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: integer
        - in: query
          name: end
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Normalized logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NormalizedLogEvent'
  /observability/logs/api/stream:
    get:
      summary: Stream normalized logs (SSE)
      responses:
        '200':
          description: SSE stream
  /observability/logs/api/aggregate:
    get:
      summary: Aggregate normalized logs
      parameters:
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [component, severity, layer, chain, event]
      responses:
        '200':
          description: Aggregate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogAggregateResult'
  /observability/logs/api/incidents:
    get:
      summary: Incident summaries
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogIncident'
  /observability/logs/api/insights:
    get:
      summary: AI insight report
      responses:
        '200':
          description: Insight report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogInsightReport'
  /observability/logs/api/correlation:
    get:
      summary: Trace correlation data
      responses:
        '200':
          description: Correlation data
  /observability/logs/api/critical:
    get:
      summary: Immutable critical log ledger
      responses:
        '200':
          description: Ledger records
  /observability/logs/api/metrics:
    get:
      summary: Log-derived Prometheus metrics
      responses:
        '200':
          description: Prometheus metrics
components:
  schemas:
    NormalizedLogEvent:
      type: object
      required: [id, timestamp, layer, chain, component, severity, event, message]
      properties:
        id:
          type: string
        timestamp:
          type: string
        timestampNs:
          type: string
        layer:
          type: string
        chain:
          type: string
        component:
          type: string
        severity:
          type: string
        event:
          type: string
        message:
          type: string
        requestId:
          type: string
        traceId:
          type: string
        blockNumber:
          type: number
        txHash:
          type: string
        nodeId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties: true
    LogAggregateResult:
      type: object
      properties:
        total:
          type: number
        buckets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              count:
                type: number
    LogIncident:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
        title:
          type: string
        summary:
          type: string
        start:
          type: string
        end:
          type: string
    LogInsightReport:
      type: object
      properties:
        generatedAt:
          type: string
        riskLevel:
          type: string
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/LogIncident'
        anomalies:
          type: array
          items:
            type: object
        explanations:
          type: array
          items:
            type: object
        recommendedActions:
          type: array
          items:
            type: string
