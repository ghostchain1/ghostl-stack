global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/econ-engine.rules.yml
  - /etc/prometheus/rules/ghost-treasury-ai.rules.yml

scrape_configs:
  - job_name: hg-treasury-agent
    static_configs:
      - targets: ["hg-treasury-agent:7601"]
    metrics_path: /metrics

  - job_name: hg-risk-oracle
    static_configs:
      - targets: ["hg-risk-oracle:7602"]
    metrics_path: /metrics

  - job_name: hg-reporting-indexer
    static_configs:
      - targets: ["hg-reporting-indexer:7603"]
    metrics_path: /metrics

  - job_name: hg-proof-snapshotter
    static_configs:
      - targets: ["hg-proof-snapshotter:7604"]
    metrics_path: /metrics

  - job_name: ghost-treasury-ai
    static_configs:
      - targets: ["ghost-treasury-ai:7680"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: autonomous-vault-hypervisor
    static_configs:
      - targets: ["autonomous-vault-hypervisor:7720"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    labels:
      service: autonomous-vault-hypervisor
      layer: L1
      component: hypervisor
