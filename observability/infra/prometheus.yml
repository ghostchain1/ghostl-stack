global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/gst_metric_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ghost-rollup-observability
    metrics_path: /metrics
    static_configs:
      - targets: ["ghost-observability:7276"]

  - job_name: ghost-api-logs
    metrics_path: /observability/logs/api/metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: consensus-telemetry
    metrics_path: /metrics
    static_configs:
      - targets: ["consensus-telemetry-service:7635"]

  - job_name: ghostchain-l1
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:18660"]

  - job_name: ghostchain-rpc-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18545"]

  - job_name: ai-monitor-l2
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7575"]

  - job_name: ai-monitor-l1
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7576"]

  - job_name: ai-monitor-l3
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7577"]

  - job_name: ai-clock-sync
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7690"]

  - job_name: l3-fee-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["l3-fee-collector:7681"]

  - job_name: l2-revenue-aggregator
    metrics_path: /metrics
    static_configs:
      - targets: ["l2-revenue-aggregator:7682"]

  - job_name: treasury-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["treasury-engine:7683"]

  - job_name: reward-distributor
    metrics_path: /metrics
    static_configs:
      - targets: ["reward-distributor:7684"]

  - job_name: hyper-ghost-governor
    metrics_path: /metrics
    static_configs:
      - targets: ["hyper-ghost-governor:7685"]
