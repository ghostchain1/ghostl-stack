apiVersion: 1

providers:
  - name: ghost-rollup
    orgId: 1
    folder: "Ghost Rollup"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
  - name: gst
    orgId: 1
    folder: "GST"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/gst-dashboards
