apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-vector-config
  labels:
    app: observability
    component: vector
  namespace: default
data:
  vector.yaml: |
    sources:
      docker_logs:
        type: docker_logs
        docker_host: "unix:///var/run/docker.sock"
        exclude_containers:
          - vector
    transforms:
      enrich_logs:
        type: remap
        inputs: [docker_logs]
        source: |
          .raw_message = .message
          if .timestamp != null { .event_time = .timestamp }
          .timestamp = now()
          parsed = parse_json(.message) ?? {}
          if parsed != {} {
            .structured = parsed
          }
          .level = downcase(to_string(parsed.level) ?? "info")
          .component = to_string(parsed.component) ?? .container_name
          .event = to_string(parsed.event) ?? "log_event"
          if match!(.component, r'(?i)l3') { .layer = "L3" } else if match!(.component, r'(?i)l2') { .layer = "L2" } else if match!(.component, r'(?i)l1|ghostchain') { .layer = "L1" } else { .layer = "INFRA" }
          if .layer == "L1" { .chain = "GhostChain" } else if .layer == "L2" { .chain = "GhostL2" } else if .layer == "L3" { .chain = "GhostL3" } else { .chain = "Infrastructure" }
          if exists(parsed.trace_id) { .trace_id = parsed.trace_id }
          if exists(parsed.request_id) { .request_id = parsed.request_id }
          if exists(parsed.tx_hash) { .tx_hash = parsed.tx_hash }
          if exists(parsed.block_number) { .block_number = parsed.block_number }
          if exists(parsed.node_id) { .node_id = parsed.node_id }
    
    sinks:
      loki:
        type: loki
        inputs: [enrich_logs]
        endpoint: http://loki:3100
        encoding:
          codec: json
        labels:
          job: "{{container_name}}"
          component: "{{component}}"
          layer: "{{layer}}"
          chain: "{{chain}}"
          level: "{{level}}"
          instance: "{{host}}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-loki-config
  labels:
    app: observability
    component: loki
  namespace: default
data:
  loki-config.yml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
    
    ingester:
      wal:
        enabled: false
      lifecycler:
        address: 0.0.0.0
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 10m
      chunk_retain_period: 5m
    
    limits_config:
      retention_period: 24h
    
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
        cache_ttl: 24h
      filesystem:
        directory: /loki/chunks
    
    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-prometheus-config
  labels:
    app: observability
    component: prometheus
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - /etc/prometheus/alert_rules.yml
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    
    scrape_configs:
      - job_name: op-node
        static_configs:
          - targets: ["op-node:7300"]
    
      - job_name: op-batcher
        static_configs:
          - targets: ["op-batcher:7301"]
    
      - job_name: op-proposer
        static_configs:
          - targets: ["op-proposer:7302"]
    
      - job_name: op-gate
        metrics_path: /metrics/prom
        static_configs:
          - targets: ["op-gate:8545"]
    
      - job_name: l3-op-node
        static_configs:
          - targets: ["l3-op-node:8300"]
        metric_relabel_configs:
          - source_labels: [instance]
            target_label: network
            replacement: l3
    
      - job_name: l3-op-batcher
        static_configs:
          - targets: ["l3-op-batcher:8301"]
        metric_relabel_configs:
          - source_labels: [instance]
            target_label: network
            replacement: l3
    
      - job_name: l3-op-proposer
        static_configs:
          - targets: ["l3-op-proposer:8302"]
        metric_relabel_configs:
          - source_labels: [instance]
            target_label: network
            replacement: l3
    
      - job_name: ghost-api-logs
        metrics_path: /observability/logs/api/metrics
        static_configs:
          - targets: ["host.docker.internal:4000"]

      - job_name: ai-clock-sync
        metrics_path: /metrics
        static_configs:
          - targets: ["host.docker.internal:7690"]
  alert_rules.yml: |
    groups:
      - name: ghost-observability-logs
        rules:
          - alert: GhostCriticalLogs
            expr: increase(ghost_observability_log_events_total{severity=~"CRITICAL|SLASHING_RISK|SECURITY_EVENT"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Critical observability logs detected"
              description: "Critical, slashing-risk, or security log events observed in the last 5 minutes."
          - alert: GhostErrorRateSpike
            expr: increase(ghost_observability_log_events_total{severity=~"ERROR|CONSENSUS_RISK"}[5m]) > 25
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Error rate spike detected"
              description: "Error or consensus-risk logs are spiking above normal thresholds."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-alertmanager-config
  labels:
    app: observability
    component: alertmanager
  namespace: default
data:
  alertmanager.yml: |
