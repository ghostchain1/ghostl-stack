apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      containers:
        - name: vector
          image: timberio/vector:0.38.0-alpine
          args: ["--config", "/etc/vector/vector.yaml"]
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: vector-config
          configMap:
            name: observability-vector-config
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
