apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-grafana-dashboards
data:
  ghost-observability-logs.json: |
    {
      "uid": "ghost-observability-logs",
      "title": "Ghost Observability Logs",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Log Event Rate by Severity",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (severity) (rate(ghost_observability_log_events_total[5m]))",
              "legendFormat": "{{severity}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "type": "table",
          "title": "Top Components by Errors (15m)",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "topk(10, sum by (component) (increase(ghost_observability_log_events_total{severity=~\"ERROR|CRITICAL|SLASHING_RISK|SECURITY_EVENT\"}[15m])))",
              "legendFormat": "{{component}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "type": "logs",
          "title": "Loki Logs",
          "datasource": { "type": "loki", "uid": "Loki" },
          "targets": [
            {
              "expr": "{job!=\"\"}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 }
        }
      ],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": { "refresh_intervals": ["10s", "30s", "1m", "5m", "15m"] }
    }
  opstack-observability.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Rollup Sequencer",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "Sequencer event rate by type",
          "gridPos": {"h": 7, "w": 12, "x": 0, "y": 1},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "sum by(event_type)(rate(op_node_default_events_dequeued[5m]))",
              "legendFormat": "{{event_type}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Channel input bytes (L1 DA)",
          "gridPos": {"h": 7, "w": 12, "x": 12, "y": 1},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "rate(op_node_default_channel_input_bytes[5m])",
              "legendFormat": "bytes/s"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Batcher blob size p90 (bytes)",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "histogram_quantile(0.9, sum by (le)(rate(op_batcher_default_blob_used_bytes_bucket[5m])))",
              "legendFormat": "p90"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "Channel timeouts",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_node_default_channel_timeout_total"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "Batcher balance (ETH)",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_batcher_default_balance"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "eth"}, "overrides": []}
        },
    
        {
          "type": "row",
          "title": "Settlement & Fraud",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14}
        },
        {
          "type": "stat",
          "title": "Latest proposed L2 seq #",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 15},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_proposer_default_proposed_sequence_number"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "Proposer guard decisions",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 15},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "sum by (result)(op_proposer_default_guard_decisions_total)"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "L1 base fee (wei)",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 15},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_proposer_default_txmgr_basefee_wei"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "wei"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "Blob base fee (wei)",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 15},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_proposer_default_txmgr_blob_basefee_wei"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["last"], "fields": ""}},
          "fieldConfig": {"defaults": {"unit": "wei"}, "overrides": []}
        },
        {
          "type": "text",
          "title": "Fraud proof status",
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 21},
          "options": {"content": "Fraud proofs are not active on this devnet (legacy L2OutputOracle flow).", "mode": "markdown"}
        },
        {
          "type": "text",
          "title": "ZK proof status",
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 21},
          "options": {"content": "This stack is OP rollup (not ZK). Add ZK prover telemetry here if enabled.", "mode": "markdown"}
        },
    
        {
          "type": "row",
          "title": "AI Fee Control & DA",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 25}
        },
        {
          "type": "timeseries",
          "title": "Suggested tip (blob)",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 26},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_proposer_default_txmgr_blob_tipcap_wei",
              "legendFormat": "blob tip"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "wei"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Suggested tip (gas)",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 26},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "expr": "op_proposer_default_txmgr_blob_tipcap_wei",  "legendFormat": "tip"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "wei"}, "overrides": []}
        },
        {
          "type": "text",
          "title": "AI-controlled fee market",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 26},
          "options": {"content": "Stub: hook an external policy engine here to update proposer/batcher fee caps via env or guard.", "mode": "markdown"}
        }
      ],
      "schemaVersion": 37,
      "style": "dark",
      "tags": ["opstack"],
      "timezone": "browser",
      "title": "OP Stack Control Plane",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.5
          args: ["-config.file=/etc/loki/loki-config.yml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: loki-config
          configMap:
            name: observability-loki-config
        - name: loki-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prom-config
              mountPath: /etc/prometheus
            - name: prom-data
              mountPath: /prometheus
      volumes:
        - name: prom-config
          configMap:
            name: observability-prometheus-config
        - name: prom-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
