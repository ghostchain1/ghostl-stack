# GhostChain Public Web Ecosystem
# Manages the public GhostChain web mesh
# Usage: docker compose -f docker-compose.web.yml up -d
#
# Ports:
#   3010  ghostchain.cloud          web-main
#   3011  investor.ghostchain.cloud web-investor
#   3012  dev.ghostchain.cloud      web-dev
#   3013  apps.ghostchain.cloud     web-apps
#   3014  explorer.ghostchain.cloud web-explorer
#   3015  governance.ghostchain.cloud web-governance
#   3016  nodes.ghostchain.cloud    web-nodes
#   3017  exchange.ghostchain.cloud web-exchange
#   3018  company.ghostchain.cloud  web-company
#   3019  status.ghostchain.cloud   web-status
#   3020  portal.ghostchain.cloud   web-portal
#   3021  wallet.ghostchain.cloud   web-wallet
#   3022  bridge.ghostchain.cloud   web-bridge
#   3023  docs.ghostchain.cloud     web-docs
#   3024  ghostchain.live           web-live
#   3025  ai.ghostchain.cloud       web-ai
#   3026  rpc.ghostchain.cloud      web-rpc-portal

x-web-defaults: &web-defaults
  restart: unless-stopped
  networks:
    - ghostweb
  environment:
    - NEXT_PUBLIC_API_URL=https://api.ghostchain.cloud
    - NEXT_PUBLIC_RPC_L1=https://rpc.ghostchain.cloud
    - NEXT_PUBLIC_RPC_L2=https://l2rpc.ghostchain.cloud
    - NEXT_PUBLIC_RPC_L3=https://l3rpc.ghostchain.cloud
  healthcheck:
    test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT||3010) + '/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web-main:
    <<: *web-defaults
    build:
      context: .
      dockerfile: apps/web-main/Dockerfile
    image: ghostchain/web-main:latest
    container_name: ghostweb-main
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - NEXT_PUBLIC_SITE_NAME=GhostChain
      - NEXT_PUBLIC_DOMAIN=ghostchain.cloud
      - NEXT_PUBLIC_API_URL=https://api.ghostchain.cloud
      - NEXT_PUBLIC_RPC_L1=https://rpc.ghostchain.cloud
      - NEXT_PUBLIC_RPC_L2=https://l2rpc.ghostchain.cloud
      - NEXT_PUBLIC_RPC_L3=https://l3rpc.ghostchain.cloud

  web-investor:
