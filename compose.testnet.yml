name: ghostl-testnet

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-default-restart: &default-restart
  restart: unless-stopped
  logging: *default-logging

networks:
  l1_net:
    name: ghost_l1_net
    driver: bridge
  l2_net:
    name: ghost_l2_net
    driver: bridge
  l3_net:
    name: ghost_l3_net
    driver: bridge
  shared_obs:
    name: ghost_shared_obs
    driver: bridge
  ingress_net:
    name: ghost_ingress_net
    driver: bridge

services:
  ghostchain-bootnode:
    <<: *default-restart
    networks:
      - l1_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/boot.key"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ghostchain-node1:
    <<: *default-restart
    labels:
      ghost.layer: l1
    networks:
      - l1_net
      - shared_obs
    ports:
      - "${L1_RPC_WS_BIND:-127.0.0.1}:${L1_RPC_WS_PORT:-18546}:8546"
      - "${L1_RPC_AUTH_BIND:-127.0.0.1}:${L1_RPC_AUTH_PORT:-18552}:8551"
      - "${L1_P2P_BIND:-0.0.0.0}:${L1_P2P_PORT:-18551}:30303"
      - "${L1_METRICS_BIND:-127.0.0.1}:${L1_METRICS_PORT:-18660}:6060"

  ghostchain-node2:
    <<: *default-restart
    networks:
      - l1_net
      - shared_obs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' --header 'Content-Type: application/json' http://localhost:8545 >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  ghostchain-rpc-proxy:
    <<: *default-restart
    networks:
      - l1_net
      - ingress_net
      - shared_obs
    ports:
      - "${L1_RPC_HTTP_BIND:-127.0.0.1}:${L1_RPC_HTTP_PORT:-18545}:8545"

  ghostscout:
    <<: *default-restart
    networks:
      - l1_net
      - ingress_net
    ports:
      - "${L1_EXPLORER_BIND:-127.0.0.1}:${L1_EXPLORER_PORT:-18644}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s

  op-gate:
    <<: *default-restart
    networks:
      - l2_net
      - l3_net
    ports: []

  op-gate-l1:
    <<: *default-restart
    networks:
      - l1_net
      - l2_net
    ports: []

  l1-rpc-proxy:
    <<: *default-restart
    networks:
      - l1_net
      - l2_net

  l2-geth:
    <<: *default-restart
    labels:
      ghost.layer: l2
    networks:
      - l2_net
      - l3_net
      - shared_obs

  op-node:
    <<: *default-restart
    networks:
      - l2_net
      - shared_obs

  op-sequencer:
    <<: *default-restart
    networks:
      - l2_net
      - shared_obs

  op-batcher:
    <<: *default-restart
    networks:
      - l2_net
      - shared_obs

  op-proposer:
    <<: *default-restart
    profiles: []
    networks:
      - l2_net
      - shared_obs

  rpc-forward-l2-18547:
    <<: *default-restart
    networks:
      - l2_net
    healthcheck:
      test: ["CMD-SHELL", "socat -u - TCP:127.0.0.1:18547 </dev/null >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  ghost-rpc-proxy-l3:
    <<: *default-restart
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8546 -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' >/dev/null",
        ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s

  l3-geth:
    <<: *default-restart
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs

  l3-op-node:
    <<: *default-restart
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs
    environment:
      L3_L1_RPC: "${L3_L1_RPC:-http://l2-geth:8545}"

  l3-op-batcher:
    <<: *default-restart
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs
    environment:
      L3_L1_RPC: "${L3_L1_RPC:-http://op-gate:8545}"

  l3-op-proposer:
    <<: *default-restart
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs
    environment:
      L3_L1_RPC: "${L3_L1_RPC:-http://op-gate:8545}"

  op-challenger:
    <<: *default-restart
    profiles:
      - challengers
    networks:
      - l1_net
      - l2_net
      - shared_obs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${L2_CHALLENGER_METRICS_PORT:-7303}/metrics >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  l3-op-challenger:
    <<: *default-restart
    profiles:
      - challengers
    labels:
      ghost.layer: l3
    networks:
      - l3_net
      - shared_obs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${L3_CHALLENGER_METRICS_PORT:-8303}/metrics >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  bridge-service:
    <<: *default-restart
    networks:
      - l2_net
      - l3_net
      - shared_obs
    depends_on:
      l2-geth:
        condition: service_healthy
      l3-geth:
        condition: service_healthy

  prometheus:
    <<: *default-restart
    networks:
      - shared_obs
      - ingress_net
    ports:
      - "${PROM_BIND:-127.0.0.1}:9091:9090"

  alertmanager:
    <<: *default-restart
    networks:
      - shared_obs
      - ingress_net
    ports:
      - "${ALERT_BIND:-127.0.0.1}:9093:9093"

  loki:
    <<: *default-restart
    networks:
      - shared_obs
      - ingress_net
    ports:
      - "${LOKI_BIND:-127.0.0.1}:3100:3100"

  grafana:
    <<: *default-restart
    networks:
      - shared_obs
      - ingress_net
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  vector:
    <<: *default-restart
    networks:
      - shared_obs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f vector >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
