version: '3.9'
services:
  ai-monitor:
    container_name: ghost_ai-monitor
    image: ghostl/ai-monitor:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7575
    - RPC_L2=${RPC_L2}
    - GUARD_URL=${GUARD_URL}
    - ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}
    - OBSERVE_ONLY=1
    ports:
    - 7575:7575
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
