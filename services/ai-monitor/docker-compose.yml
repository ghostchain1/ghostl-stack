# stack-group: observability
# role: ai-monitor, ai-monitor-l1, ai-monitor-l3
# ports: 7575:7575, 7576:7576, 7577:7577
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
version: '3.9'
services:
  ai-monitor:
    container_name: ghost_ai-monitor
    image: ghostl/ai-monitor:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7575
    - RPC_L2=${RPC_L2}
    - RPC_URL=${RPC_L2}
    - GUARD_URL=${GUARD_URL}
    - ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}
    - OBSERVE_ONLY=1
    - SIMULATION_ENABLED=${AI_MONITOR_SIMULATION_ENABLED:-0}
    - TARGET_LAYER=${AI_MONITOR_LAYER_L2:-L2}
    ports:
    - 7575:7575
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
    - opstack_default
  ai-monitor-l1:
    container_name: ghost_ai-monitor-l1
    image: ghostl/ai-monitor:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7576
    - RPC_L2=${RPC_L2}
    - RPC_URL=${RPC_L1}
    - GUARD_URL=${GUARD_URL}
    - ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}
    - OBSERVE_ONLY=1
    - SIMULATION_ENABLED=${AI_MONITOR_SIMULATION_ENABLED:-0}
    - TARGET_LAYER=${AI_MONITOR_LAYER_L1:-L1}
    ports:
    - 7576:7576
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
    - opstack_default
  ai-monitor-l3:
    container_name: ghost_ai-monitor-l3
    image: ghostl/ai-monitor:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7577
    - RPC_L2=${RPC_L2}
    - RPC_URL=${RPC_L3}
    - GUARD_URL=${GUARD_URL}
    - ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}
    - OBSERVE_ONLY=1
    - SIMULATION_ENABLED=${AI_MONITOR_SIMULATION_ENABLED:-0}
    - TARGET_LAYER=${AI_MONITOR_LAYER_L3:-L3}
    ports:
    - 7577:7577
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
    - opstack_default
networks:
  ghost_net:
    external: true
  opstack_default:
    external: true
