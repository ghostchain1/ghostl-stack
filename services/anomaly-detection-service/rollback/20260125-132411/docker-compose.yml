version: '3.9'
services:
  anomaly-detection-service:
    container_name: ghost_anomaly-detection-service
    image: ghostl/anomaly-detection-service:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7616
    - PROM_URL=${PROM_URL}
    ports:
    - 7616:7616
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
