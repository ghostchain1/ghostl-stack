# stack-group: infra
# role: ai-clock-sync
# ports: 7690:7690
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  ai-clock-sync:
    container_name: ghost_ai-clock-sync
    image: ghostl/ai-clock-sync:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7690
    - CLOCK_SYNC_RPC_L1
    - CLOCK_SYNC_RPC_L2
    - CLOCK_SYNC_RPC_L3
    - CLOCK_SYNC_INTERVAL_MS
    - CLOCK_SYNC_DRIFT_THRESHOLD_SEC
    - RPC_TIMEOUT_MS
    - PROXY_TIMEOUT_MS
    - METRICS_PATH
    - REGISTRY_TIMEOUT_MS
    - REGISTRY_RETRY_COUNT
    - REGISTRY_CACHE_MS
    ports:
    - 7690:7690
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
    - opstack_default
networks:
  ghost_net:
    external: true
  opstack_default:
    external: true
