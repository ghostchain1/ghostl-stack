version: '3.9'
services:
  ai-clock-sync:
    container_name: ghost_ai-clock-sync
    image: ghostl/ai-clock-sync:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7690
    - CLOCK_SYNC_RPC_L1
    - CLOCK_SYNC_RPC_L2
    - CLOCK_SYNC_RPC_L3
    - CLOCK_SYNC_INTERVAL_MS
    - CLOCK_SYNC_DRIFT_THRESHOLD_SEC
    ports:
    - 7690:7690
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
