services:
  ghost-exec:
    build:
      context: ../..
      dockerfile: services/ghost-exec/Dockerfile
    env_file: .env.example
    ports:
      - "7260:7260"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
