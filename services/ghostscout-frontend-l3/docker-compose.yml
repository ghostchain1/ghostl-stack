# stack-group: apps
# role: ghostscout-frontend-l3
# ports: ${GHOSTSCOUT_L3_UI_PORT:-18653}:3000
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  ghostscout-frontend-l3:
    container_name: ghost_ghostscout-frontend-l3
    image: ghostl/ghostscout-frontend-l3:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
      NEXT_PUBLIC_API_HOST: ghostscout-l3:4000
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_APP_HOST: http://localhost:${GHOSTSCOUT_L3_UI_PORT:-18653}
      NEXT_PUBLIC_NETWORK_NAME: GhostL3
      NEXT_PUBLIC_NETWORK_ID: '903'
      NEXT_PUBLIC_NETWORK_ICON: https://raw.githubusercontent.com/blockscout/frontend/main/public/favicon.ico
      PORT: 3000
      HOST: 0.0.0.0
    ports:
    - ${GHOSTSCOUT_L3_UI_PORT:-18653}:3000
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghostchain_ghostchain
    - opstack_default
networks:
  ghostchain_ghostchain:
    external: true
  opstack_default:
    external: true
