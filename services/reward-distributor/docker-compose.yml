services:
  reward-distributor:
    container_name: ghost_reward-distributor
    image: ghostl/reward-distributor:local
    build:
      context: ./services/reward-distributor
    environment:
      PORT: 7684
      HOST: 0.0.0.0
      DB_PATH: /data/reward-distributor.sqlite
      GOVERNANCE_ROOT: /governance/proposals
      DISTRIBUTOR_ADMIN_TOKEN: ${REWARD_DISTRIBUTOR_ADMIN_TOKEN:-}
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data
      - ../../governance:/governance:ro
    ports:
      - "127.0.0.1:7684:7684"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7684/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - internal-services
      - observability

networks:
  internal-services:
    external: true
  observability:
    external: true
