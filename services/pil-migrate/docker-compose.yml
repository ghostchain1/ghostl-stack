# stack-group: infra
# role: pil-migrate
# ports: none
# volumes: ../ghost-pil:/work, ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  pil-migrate:
    container_name: ghost_pil-migrate
    image: ghostl/pil-migrate:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    working_dir: /work
    command:
    - sh
    - -lc
    - npm install && npm run migrate
    environment:
      DATABASE_URL: postgresql://ghost:${PIL_DB_PASSWORD:-ghostpass}@pil-postgres:5432/ghost_pil
      PIL_SEED_SAMPLE_DATA: ${PIL_SEED_SAMPLE_DATA:-true}
      PIL_REGISTRY_URL: http://ghost-registry:8088
      PIL_CHAIN_CONFIG_PATH: /work/config/chains.json
      PIL_JURISDICTIONS_PATH: /work/config/jurisdictions.json
      PIL_LEGAL_SIGNALS_PATH: /work/config/legal-signals.json
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ../ghost-pil:/work
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
