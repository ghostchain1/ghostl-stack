# stack-group: infra
# role: ghost-compliance-worker
# ports: none
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
version: '3.9'
services:
  ghost-compliance-worker:
    container_name: ghost_ghost-compliance-worker
    image: ghostl/ghost-compliance-worker:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    command:
    - node
    - dist/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ghost:${POSTGRES_PASSWORD:-ghostpass}@postgres:5432/ghost_compliance
      REDIS_URL: redis://redis:6379
      COMPLIANCE_API_URL: http://ghost-compliance:8090
      PREDICT_INTERVAL_SECONDS: 60
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghostchain-compliance_default
networks:
  ghostchain-compliance_default:
    external: true
