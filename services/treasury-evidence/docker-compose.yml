# stack-group: tokenomics
# role: treasury-evidence
# ports: none
# volumes: ./data:/data
version: '3.9'
services:
  treasury-evidence:
    container_name: ghost_treasury-evidence
    image: ghostl/treasury-evidence:local
    build:
      context: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    stop_grace_period: 30s
    volumes:
      - ./data:/data
    networks:
      - ghost_net

networks:
  ghost_net:
    external: true

