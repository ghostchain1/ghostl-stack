version: '3.9'
services:
  audit-log-service:
    container_name: ghost_audit-log-service
    image: ghostl/audit-log-service:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7641
    - AUDIT_LOG_PATH=/data/audit.log
    ports:
    - 7641:7641
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
