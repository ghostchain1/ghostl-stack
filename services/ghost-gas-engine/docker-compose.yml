# stack-group: infra
# role: ghost-gas-engine
# ports: 3210:3210
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  ghost-gas-engine:
    container_name: ghost_ghost-gas-engine
    image: ghostl/ghost-gas-engine:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    command:
    - node
    - dist/server.js
    environment:
      PORT: 3210
      DATABASE_URL: postgresql://ghost:${GAS_ENGINE_DB_PASSWORD:-ghostpass}@gas-engine-postgres:5432/ghost_gas
      REDIS_URL: redis://gas-engine-redis:6379
      CHAINS_CONFIG_PATH: /app/config/chains.json
      POLICIES_PATH: /app/config/gas-policies.json
      SEED_SAMPLE_DATA: ${GAS_ENGINE_SEED_SAMPLE_DATA:-true}
      RPC_L1: ${RPC_L1}
      RPC_L2: ${RPC_L2}
      RPC_L3: ${RPC_L3}
      GAS_TOKEN_L1: ${GAS_TOKEN_L1}
      GAS_TOKEN_L2: ${GAS_TOKEN_L2}
      GAS_TOKEN_L3: ${GAS_TOKEN_L3}
      SIGNER_PRIVATE_KEY: ${GAS_ENGINE_SIGNER_PRIVATE_KEY}
      SIGNER_PRIVATE_KEY_L1: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L1}
      SIGNER_PRIVATE_KEY_L2: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L2}
      SIGNER_PRIVATE_KEY_L3: ${GAS_ENGINE_SIGNER_PRIVATE_KEY_L3}
      ADMIN_TOKEN: ${GAS_ENGINE_ADMIN_TOKEN}
      RUN_MIGRATIONS: "1"
      MIGRATION_TIMEOUT_MS: 120000
      READINESS_FILE: /tmp/ghost_gas_engine_migrated
      HEALTHCHECK_URL: http://127.0.0.1:3210/ready
      AI_EVIDENCE_OUTPUT_DIR: ${AI_EVIDENCE_OUTPUT_DIR:-/data/evidence}
      AI_PROPOSAL_OUTPUT_DIR: ${AI_PROPOSAL_OUTPUT_DIR:-/data/proposals}
    ports:
    - 3210:3210
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
