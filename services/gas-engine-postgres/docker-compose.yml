# stack-group: infra
# role: gas-engine Postgres datastore (shared support)
# ports: 5433 -> 5432
# volumes: ./data (db), ./healthcheck.sh (read-only)
services:
  gas-engine-postgres:
    container_name: ghost_gas-engine-postgres
    image: ghostl/gas-engine-postgres:local
    build:
      context: .
    env_file:
    - .env
    command:
    - postgres
    environment:
      POSTGRES_DB: ghost_gas
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ${GAS_ENGINE_DB_PASSWORD:-ghostpass}
    ports:
    - 5433:5432
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/var/lib/postgresql/data
    - ./data:/data
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
