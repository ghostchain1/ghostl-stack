version: 1
metadata:
  owner: ghostvm-ai
  environment: testnet

network_segments:
  mgmt:
    cidr: 10.10.0.0/24
    gateway: 10.10.0.1
  l1:
    cidr: 10.20.0.0/24
    gateway: 10.20.0.1
  l2:
    cidr: 10.30.0.0/24
    gateway: 10.30.0.1
  l3:
    cidr: 10.40.0.0/24
    gateway: 10.40.0.1
  docker:
    cidr: 172.30.0.0/16
    gateway: 172.30.0.1
  external:
    cidr: 38.247.149.0/24
    gateway: 38.247.149.1

ipam:
  external_primary_ip: 38.247.149.218
  external_reserved_ips:
    - 38.247.149.218
    - 38.247.149.219
    - 38.247.149.220
    - 38.247.149.221
    - 38.247.149.222
    - 38.247.149.223
    - 38.247.149.224
  public_role_bindings:
    edge_gateway:      38.247.149.218
    l1_edge:           38.247.149.219
    l2_edge:           38.247.149.220
    l3_edge:           38.247.149.221
    apps_edge:         38.247.149.222
    ai_edge:           38.247.149.223
    observability_edge: 38.247.149.224

hypervisor:
  bridges:
    - name: br-mgmt
      segment: mgmt
    - name: br-l1
      segment: l1
    - name: br-l2
      segment: l2
    - name: br-l3
      segment: l3
  nftables:
    default_policy: drop
    allow_established: true

vms:
  - name: ghost-gateway-node
    role: edge
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.218/24
        gateway: 38.247.149.1
  - name: ghost-l1-node
    role: l1
    interfaces:
      - name: ens3
        segment: l1
        address: 10.20.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.219/24
        gateway: 38.247.149.1
  - name: ghost-l2-node
    role: l2
    interfaces:
      - name: ens3
        segment: l2
        address: 10.30.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.220/24
        gateway: 38.247.149.1
  - name: ghost-l3-node
    role: l3
    interfaces:
      - name: ens3
        segment: l3
        address: 10.40.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.221/24
        gateway: 38.247.149.1
  - name: ghost-apps-node
    role: apps
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.22/24
      - name: ens4
        segment: external
        address: 38.247.149.222/24
        gateway: 38.247.149.1
  - name: ghost-ai-node
    role: ai
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.23/24
      - name: ens4
        segment: external
        address: 38.247.149.223/24
        gateway: 38.247.149.1
  - name: ghost-observability-node
    role: observability
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.24/24
      - name: ens4
        segment: external
        address: 38.247.149.224/24
        gateway: 38.247.149.1

docker:
  managed_networks:
    - name: ghost-devnet
      driver: bridge
      subnet: 172.31.0.0/24
      gateway: 172.31.0.1
  enforce_labels:
    l1: ghost.layer=l1
    l2: ghost.layer=l2
    l3: ghost.layer=l3

dns:
  resolver: 10.10.0.2
  forwarders:
    - 1.1.1.1
    - 8.8.8.8
