version: 1
metadata:
  owner: ghostvm-ai
  environment: devnet
  profile: live-public-controller
  notes:
    - ghostchain-devnet is the current public ingress and controller VM.
    - enp1s0 carries the routed public block used by GhostChain web properties.
    - enp2s0 is the libvirt/NAT backhaul used for local VM tooling and fallback egress.

network_segments:
  external:
    cidr: 38.247.149.0/24
    gateway: 38.247.149.1
    bridge: enp1s0
  backhaul:
    cidr: 192.168.122.0/24
    gateway: 192.168.122.1
    bridge: enp2s0
  legacy_mgmt:
    cidr: 10.50.99.0/24
    gateway: 10.50.99.1
    bridge: gs-mgmt

ipam:
  external_primary_ip: "38.247.149.218"
  external_reserved_ips:
    - "38.247.149.219"
    - "38.247.149.220"
    - "38.247.149.221"
    - "38.247.149.222"
    - "38.247.149.223"
    - "38.247.149.224"
  public_role_bindings:
    devnet: "38.247.149.219"
    live: "38.247.149.220"
    exchange: "38.247.149.221"
    ai: "38.247.149.222"
    bridge: "38.247.149.223"
    enterprise: "38.247.149.224"
  backhaul_ip: "192.168.122.205"

hypervisor:
  bridges: []
  managed_interfaces:
    - enp1s0
    - enp2s0
  ip_forwarding: true
  nftables:
    default_policy: drop
    allow_established: true

vms:
  - name: ghostchain-devnet
    role: devnet
    comment: "Live public controller: enp1s0 carries 38.247.149.218-224; enp2s0 is libvirt backhaul"
    interfaces:
      - name: enp1s0
        segment: external
        address: 38.247.149.219/24
        aliases:
          - 38.247.149.218/24
          - 38.247.149.220/24
          - 38.247.149.221/24
          - 38.247.149.222/24
          - 38.247.149.223/24
          - 38.247.149.224/24
        gateway: 38.247.149.1
        nameservers: [8.8.8.8, 1.1.1.1, 8.8.4.4]
      - name: enp2s0
        segment: backhaul
        address: 192.168.122.205/24
        gateway: 192.168.122.1
        nameservers: [192.168.122.1, 8.8.8.8]

docker:
  managed_networks:
    - name: ghostweb
      driver: bridge
      subnet: 172.21.0.0/16
      gateway: 172.21.0.1
    - name: ghost_net
      driver: bridge
      subnet: 172.18.0.0/16
      gateway: 172.18.0.1
    - name: ghostchain-api_default
      driver: bridge
      subnet: 172.20.0.0/16
      gateway: 172.20.0.1
    - name: ghostchain-web_default
      driver: bridge
      subnet: 172.22.0.0/16
      gateway: 172.22.0.1
    - name: ghost_ai_vault_net
      driver: bridge
      subnet: 172.23.0.0/16
      gateway: 172.23.0.1
    - name: ghostchain-compliance_default
      driver: bridge
      subnet: 172.19.0.0/16
      gateway: 172.19.0.1
  enforce_labels:
    l1: ghost.layer=l1
    l2: ghost.layer=l2
    l3: ghost.layer=l3

dns:
  resolver: 1.1.1.1
  forwarders:
    - 1.1.1.1
    - 8.8.8.8

planned_vms:
  - name: ghost-web
    role: web
    address: 10.50.99.10/24
  - name: ghost-dns-slave
    role: dns
    address: 10.50.99.66/24
  - name: ghostchain-testnet-l1
    role: l1
    address: 10.50.99.71/24
  - name: ghost-testnet-validator
    role: l1
    address: 10.50.99.73/24
  - name: ghostl2-testnet
    role: l2
    address: 10.50.99.77/24
  - name: ghostl3-testnet
    role: l3
    address: 10.50.99.79/24
  - name: ghostchain-mainnet-l1
    role: l1
    address: 10.50.99.70/24
  - name: ghost-mainnet-validator
    role: l1
    address: 10.50.99.72/24
  - name: ghostl2-mainnet
    role: l2
    address: 10.50.99.76/24
  - name: ghostl3-mainnet
    role: l3
    address: 10.50.99.78/24
