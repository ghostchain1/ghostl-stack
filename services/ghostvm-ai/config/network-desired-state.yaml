version: 1
metadata:
  owner: ghostvm-ai
  environment: devnet
  # ── Network topology — Ghoststack-baremetal hypervisor ──────────────────
  # Primary uplink:   208.110.71.164/26  (block 208.110.71.128/26, gw .129)
  # Secondary uplink: 38.247.149.218/24  (block 38.247.149.0/24,   gw .1)
  # Internal mgmt:    10.50.99.0/24      (gs-mgmt libvirt NAT, gw 10.50.99.1)

network_segments:
  # Internal management network — all KVM VMs (enp1s0)
  mgmt:
    cidr: 10.50.99.0/24
    gateway: 10.50.99.1
    bridge: virbr-ghoststack
    dhcp_range: "10.50.99.100-10.50.99.254"
  # Public secondary uplink — VMs with a direct public NIC (enp2s0) use br0
  public:
    cidr: 38.247.149.0/24
    gateway: 38.247.149.1
    netmask: 255.255.255.0
    bridge: br0
  # Primary uplink (hypervisor-only — not directly assigned to VMs)
  primary_uplink:
    cidr: 208.110.71.128/26
    gateway: 208.110.71.129
    bridge: br0
  # Docker bridge (host-local container networks)
  docker:
    cidr: 172.17.0.0/16
    gateway: 172.17.0.1

ipam:
  # Hypervisor host addresses
  hypervisor_primary_ip: "208.110.71.164"    # br0 — primary uplink
  hypervisor_public_ip: "38.247.149.218"     # br0 — secondary uplink
  # VM public IP assignments (enp2s0 / br0)
  vm_public_ips:
    ghostchain-devnet: "38.247.149.219"
  # Reserved — available for future VM assignments
  reserved_public_ips:
    - "38.247.149.220"
    - "38.247.149.221"
    - "38.247.149.222"
    - "38.247.149.223"
    - "38.247.149.224"

hypervisor:
  bridges:
    - name: virbr-ghoststack
      segment: mgmt
      mode: nat
    - name: br0
      segment: public
      mode: bridge
  ip_forwarding: true
  nftables:
    default_policy: drop
    allow_established: true

# ── KVM VM fleet (canonical from infra/hypervisor/provision/inventory.sh) ──
vms:
  - name: ghost-web
    role: web
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.10/24
        gateway: 10.50.99.1
  - name: ghost-ghostchain-bootnode-1
    role: ghostchain-bootnode
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.20/24
        gateway: 10.50.99.1
  - name: ghost-ghostchain-node1-1
    role: ghostchain-node
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.21/24
        gateway: 10.50.99.1
  - name: ghost-ghostchain-node2-1
    role: ghostchain-node
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.22/24
        gateway: 10.50.99.1
  - name: gns-bind9
    role: gns-dns
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.30/24
        gateway: 10.50.99.1
  - name: gns-kea
    role: gns-dhcp
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.31/24
        gateway: 10.50.99.1
  - name: gns-postgres
    role: gns-db
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.32/24
        gateway: 10.50.99.1
  - name: gns-indexer
    role: gns-indexer
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.33/24
        gateway: 10.50.99.1
  - name: gns-api
    role: gns-api
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.34/24
        gateway: 10.50.99.1
  - name: ghostchain-devnet
    role: devnet
    comment: "Dual-homed: enp1s0=mgmt, enp2s0=public (38.247.149.219)"
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.45/24
        routes:
          - to: 10.50.99.0/24
            via: 10.50.99.1
        nameservers: [10.50.99.66, 1.1.1.1]
      - name: enp2s0
        segment: public
        address: 38.247.149.219/24
        gateway: 38.247.149.1
        nameservers: [1.1.1.1, 8.8.8.8]
  - name: ghostchain-mainnet-l1
    role: l1-mainnet-fullnode
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.70/24
        gateway: 10.50.99.1
  - name: ghostchain-testnet-l1
    role: l1-testnet-fullnode
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.71/24
        gateway: 10.50.99.1
  - name: ghost-mainnet-validator
    role: l1-mainnet-validator
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.72/24
        gateway: 10.50.99.1
  - name: ghost-testnet-validator
    role: l1-testnet-validator
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.73/24
        gateway: 10.50.99.1
  - name: ghostl2-mainnet
    role: l2-mainnet
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.76/24
        gateway: 10.50.99.1
  - name: ghostl2-testnet
    role: l2-testnet
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.77/24
        gateway: 10.50.99.1
  - name: ghostl3-mainnet
    role: l3-mainnet
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.78/24
        gateway: 10.50.99.1
  - name: ghostl3-testnet
    role: l3-testnet
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.79/24
        gateway: 10.50.99.1
  - name: ghost-dns-slave
    role: dns-secondary
    interfaces:
      - name: enp1s0
        segment: mgmt
        address: 10.50.99.66/24
        gateway: 10.50.99.1

vms:
  - name: ghost-gateway-node
    role: edge
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.218/24
        gateway: 38.247.149.1
  - name: ghost-l1-node
    role: l1
    interfaces:
      - name: ens3
        segment: l1
        address: 10.20.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.219/24
        gateway: 38.247.149.1
  - name: ghost-l2-node
    role: l2
    interfaces:
      - name: ens3
        segment: l2
        address: 10.30.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.220/24
        gateway: 38.247.149.1
  - name: ghost-l3-node
    role: l3
    interfaces:
      - name: ens3
        segment: l3
        address: 10.40.0.10/24
      - name: ens4
        segment: external
        address: 38.247.149.221/24
        gateway: 38.247.149.1
  - name: ghost-apps-node
    role: apps
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.22/24
      - name: ens4
        segment: external
        address: 38.247.149.222/24
        gateway: 38.247.149.1
  - name: ghost-ai-node
    role: ai
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.23/24
      - name: ens4
        segment: external
        address: 38.247.149.223/24
        gateway: 38.247.149.1
  - name: ghost-observability-node
    role: observability
    interfaces:
      - name: ens3
        segment: mgmt
        address: 10.10.0.24/24
      - name: ens4
        segment: external
        address: 38.247.149.224/24
        gateway: 38.247.149.1

docker:
  managed_networks:
    - name: ghost-devnet
      driver: bridge
      subnet: 172.31.0.0/24
      gateway: 172.31.0.1
  enforce_labels:
    l1: ghost.layer=l1
    l2: ghost.layer=l2
    l3: ghost.layer=l3

dns:
  resolver: 10.10.0.2
  forwarders:
    - 1.1.1.1
    - 8.8.8.8
