# stack-group: infra
# role: ghostscout-db
# ports: none
# volumes: ./data:/var/lib/postgresql/data, ./init/create_dbs.sql:/docker-entrypoint-initdb.d/create_dbs.sql:ro, ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
version: '3.9'
services:
  ghostscout-db:
    container_name: ghost_ghostscout-db
    image: ghostl/ghostscout-db:local
    build:
      context: .
    env_file:
    - .env
    command:
    - postgres
    - -c
    - max_connections=200
    environment:
      POSTGRES_USER: ghostscout
      POSTGRES_PASSWORD: ${GHOSTSCOUT_DB_PASSWORD:-ghostpass}
      POSTGRES_DB: ghostscout_l1
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/var/lib/postgresql/data
    - ./init/create_dbs.sql:/docker-entrypoint-initdb.d/create_dbs.sql:ro
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
      ghostchain_ghostchain:
        aliases:
        - ghostscout-postgres
        - ghostscout-db
      opstack_default:
        aliases:
        - ghostscout-postgres
        - ghostscout-db
networks:
  ghostchain_ghostchain:
    external: true
  opstack_default:
    external: true
