      - RPC_CHILD=${RPC_L3}
      - ROLLUP_ADDRESS=${L2_ROLLUP_L3_ADDRESS}
      - CHALLENGER_PRIVATE_KEY=${CHALLENGER_PRIVATE_KEY}
      # Keep challenger stability assumptions aligned with proposer (latest-confirmations).
      - ROLLUP_CHILD_HEAD_TAG=${L3_ROLLUP_CHILD_HEAD_TAG:-latest}
      - STATE_DIR=/state
    volumes:
