    image: ghostl/ghost-rollup-proposer:local
    depends_on:
      ghost-registry:
        condition: service_healthy
    env_file:
      - ./stack.env
    environment:
      - PORT=7272
      - RPC_SETTLEMENT=${RPC_L2}
      - RPC_CHILD=${RPC_L3}
      - ROLLUP_ADDRESS=${L2_ROLLUP_L3_ADDRESS}
      - PROPOSER_PRIVATE_KEY=${PROPOSER_PRIVATE_KEY}
      # For sub-second soft confirmations, default to latest-confirmations instead of OP "safe".
      - ROLLUP_CHILD_HEAD_TAG=${L3_ROLLUP_CHILD_HEAD_TAG:-latest}
      # Catch-up tuning: L3 can start far behind; increase batch size and parallelism to reduce lag faster.
      - CATCHUP_LAG_THRESHOLD=${L3_ROLLUP_CATCHUP_LAG_THRESHOLD:-512}
      - CATCHUP_BATCH_SIZE=${L3_ROLLUP_CATCHUP_BATCH_SIZE:-1000}
      - BLOCK_FETCH_PARALLELISM=${L3_ROLLUP_BLOCK_FETCH_PARALLELISM:-50}
      - STATE_DIR=/state
    volumes:
      - ./.state/ghost-rollup-proposer:/state
    ports:
      - "7272:7272"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf "http://127.0.0.1:${PORT:-7272}/health" || curl -sf "http://127.0.0.1:${PORT:-7272}/" || exit 1
      interval: 15s
