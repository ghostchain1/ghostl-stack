    environment:
      - PORT=7710
      - SERVICES_ROOT=${SERVICES_ROOT:-/services}
      - AI_VAULT_EXECUTE=${AI_VAULT_EXECUTE:-0}
      - AI_VAULT_DEFAULT_DECISION=${AI_VAULT_DEFAULT_DECISION:-deny}
      - AI_VAULT_FORWARD_CLIENT_TOKEN=${AI_VAULT_FORWARD_CLIENT_TOKEN:-0}
      - AI_VAULT_POLICY_PATH=/app/policy.generated.json
      - AI_VAULT_POLICY_WRITE=${AI_VAULT_POLICY_WRITE:-0}
      - AI_VAULT_RATE_WINDOW_MS=${AI_VAULT_RATE_WINDOW_MS:-60000}
      - AI_VAULT_RATE_LIMIT=${AI_VAULT_RATE_LIMIT:-120}
      - AI_VAULT_BURST_LIMIT=${AI_VAULT_BURST_LIMIT:-40}
      - AI_VAULT_BLOCK_MS=${AI_VAULT_BLOCK_MS:-300000}
      - AI_VAULT_ROTATE_INTERVAL_MS=${AI_VAULT_ROTATE_INTERVAL_MS:-900000}
    volumes:
      - /home/ghost/ghostl-stack/services:/services:ro
    ports:
      - "7710:7710"

