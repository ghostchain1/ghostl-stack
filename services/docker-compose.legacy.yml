      - RPC_L1=${RPC_L1}
      - RPC_L2=${RPC_L2}
      - RPC_L3=${RPC_L3}
      # Prefer docker-network RPCs when available (see services/ghost-relayer/entrypoint.sh).
      - RPC_L2_DOCKER=${RPC_L2_DOCKER:-http://l2-geth:8545}
      - RPC_L3_DOCKER=${RPC_L3_DOCKER:-http://l3-geth:8545}
      - BRIDGE_L2L3_ADDRESS=${BRIDGE_L2L3_ADDRESS}
      - L1_ROLLUP_L2_ADDRESS=${L1_ROLLUP_L2_ADDRESS}
      - L2_ROLLUP_L3_ADDRESS=${L2_ROLLUP_L3_ADDRESS}
      - L3_INBOX_ADDRESS=${L3_INBOX_ADDRESS}
      - L3_TOKEN_FACTORY_ADDRESS=${L3_TOKEN_FACTORY_ADDRESS}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - L2_RELAYER_PRIVATE_KEY=${L2_RELAYER_PRIVATE_KEY}
      - STATE_DIR=/state
    volumes:
      - ./.state/ghost-relayer:/state
    ports:
      - "7171:7171"
    networks:
      - default
      - opstack_default
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:7171/health').then(r=>{if(!r.ok)process.exit(1);return r.json();}).then(j=>{if(!j.ok)process.exit(1);}).catch(()=>process.exit(1));"
      interval: 15s
      timeout: 5s
      retries: 5

