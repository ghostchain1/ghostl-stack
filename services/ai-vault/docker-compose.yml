services:
  ai-vault:
    container_name: ghost_ai-vault
    build:
      context: .
    image: ghostl/ai-vault:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-7710}
      - VAULT_ADDR=${VAULT_ADDR:-http://host.docker.internal:8200}
      - VAULT_NAMESPACE=${VAULT_NAMESPACE:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID:-}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID:-}
      - SERVICES_ROOT=${SERVICES_ROOT:-/services}
      - AI_VAULT_EXECUTE=${AI_VAULT_EXECUTE:-0}
      - AI_VAULT_DEFAULT_DECISION=${AI_VAULT_DEFAULT_DECISION:-deny}
      - AI_VAULT_FORWARD_CLIENT_TOKEN=${AI_VAULT_FORWARD_CLIENT_TOKEN:-0}
      - AI_VAULT_POLICY_PATH=${AI_VAULT_POLICY_PATH:-/app/policy.generated.json}
      - AI_VAULT_POLICY_WRITE=${AI_VAULT_POLICY_WRITE:-0}
      - AI_VAULT_RATE_WINDOW_MS=${AI_VAULT_RATE_WINDOW_MS:-60000}
      - AI_VAULT_RATE_LIMIT=${AI_VAULT_RATE_LIMIT:-120}
      - AI_VAULT_BURST_LIMIT=${AI_VAULT_BURST_LIMIT:-40}
      - AI_VAULT_BLOCK_MS=${AI_VAULT_BLOCK_MS:-300000}
      - AI_VAULT_ROTATE_INTERVAL_MS=${AI_VAULT_ROTATE_INTERVAL_MS:-900000}
    volumes:
      - ${HOST_SERVICES_ROOT:-..}:/services:ro
    ports:
      - "7710:7710"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7710/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
