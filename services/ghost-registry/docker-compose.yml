# stack-group: infra
# role: ghost-registry
# ports: 18088:8088
# volumes: ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  ghost-registry:
    container_name: ghost_ghost-registry
    image: ghostl/ghost-registry:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    command:
    - node
    - dist/server.js
    environment:
    - PORT=8088
    ports:
    - 18088:8088
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
