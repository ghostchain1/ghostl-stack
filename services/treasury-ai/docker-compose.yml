# stack-group: tokenomics
# role: treasury-ai
# ports: 7630:7630
# volumes: ./data:/data
services:
  treasury-ai:
    container_name: ghost_treasury-ai
    image: ghostl/treasury-ai:local
    build:
      context: .
    env_file:
      - .env
    environment:
      - PORT=7630
      - TREASURY_STATE_FILE=/data/treasury-proposals.json
    ports:
      - "7630:7630"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7630/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./data:/data
    networks:
      - ghost_net

networks:
  ghost_net:
    external: true

