# stack-group: infra
# role: ghost-relayer
# ports: 7171:7171
# volumes: ./data:/state, ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  ghost-relayer:
    container_name: ghost_ghost-relayer
    image: ghostl/ghost-relayer:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    environment:
    - PORT=7171
    - RPC_L1=${RPC_L1}
    - RPC_L2=${RPC_L2}
    - RPC_L3=${RPC_L3}
    - BRIDGE_L2L3_ADDRESS=${BRIDGE_L2L3_ADDRESS}
    - L1_ROLLUP_L2_ADDRESS=${L1_ROLLUP_L2_ADDRESS}
    - L2_ROLLUP_L3_ADDRESS=${L2_ROLLUP_L3_ADDRESS}
    - L3_INBOX_ADDRESS=${L3_INBOX_ADDRESS}
    - L3_TOKEN_FACTORY_ADDRESS=${L3_TOKEN_FACTORY_ADDRESS}
    - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
    - L2_RELAYER_PRIVATE_KEY=${L2_RELAYER_PRIVATE_KEY}
    - STATE_DIR=/state
    ports:
    - 7171:7171
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ./data:/state
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
    - opstack_default
networks:
  ghost_net:
    external: true
  opstack_default:
    external: true
