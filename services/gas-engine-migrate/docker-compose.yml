# stack-group: infra
# role: gas-engine-migrate
# ports: none
# volumes: ../ghost-gas-engine:/work, ./data:/data, ./entrypoint.sh:/entrypoint.sh:ro, ./healthcheck.sh:/healthcheck.sh:ro
services:
  gas-engine-migrate:
    container_name: ghost_gas-engine-migrate
    image: ghostl/gas-engine-migrate:local
    build:
      context: .
    env_file:
    - .env
    entrypoint:
    - /bin/bash
    - /entrypoint.sh
    working_dir: /work
    command:
    - sh
    - -lc
    - npm install && npm run migrate
    environment:
      DATABASE_URL: postgresql://ghost:${GAS_ENGINE_DB_PASSWORD:-ghostpass}@gas-engine-postgres:5432/ghost_gas
      REDIS_URL: redis://gas-engine-redis:6379
      SEED_SAMPLE_DATA: ${GAS_ENGINE_SEED_SAMPLE_DATA:-true}
      RPC_L1: ${RPC_L1}
      RPC_L2: ${RPC_L2}
      RPC_L3: ${RPC_L3}
      GAS_TOKEN_L1: ${GAS_TOKEN_L1}
      GAS_TOKEN_L2: ${GAS_TOKEN_L2}
      GAS_TOKEN_L3: ${GAS_TOKEN_L3}
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - /healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 512m
    volumes:
    - ../ghost-gas-engine:/work
    - ./data:/data
    - ./entrypoint.sh:/entrypoint.sh:ro
    - ./healthcheck.sh:/healthcheck.sh:ro
    networks:
    - ghost_net
networks:
  ghost_net:
    external: true
