services:
  autonomous-vault-hypervisor:
    container_name: ghost_autonomous-vault-hypervisor
    build:
      context: .
    image: ghostl/autonomous-vault-hypervisor:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-7720}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - GHOSTBRAIN_URL=${GHOSTBRAIN_URL:-http://ghostbrain-core:7900}
      - GHOSTBRAIN_ENABLED=${GHOSTBRAIN_ENABLED:-1}
      - AI_VAULT_ADDR=${AI_VAULT_ADDR:-http://ai-vault:7710}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID:-}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID:-}
      - VAULT_NAMESPACE=${VAULT_NAMESPACE:-}
      - ROTATE_ENABLED=${ROTATE_ENABLED:-1}
      - ROTATE_INTERVAL_MS=${ROTATE_INTERVAL_MS:-900000}
      - HYPERVISOR_HOST=${HYPERVISOR_HOST:-}
      - HYPERVISOR_USER=${HYPERVISOR_USER:-ghost}
      - HYPERVISOR_SSH_PORT=${HYPERVISOR_SSH_PORT:-22}
      - HYPERVISOR_SSH_KEY_PATH=${HYPERVISOR_SSH_KEY_PATH:-}
      - SSH_ENABLED=${SSH_ENABLED:-1}
      - DOCKER_ENABLED=${DOCKER_ENABLED:-1}
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
      - DOCKER_HOST=${DOCKER_HOST:-}
      - RECONCILE_INTERVAL_MS=${RECONCILE_INTERVAL_MS:-60000}
      - REMEDIATE_ENABLED=${REMEDIATE_ENABLED:-1}
      - MAX_REMEDIATIONS_PER_RUN=${MAX_REMEDIATIONS_PER_RUN:-3}
      - MAX_CONTAINER_RESTARTS=${MAX_CONTAINER_RESTARTS:-5}
      - RESTART_COOLDOWN_MS=${RESTART_COOLDOWN_MS:-120000}
      - POLICY_PATH=${POLICY_PATH:-/app/policy.json}
      - EXECUTE_ACTIONS=${EXECUTE_ACTIONS:-1}
      - EMERGENCY_LOCK=${EMERGENCY_LOCK:-0}
      - HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - REQUIRE_SIGNATURE=${REQUIRE_SIGNATURE:-0}
      - VM_LAYER_MAP=${VM_LAYER_MAP:-{}}
    volumes:
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH key for hypervisor access (optional — use HYPERVISOR_SSH_KEY_PATH in .env)
      - ${SSH_KEY_DIR:-/root/.ssh}:/home/nonroot/.ssh:ro
      # libvirt socket for local VM management (optional)
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock:rw
      # Policy persistence
      - avh-policy:/app/policy.json
    ports:
      - "${PORT_BIND:-7720}:7720"
    networks:
      - ghostnet
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:7720/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

volumes:
  avh-policy:

networks:
  ghostnet:
    external: true
    name: ${GHOST_NETWORK:-ghostnet}
