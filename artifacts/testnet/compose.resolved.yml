      BRIDGE_ADDRESS: 0xDadd1125B8Df98A66Abd5EB302C0d9Ca5A061dC2
      CHAIN_ID: "903"
      DEST_BRIDGE_ADDRESS: 0x130A46b6E41DB6E1e18fb9c759F223c459190e90
      GHOST_DEST_RPC_URL: http://ghost-exec-l3:7270
      GHOST_LAYER: L3
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l3:7273
      GHOST_SOURCE_RPC_URL: http://ghost-exec-l2:7260
      PORT: "7274"
