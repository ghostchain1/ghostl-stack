    container_name: ghost-exec-l2
    environment:
      CHAIN_ID: "901"
      GAS_LIMIT_CAP: "30000000"
      GHOST_EXEC_RPC_URL: http://host.docker.internal:29547
      GHOST_LAYER: L2
      MAX_TX_PER_BLOCK: "1000"
      PORT: "7260"
      STATE_DIR: /state
