      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7265
        published: "7265"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: ghost-proof-l2-state
        target: /state
        volume: {}
  ghost-proof-l3:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-proof/Dockerfile
    container_name: ghost-proof-l3
    depends_on:
      ghost-exec-l3:
        condition: service_healthy
        required: true
    environment:
      CHAIN_ID: "903"
      GHOST_EXEC_URL: http://ghost-exec-l3:7270
      GHOST_LAYER: L3
      GHOST_PARENT_RPC_URL: http://ghost-exec-l2:7260
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l3:7273
      PORT: "7275"
      PROOF_MODE: fraud
      ROLLUP_ADDRESS: 0x130A46b6E41DB6E1e18fb9c759F223c459190e90
      STATE_DIR: /state
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7275/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7275
        published: "7275"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: ghost-proof-l3-state
        target: /state
        volume: {}
  ghost-sequencer-l2:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-sequencer/Dockerfile
    container_name: ghost-sequencer-l2
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
        required: true
    environment:
      BLOCK_TIME_MS: "2000"
      CHAIN_ID: "901"
      GAS_LIMIT_CAP: "30000000"
      GHOST_EXEC_URL: http://ghost-exec-l2:7260
      GHOST_LAYER: L2
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l2:7263
      MAX_TX_PER_BLOCK: "1000"
      PORT: "7261"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7261/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7261
        published: "7261"
        protocol: tcp
    restart: unless-stopped
  ghost-sequencer-l3:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-sequencer/Dockerfile
    container_name: ghost-sequencer-l3
    depends_on:
      ghost-exec-l3:
        condition: service_healthy
        required: true
    environment:
      BLOCK_TIME_MS: "1000"
      CHAIN_ID: "903"
      GAS_LIMIT_CAP: "20000000"
      GHOST_EXEC_URL: http://ghost-exec-l3:7270
      GHOST_LAYER: L3
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l3:7273
      MAX_TX_PER_BLOCK: "500"
      PORT: "7271"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7271/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7271
        published: "7271"
        protocol: tcp
    restart: unless-stopped
  ghost-settlement-l2:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-settlement/Dockerfile
    container_name: ghost-settlement-l2
    environment:
      CHAIN_ID: "901"
      CHALLENGE_PERIOD_SECONDS: "300"
      CONFIRMATIONS: "12"
      FINALITY_ORACLE_ADDRESS: 0x7B3Be2dDDdDf9A0a3fE1DC57B98980F662C3a422
      GHOST_LAYER: L2
      GHOST_PARENT_RPC_URL: http://host.docker.internal:18545
      GHOST_PROOF_URL: http://ghost-proof-l2:7265
      PORT: "7263"
      ROLLUP_ADDRESS: 0xad32D5C2Da9f4159C4cc98686C005852b3905355
      STATE_DIR: /state
    extra_hosts:
      - host.docker.internal=host-gateway
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7263/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7263
        published: "7263"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: ghost-settlement-l2-state
        target: /state
        volume: {}
  ghost-settlement-l3:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-settlement/Dockerfile
    container_name: ghost-settlement-l3
    environment:
      CHAIN_ID: "903"
      CHALLENGE_PERIOD_SECONDS: "180"
      CONFIRMATIONS: "6"
      FINALITY_ORACLE_ADDRESS: 0x87F850cbC2cFfac086F20d0d7307E12d06fA2127
      GHOST_LAYER: L3
      GHOST_PARENT_RPC_URL: http://ghost-exec-l2:7260
      GHOST_PROOF_URL: http://ghost-proof-l3:7275
      PORT: "7273"
      ROLLUP_ADDRESS: 0x130A46b6E41DB6E1e18fb9c759F223c459190e90
      STATE_DIR: /state
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7273/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7273
        published: "7273"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: ghost-settlement-l3-state
        target: /state
        volume: {}
  ghostchain-bootnode:
    cap_drop:
      - ALL
    cpus: 0.5
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /config/boot.key ]; then
          echo "[bootnode] Generating boot.key..."
          bootnode -genkey /config/boot.key
        fi
        BOOT_ID="$$(bootnode --nodekey /config/boot.key --writeaddress)"
        echo "enode://$${BOOT_ID}@10.89.0.21:30301" > /config/bootnode-enode.txt
        exec bootnode --nodekey /config/boot.key --addr :30301
    environment:
      AUTH_JWT_FILE: /secrets/jwtsecret
      BOOTNODE_IP: 172.31.0.21
      BOOTNODE_PORT: "30301"
      CHAIN_ID: "14000101"
      GETH_IMAGE: ghostchain/ghost-geth:alltools-v1.13.14
      L1_AUTHRPC_VHOSTS: localhost,127.0.0.1
      L1_GHOSTCHAIN_BOOTNODE_IP: 172.31.0.21
      L1_GHOSTCHAIN_GHOSTSCOUT_IP: 172.31.0.31
      L1_GHOSTCHAIN_NODE1_IP: 172.31.0.22
      L1_GHOSTCHAIN_NODE2_IP: 172.31.0.23
      L1_GHOSTCHAIN_RPC_PROXY_IP: 172.31.0.30
      L1_GHOSTCHAIN_SUBNET: 172.31.0.0/16
      L1_GID: "1002"
      L1_HTTP_APIS: eth,net,web3,debug,txpool
      L1_HTTP_CORS: http://localhost,http://127.0.0.1
      L1_HTTP_VHOSTS: localhost,127.0.0.1,ghostchain-node1
      L1_METRICS_PORT: "18660"
      L1_P2P_PORT: "18551"
      L1_RPC_AUTH_PORT: "18552"
      L1_RPC_AUTH_TOKEN: ""
      L1_RPC_CORS_ORIGINS: http://localhost,http://127.0.0.1
      L1_RPC_HTTP_PORT: "18545"
      L1_RPC_PROXY_LOG_REQUESTS: "0"
      L1_RPC_RATE_LIMIT_ALLOWLIST: 127.0.0.1,::1,172.31.0.1
      L1_RPC_RATE_LIMIT_BURST: "40"
      L1_RPC_RATE_LIMIT_PER_MINUTE: "120"
      L1_RPC_RATE_WINDOW_MS: "60000"
      L1_RPC_REQUIRE_AUTH: "0"
      L1_RPC_SENSITIVE_METHODS: personal_,debug_,txpool_,admin_
      L1_RPC_WS_PORT: "18546"
      L1_UID: "1000"
      L1_WS_APIS: eth,net,web3
      L1_WS_ORIGINS: http://localhost,http://127.0.0.1
    image: ghostchain/ghost-geth:v1.13.14
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "268435456"
    networks:
      ghostchain:
        ipv4_address: 10.89.0.21
    ports:
      - mode: ingress
        target: 30301
        published: "30301"
        protocol: udp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 1000:1002
    volumes:
      - type: bind
        source: /home/ghost/ghostl-stack/infra/ghostchain/data/bootnode
        target: /config
        bind: {}
  ghostchain-node1:
    cap_drop:
      - ALL
    cpus: 1.5
    depends_on:
      ghostchain-bootnode:
        condition: service_started
        required: true
    entrypoint:
      - /bin/sh
      - /config/run-node.sh
    environment:
      AUTH_JWT_FILE: /secrets/jwtsecret
      AUTH_PORT: "8551"
      AUTHRPC_VHOSTS: localhost,127.0.0.1
      BOOTNODE_IP: 172.31.0.21
      BOOTNODE_PORT: "30301"
      CHAIN_ID: "14000101"
      GETH_IMAGE: ghostchain/ghost-geth:alltools-v1.13.14
      HTTP_APIS: eth,net,web3,debug,txpool
      HTTP_CORS: http://localhost,http://127.0.0.1
      HTTP_PORT: "8545"
      HTTP_VHOSTS: localhost,127.0.0.1
      L1_AUTHRPC_VHOSTS: localhost,127.0.0.1
      L1_GHOSTCHAIN_BOOTNODE_IP: 172.31.0.21
      L1_GHOSTCHAIN_GHOSTSCOUT_IP: 172.31.0.31
      L1_GHOSTCHAIN_NODE1_IP: 172.31.0.22
      L1_GHOSTCHAIN_NODE2_IP: 172.31.0.23
      L1_GHOSTCHAIN_RPC_PROXY_IP: 172.31.0.30
      L1_GHOSTCHAIN_SUBNET: 172.31.0.0/16
      L1_GID: "1002"
      L1_HTTP_APIS: eth,net,web3,debug,txpool
      L1_HTTP_CORS: http://localhost,http://127.0.0.1
      L1_HTTP_VHOSTS: localhost,127.0.0.1,ghostchain-node1
      L1_METRICS_PORT: "18660"
      L1_P2P_PORT: "18551"
      L1_RPC_AUTH_PORT: "18552"
      L1_RPC_AUTH_TOKEN: ""
      L1_RPC_CORS_ORIGINS: http://localhost,http://127.0.0.1
      L1_RPC_HTTP_PORT: "18545"
      L1_RPC_PROXY_LOG_REQUESTS: "0"
      L1_RPC_RATE_LIMIT_ALLOWLIST: 127.0.0.1,::1,172.31.0.1
      L1_RPC_RATE_LIMIT_BURST: "40"
      L1_RPC_RATE_LIMIT_PER_MINUTE: "120"
      L1_RPC_RATE_WINDOW_MS: "60000"
      L1_RPC_REQUIRE_AUTH: "0"
      L1_RPC_SENSITIVE_METHODS: personal_,debug_,txpool_,admin_
      L1_RPC_WS_PORT: "18546"
      L1_UID: "1000"
      L1_WS_APIS: eth,net,web3
      L1_WS_ORIGINS: http://localhost,http://127.0.0.1
      METRICS_PORT: "6060"
      MINING_ENABLED: "1"
      P2P_PORT: "30303"
      SIGNER_ADDRESS: 0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
      WS_APIS: eth,net,web3
      WS_ORIGINS: http://localhost,http://127.0.0.1
      WS_PORT: "8546"
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- --post-data=''{"jsonrpc":"2.0","id":1,"method":"ghost_blockNumber","params":[]}'' --header ''Content-Type: application/json'' http://localhost:8545 >/dev/null || wget -qO- --post-data=''{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}'' --header ''Content-Type: application/json'' http://localhost:8545 >/dev/null'
      timeout: 5s
      interval: 20s
      retries: 5
      start_period: 25s
    image: ghostchain/ghost-geth:v1.13.14
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "2147483648"
    networks:
      ghostchain:
        ipv4_address: 10.89.0.22
    ports:
      - mode: ingress
        target: 8546
        published: "18546"
        protocol: tcp
      - mode: ingress
        target: 8551
        published: "18552"
        protocol: tcp
      - mode: ingress
        target: 30303
        published: "18551"
        protocol: tcp
      - mode: ingress
        target: 6060
        published: "18660"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    user: 1000:1002
    volumes:
      - type: bind
        source: /home/ghost/ghostl-stack/infra/ghostchain/data/node1
        target: /data
        bind: {}
      - type: bind
        source: /home/ghost/ghostl-stack/infra/ghostchain/geth
        target: /config
        read_only: true
        bind: {}
      - type: bind
        source: /home/ghost/ghostl-stack/infra/ghostchain/data/bootnode
        target: /run/bootnode
        read_only: true
        bind: {}
      - type: bind
        source: /home/ghost/ghostl-stack/infra/ghostchain/secrets
        target: /secrets
        read_only: true
        bind: {}
  ghostchain-node2:
    cap_drop:
      - ALL
    cpus: 1.5
    depends_on:
      ghostchain-bootnode:
        condition: service_started
        required: true
