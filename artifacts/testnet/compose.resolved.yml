  ghost-observability:
    build:
      context: /home/ghost/ghostl-stack/services/ghost-observability
      dockerfile: Dockerfile
    container_name: ghost-observability
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
        required: true
      ghost-exec-l3:
        condition: service_healthy
        required: true
    environment:
      ALERT_MISS_THRESHOLD: "3"
      GHOST_BRIDGE_L2_URL: http://ghost-bridge-l2:7264
      GHOST_BRIDGE_L3_URL: http://ghost-bridge-l3:7274
      GHOST_DERIVER_L2_URL: http://ghost-deriver-l2:7262
      GHOST_DERIVER_L3_URL: http://ghost-deriver-l3:7272
      GHOST_EXEC_L2_URL: http://ghost-exec-l2:7260
      GHOST_EXEC_L3_URL: http://ghost-exec-l3:7270
      GHOST_PROOF_L2_URL: http://ghost-proof-l2:7265
      GHOST_PROOF_L3_URL: http://ghost-proof-l3:7275
      GHOST_SEQUENCER_L2_URL: http://ghost-sequencer-l2:7261
      GHOST_SEQUENCER_L3_URL: http://ghost-sequencer-l3:7271
      GHOST_SETTLEMENT_L2_URL: http://ghost-settlement-l2:7263
      GHOST_SETTLEMENT_L3_URL: http://ghost-settlement-l3:7273
      PORT: "7276"
      SCRAPE_INTERVAL_MS: "15000"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7276/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    image: ghostchain/ghost-observability:local
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7276
        published: "7276"
        protocol: tcp
    restart: unless-stopped
  ghost-proof-l2:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-proof/Dockerfile
    container_name: ghost-proof-l2
    depends_on:
      ghost-exec-l2:
        condition: service_healthy
        required: true
    environment:
      CHAIN_ID: "901"
      GHOST_EXEC_URL: http://ghost-exec-l2:7260
      GHOST_LAYER: L2
      GHOST_PARENT_RPC_URL: http://host.docker.internal:18545
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l2:7263
      PORT: "7265"
      PROOF_MODE: fraud
      ROLLUP_ADDRESS: 0xad32D5C2Da9f4159C4cc98686C005852b3905355
      STATE_DIR: /state
    extra_hosts:
      - host.docker.internal=host-gateway
