name: ghostl-stack
services:
  ghost-bridge-l2:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-bridge/Dockerfile
    container_name: ghost-bridge-l2
    depends_on:
      ghost-settlement-l2:
        condition: service_healthy
        required: true
    environment:
      BRIDGE_ADDRESS: 0xad32D5C2Da9f4159C4cc98686C005852b3905355
      CHAIN_ID: "901"
      DEST_BRIDGE_ADDRESS: 0xad32D5C2Da9f4159C4cc98686C005852b3905355
      GHOST_DEST_RPC_URL: http://host.docker.internal:29547
      GHOST_LAYER: L2
      GHOST_SETTLEMENT_URL: http://ghost-settlement-l2:7263
      GHOST_SOURCE_RPC_URL: http://host.docker.internal:18545
      PORT: "7264"
      STATE_DIR: /state
    extra_hosts:
      - host.docker.internal=host-gateway
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:7264/healthz
      timeout: 5s
      interval: 15s
      retries: 3
    networks:
      ghost-rollup: null
    ports:
      - mode: ingress
        target: 7264
        published: "7264"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: ghost-bridge-l2-state
        target: /state
        volume: {}
  ghost-bridge-l3:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: services/ghost-bridge/Dockerfile
    container_name: ghost-bridge-l3
    depends_on:
