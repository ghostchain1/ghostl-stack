x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  ghostchain-bootnode:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    command:
      - bootnode
      - --nodekey
      - /config/boot.key
      - --addr
      - :30301
    volumes:
      - ./data/bootnode:/config
    ports:
      - "30301:30301/udp"
    networks:
      ghostchain:
        ipv4_address: 172.28.0.21
    <<: *default-security
    mem_limit: 256m
    cpus: "0.5"

  ghostchain-node1:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ghostchain-bootnode
    entrypoint: ["/bin/sh", "/config/run-node.sh"]
    volumes:
      - ./data/node1:/data
      - ./geth:/config:ro
      - ./config/bootnode-enode.txt:/run/bootnode-enode.txt:ro
    ports:
      - "18545:8545"
      - "18546:8546"
      - "18552:8551"
      - "18551:30303"
      - "18660:6060"
    environment:
      - CHAIN_ID=14000101
      - SIGNER_ADDRESS=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
      - HTTP_PORT=8545
      - WS_PORT=8546
      - AUTH_PORT=8551
      - P2P_PORT=30303
      - METRICS_PORT=6060
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' --header 'Content-Type: application/json' http://localhost:8545 >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      ghostchain:
        ipv4_address: 172.28.0.22
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  ghostchain-node2:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ghostchain-bootnode
    entrypoint: ["/bin/sh", "/config/run-node.sh"]
    volumes:
      - ./data/node2:/data
      - ./geth:/config:ro
      - ./config/bootnode-enode.txt:/run/bootnode-enode.txt:ro
    environment:
      - CHAIN_ID=14000101
      - SIGNER_ADDRESS=0x70997970c51812dc3a010c7d01b50e0d17dc79c8
      - HTTP_PORT=8545
      - WS_PORT=8546
      - AUTH_PORT=8551
      - P2P_PORT=30304
      - METRICS_PORT=6061
    networks:
      ghostchain:
        ipv4_address: 172.28.0.23
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  ghostscout-db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blockscout
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ghostscout-db-data:/var/lib/postgresql/data
    networks:
      ghostchain:
        ipv4_address: 172.28.0.30
    <<: *default-security
    cap_drop: []
    security_opt: []
    mem_limit: 1g
    cpus: "0.5"

  ghostscout:
    image: blockscout/blockscout:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ghostscout-db
      - ghostchain-node1
    entrypoint: ["/app/bin/blockscout"]
    command: ["start"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@ghostscout-db:5432/blockscout
      ECTO_USE_SSL: "false"
      ETHEREUM_JSONRPC_HTTP_URL: http://ghostchain-node1:8545
      ETHEREUM_JSONRPC_TRACE_URL: http://ghostchain-node1:8545
      ETHEREUM_JSONRPC_WS_URL: ws://ghostchain-node1:8546
      BLOCKSCOUT_HOST: 0.0.0.0
      PORT: 4000
      NETWORK: Ghostchain
      SUBNETWORK: PoA
      COIN: GHOST
      SECRET_KEY_BASE: 6d31c6c2b8b7344f5f3d2421f3d8a42d9d27f9b4a7ad0b287f1aa4f8c6efb6d3
      DISABLE_EVISION: "true"
      API_ONLY: "true"
      LOG_LEVEL: warn
    ports:
      - "18644:4000"
    networks:
      ghostchain:
        ipv4_address: 172.28.0.31
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

networks:
  ghostchain:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ghostscout-db-data:
