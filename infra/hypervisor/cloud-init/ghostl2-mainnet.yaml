#cloud-config
# =============================================================
# GhostStack — ghostl2-mainnet
# OP Stack L2 mainnet sequencer + batcher + proposer
# Network: gs-l2  /  static IP 10.50.20.10
# Settles to: ghostchain-mainnet-l1  (10.50.10.10:8545)
# Routing law: L2 → L1 only (L2 → L3 forbidden)
# =============================================================

hostname: ghostl2-mainnet
fqdn: ghostl2-mainnet.ghostchain.local
manage_etc_hosts: true
timezone: UTC

users:
  - name: ghost
    gecos: GhostStack Operator
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF+osgEYoqPCDiJESBGJhdbM2EI+CcQr4UIC4igDX1Xu ghosttoken.dev@gmail.com"

package_update: true
package_upgrade: false
packages:
  - curl
  - git
  - jq
  - ca-certificates
  - gnupg
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ghostl-stack/l2-mainnet.env
    permissions: "0600"
    owner: root:root
    content: |
      # ── GhostL2 Mainnet ─────────────────────────────────────
      ROUTING_LAW_MODE=strict

      # L1 settlement RPC (ghostchain-mainnet-l1)
      L1_RPC=http://10.50.10.10:8545
      L1_CHAIN_ID=14000101

      # L2 chain
      L2_CHAIN_ID=901
      L2_RPC=http://l2-geth:8545

      # OP Stack addresses (from deployment artifacts)
      OP_PORTAL_ADDRESS=REPLACE_ME
      L2OO_ADDRESS=REPLACE_ME
      SYSTEM_CONFIG_ADDRESS=REPLACE_ME
      DISPUTE_GAME_FACTORY_ADDRESS=REPLACE_ME
      BATCH_INBOX_ADDRESS=REPLACE_ME

      # Operator keys (store in Vault; never commit values)
      SEQUENCER_KEY=REPLACE_ME
      BATCHER_KEY=REPLACE_ME
      PROPOSER_KEY=REPLACE_ME
      CHALLENGER_KEY=REPLACE_ME
      SEQUENCER_ADDRESS=REPLACE_ME
      BATCH_SENDER_ADDRESS=REPLACE_ME
      PROPOSER_ADDRESS=REPLACE_ME

      # Derivation
      SEQUENCER_L1_CONFS=2

      # Images
      OPSTACK_IMAGE_TAG=mainnet
      OPSTACK_UID=1000
      OPSTACK_GID=1000

      # Canonical gas token (GST)
      CANONICAL_GAS_TOKEN_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      GAS_TOKEN_L1=GST
      GAS_TOKEN_L2=GST

      # Gate / Guard
      GATE_ADMIN_TOKEN=REPLACE_ME
      GATE_ALLOW_INSECURE_ADMIN=0
      AI_CONSENSUS_MODE=enforce
      AI_CONSENSUS_FAIL_OPEN=0

  - path: /etc/systemd/system/ghostl2-mainnet.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=GhostL2 Mainnet OP Stack
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/ghostl-stack/l2-mainnet.env
      WorkingDirectory=/opt/ghostl-stack/infra/opstack
      ExecStart=/usr/bin/docker compose \
        -f docker-compose.yml \
        --env-file /etc/ghostl-stack/l2-mainnet.env \
        up --remove-orphans
      ExecStop=/usr/bin/docker compose \
        -f docker-compose.yml \
        down
      Restart=always
      RestartSec=20
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=ghostl2-mainnet

      [Install]
      WantedBy=multi-user.target

runcmd:
  - bash /opt/ghostl-stack/infra/hypervisor/provision/ghostl2-provision.sh mainnet
