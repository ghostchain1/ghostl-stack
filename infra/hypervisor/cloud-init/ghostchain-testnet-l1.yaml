#cloud-config
# =============================================================
# GhostStack — ghostchain-testnet-l1
# GhostChain L1 testnet full node  (chain ID 14000102)
# Network: gs-l1  /  static IP 10.50.10.11
# =============================================================

hostname: ghostchain-testnet-l1
fqdn: ghostchain-testnet-l1.ghostchain.local
manage_etc_hosts: true
timezone: UTC

users:
  - name: ghost
    gecos: GhostStack Operator
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF+osgEYoqPCDiJESBGJhdbM2EI+CcQr4UIC4igDX1Xu ghosttoken.dev@gmail.com"

package_update: true
package_upgrade: false
packages:
  - curl
  - git
  - jq
  - ca-certificates
  - gnupg
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ghostl-stack/l1-testnet.env
    permissions: "0600"
    owner: root:root
    content: |
      # ── GhostChain L1 Testnet Node ──────────────────────────
      L1_ENV=testnet
      ALLOW_DEV_SECRETS=0
      L1_SECRETS_SOURCE=vault
      L1_CHAIN_ID=14000102
      GETH_IMAGE=ghostl/geth:alltools-v1.13.14

      L1_GHOSTCHAIN_BOOTNODE_IP=10.50.10.2
      L1_BOOTNODE_PORT=30301
      L1_RPC_HTTP_PORT=8545
      L1_RPC_WS_PORT=8546
      L1_RPC_AUTH_PORT=8551
      L1_P2P_PORT=30303
      L1_METRICS_PORT=6060

      # Slightly more permissive than mainnet for testnet tooling
      L1_HTTP_APIS=eth,net,web3,txpool,debug
      L1_WS_APIS=eth,net,web3
      L1_HTTP_VHOSTS=localhost,127.0.0.1,ghostchain-testnet-l1
      L1_HTTP_CORS=*
      L1_WS_ORIGINS=*
      L1_AUTHRPC_VHOSTS=localhost,127.0.0.1
      L1_RPC_REQUIRE_AUTH=1
      L1_RPC_RATE_LIMIT_PER_MINUTE=120
      L1_RPC_RATE_LIMIT_BURST=40

      L1_NODE1_MINING_ENABLED=0

      VAULT_ADDR=REPLACE_ME
      VAULT_ROLE_ID=REPLACE_ME
      VAULT_SECRET_ID=REPLACE_ME
      VAULT_L1_PATH=ghostchain/l1/testnet

  - path: /etc/systemd/system/ghostl1-testnet.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=GhostChain L1 Testnet Node
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/ghostl-stack/l1-testnet.env
      WorkingDirectory=/opt/ghostl-stack/infra/ghostchain
      ExecStart=/usr/bin/docker compose \
        -f docker-compose.l1.yml \
        --env-file /etc/ghostl-stack/l1-testnet.env \
        up --remove-orphans
      ExecStop=/usr/bin/docker compose \
        -f docker-compose.l1.yml \
        down
      Restart=always
      RestartSec=15
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=ghostl1-testnet

      [Install]
      WantedBy=multi-user.target

runcmd:
  - bash /opt/ghostl-stack/infra/hypervisor/provision/ghostchain-l1-provision.sh testnet
