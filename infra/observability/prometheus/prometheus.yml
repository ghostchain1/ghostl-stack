global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ghost-guard
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-guard:7070"]

  - job_name: ghost-relayer
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-relayer:7171"]

  - job_name: rollup-proposer-l2
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-rollup-proposer-l2:7272"]

  - job_name: rollup-proposer-l3
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-rollup-proposer-l3:7373"]

  - job_name: rollup-challenger-l2
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-rollup-challenger-l2:7282"]

  - job_name: rollup-challenger-l3
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["ghost-rollup-challenger-l3:7383"]

  - job_name: opstack-node
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7300"]

  - job_name: opstack-batcher
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7301"]

  - job_name: opstack-proposer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7302"]

  - job_name: op-gate
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["host.docker.internal:28546"]
