# =============================================================================
# App services — explorer.ghostchain.world, wallet.ghostchain.world,
#                api.ghostchain.cloud
# Bound to 38.247.149.218 (gateway) → proxied to 38.247.149.222 (apps IP)
# =============================================================================

server {
    listen 38.247.149.218:80;
    server_name explorer.ghostchain.world wallet.ghostchain.world api.ghostchain.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── GhostScan Explorer — explorer.ghostchain.world ───────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name explorer.ghostchain.world;

    ssl_certificate     /etc/letsencrypt/live/explorer.ghostchain.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.ghostchain.world/privkey.pem;

    limit_req zone=general_limit burst=60 nodelay;

    location / {
        proxy_pass         http://ghost_explorer;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}

# ── GhostWallet — wallet.ghostchain.world ────────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name wallet.ghostchain.world;

    ssl_certificate     /etc/letsencrypt/live/wallet.ghostchain.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.ghostchain.world/privkey.pem;

    limit_req zone=general_limit burst=60 nodelay;

    # Strict CSP for wallet UI
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://rpc.ghostchain.cloud https://l2.ghostchain.cloud https://l3.ghostchain.cloud; frame-ancestors 'none';" always;

    location / {
        proxy_pass         http://ghost_wallet;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}

# ── GhostStack API BFF — api.ghostchain.cloud ────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name api.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ghostchain.cloud/privkey.pem;

    limit_req zone=api_limit burst=40 nodelay;

    # Block admin routes at proxy level
    location ~ ^/admin {
        return 403;
    }

    location / {
        proxy_pass         http://ghost_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header         Access-Control-Allow-Origin "https://explorer.ghostchain.world" always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
}
