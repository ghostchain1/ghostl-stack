# =============================================================================
# Monitoring — grafana.ghostchain.cloud, metrics.ghostchain.cloud,
#              status.ghostchain.cloud
# Bound to 38.247.149.218 (gateway) → 38.247.149.224 (monitoring IP)
#
# All monitoring UIs are INTERNAL ONLY — allowlisted to the /24 subnet.
# Remove the allow/deny block or add your VPN CIDR to open selective access.
# =============================================================================

server {
    listen 38.247.149.218:80;
    server_name grafana.ghostchain.cloud metrics.ghostchain.cloud status.ghostchain.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Grafana — grafana.ghostchain.cloud ───────────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name grafana.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/grafana.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.ghostchain.cloud/privkey.pem;

    # Internal subnet only
    allow 38.247.149.0/24;
    deny all;

    location / {
        proxy_pass         http://grafana;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (Grafana live panels)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ── Prometheus — metrics.ghostchain.cloud ───────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name metrics.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/metrics.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.ghostchain.cloud/privkey.pem;

    # Internal subnet only — Prometheus web UI must not be publicly accessible
    allow 38.247.149.0/24;
    deny all;

    location / {
        proxy_pass         http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ── Status page — status.ghostchain.cloud ────────────────────────────────────
# Lightweight public-facing status endpoint (can be a static page or
# a dedicated status service).
server {
    listen 38.247.149.218:443 ssl;
    server_name status.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/status.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.ghostchain.cloud/privkey.pem;

    limit_req zone=general_limit burst=30 nodelay;

    # Serve a static status page (or proxy to a lightweight status service)
    root /var/www/ghoststack-status;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check probe — returns 200 if nginx is alive
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
