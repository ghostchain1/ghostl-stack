# =============================================================================
# AI services — ai.ghostchain.cloud, brain.ghostchain.cloud
# Bound to 38.247.149.218 (gateway) → proxied to 38.247.149.223 (AI IP)
#
# These endpoints are NOT public-facing by default. They are protected
# by HMAC auth at the application layer. The nginx block adds an extra
# IP allowlist for defence-in-depth.
# =============================================================================

server {
    listen 38.247.149.218:80;
    server_name ai.ghostchain.cloud brain.ghostchain.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── GhostBrain Core — brain.ghostchain.cloud ─────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name brain.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/brain.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.ghostchain.cloud/privkey.pem;

    # Restrict to your own subnet + management IPs
    # Expand this allowlist as needed; remove "deny all" to open publicly.
    allow 38.247.149.0/24;
    deny all;

    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass         http://ghostbrain_core;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Ghost AI Swarm — ai.ghostchain.cloud ─────────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name ai.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/ai.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.ghostchain.cloud/privkey.pem;

    # Internal subnet only — swarm is not public
    allow 38.247.149.0/24;
    deny all;

    limit_req zone=api_limit burst=10 nodelay;

    location / {
        proxy_pass         http://ghost_ai_swarm;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
