# =============================================================================
# GhostChain domain portfolio — canonical site + redirect fleet
#
# Canonical:   ghostchain.cloud            → Next.js web app (38.247.149.222:3000)
# Satellites:  ghostchain.info             → docs (future; redirect for now)
#              ghostchain.live             → status (future; redirect for now)
#              ghostchain.store            → store (future; redirect for now)
#              ghostchainsolutions.com     → B2B/enterprise (redirect for now)
#              ghostchainlink.com          → link hub (redirect for now)
# Defensive:   ghostchain.online
#              ghostchain.space
#              ghostchain.world  (apex/www only — subdomains handled in 20-apps.conf)
#              ghostchain.life
#              ghostschain.com             → typo trap
#
# All HTTP traffic → HTTPS.  Non-canonical domains → 301 → ghostchain.cloud.
# =============================================================================

# ── ACME / HTTP→HTTPS catch-all for all domain portfolio domains ──────────────
server {
    listen 38.247.149.218:80;
    server_name
        ghostchain.cloud        www.ghostchain.cloud
        ghostchain.info         www.ghostchain.info
        ghostchain.live         www.ghostchain.live
        ghostchain.store        www.ghostchain.store
        ghostchain.online       www.ghostchain.online
        ghostchain.space        www.ghostchain.space
        ghostchain.life         www.ghostchain.life
        ghostchain.world        www.ghostchain.world
        ghostchainsolutions.com www.ghostchainsolutions.com
        ghostchainlink.com      www.ghostchainlink.com
        ghostschain.com         www.ghostschain.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# CANONICAL — ghostchain.cloud (primary brand site)
# =============================================================================

# www → apex (one 301 hop, no chain)
server {
    listen 38.247.149.218:443 ssl;
    server_name www.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.cloud/privkey.pem;

    return 301 https://ghostchain.cloud$request_uri;
}

# Primary canonical vhost
server {
    listen 38.247.149.218:443 ssl;
    server_name ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.cloud/privkey.pem;

    limit_req zone=general_limit burst=120 nodelay;

    add_header X-Robots-Tag "index, follow" always;

    # Proxy to the Next.js web app on the apps node
    location / {
        proxy_pass         http://ghost_explorer;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}

# =============================================================================
# REDIRECT FLEET — one 301 hop each, no chains, noindex enforced
# =============================================================================

# Macro for redirect server blocks:
#   listen 443 ssl → 301 https://ghostchain.cloud$request_uri
# Each block has its own cert path (SNI selects it automatically).

# ── ghostchain.info ───────────────────────────────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name ghostchain.info www.ghostchain.info;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.info/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 https://ghostchain.cloud$request_uri;
}

