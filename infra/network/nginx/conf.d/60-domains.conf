# ── Catch-all for unrecognised Host headers (security: drop silently) ─────────
server {
    listen 38.247.149.218:80  default_server;
    listen 38.247.149.218:443 ssl default_server;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.cloud/privkey.pem;

    return 444;
}
