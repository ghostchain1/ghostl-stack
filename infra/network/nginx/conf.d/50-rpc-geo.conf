# =============================================================================
# Geo-distributed RPC endpoints — nginx config
#
# Domains:
#   rpc-us.ghostchain.cloud    → US region L1 RPC nodes
#   rpc-eu.ghostchain.cloud    → EU region L1 RPC nodes
#   rpc-asia.ghostchain.cloud  → Asia region L1 RPC nodes
#   l2-us.ghostchain.cloud     → US region L2 RPC nodes
#   l2-eu.ghostchain.cloud     → EU region L2 RPC nodes
#   l2-asia.ghostchain.cloud   → Asia region L2 RPC nodes
#   l3-us.ghostchain.cloud     → US region L3 RPC nodes
#   l3-eu.ghostchain.cloud     → EU region L3 RPC nodes
#   l3-asia.ghostchain.cloud   → Asia region L3 RPC nodes
#
# Current-phase layout (single host):
#   All geo domains proxy to the same backend IPs as the primary endpoints.
#   When additional geo nodes are provisioned, update the upstream blocks in
#   nginx.conf (geo_l1_us_rpc, geo_l1_eu_rpc, geo_l1_asia_rpc, etc.) to
#   add the remote servers — the vhosts below do not change.
#
# Routing note:
#   Point rpc-us / l2-us / l3-us DNS at 38.247.149.218 (this edge server).
#   For true geo-routing use Cloudflare Geo-Steering or AWS Route 53 latency
#   routing to direct clients to the nearest edge before reaching this proxy.
# =============================================================================

# ── Shared proxy snippet (reused via include) ─────────────────────────────────
# NOTE: nginx does not support macro expansion, so the common headers are
# duplicated per server block for clarity and safety.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 38.247.149.218:80;
    server_name
        rpc-us.ghostchain.cloud
        rpc-eu.ghostchain.cloud
        rpc-asia.ghostchain.cloud
        l2-us.ghostchain.cloud
        l2-eu.ghostchain.cloud
        l2-asia.ghostchain.cloud
        l3-us.ghostchain.cloud
        l3-eu.ghostchain.cloud
        l3-asia.ghostchain.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# L1 RPC — US
# =============================================================================
server {
    listen 38.247.149.218:443 ssl;
    server_name rpc-us.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/rpc-us.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc-us.ghostchain.cloud/privkey.pem;

    limit_except POST OPTIONS { deny all; }
    limit_req zone=rpc_limit burst=30 nodelay;

    set $blocked 0;
    if ($request_body ~* '"method"\s*:\s*"(admin_|debug_|personal_)') {
        set $blocked 1;
    }
    if ($blocked = 1) {
        return 403 '{"jsonrpc":"2.0","error":{"code":-32601,"message":"Method not allowed"}}';
    }

    location / {
        proxy_pass         http://geo_l1_us_rpc;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Ghost-Region "us";
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_buffering    off;
        add_header         X-Ghost-Region "us" always;
        add_header         Access-Control-Allow-Origin "*" always;
        add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
    }
}

