# =============================================================================
# RPC endpoints — rpc.ghostchain.cloud, l2.ghostchain.cloud, l3.ghostchain.cloud
# Bound to the edge gateway IP (38.247.149.218) — proxies to internal RPC IPs.
# =============================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 38.247.149.218:80;
    server_name rpc.ghostchain.cloud l2.ghostchain.cloud l3.ghostchain.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── GhostChain L1 RPC — rpc.ghostchain.cloud ─────────────────────────────────
server {
    listen 38.247.149.218:443 ssl;
    server_name rpc.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/rpc.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.ghostchain.cloud/privkey.pem;

    # Allow only POST (JSON-RPC) and OPTIONS (CORS preflight)
    limit_except POST OPTIONS {
        deny all;
    }

    limit_req zone=rpc_limit burst=20 nodelay;

    # Block debug/admin methods at proxy layer
    set $blocked 0;
    if ($request_body ~* '"method"\s*:\s*"(admin_|debug_|personal_)') {
        set $blocked 1;
    }
    if ($blocked = 1) {
        return 403 '{"jsonrpc":"2.0","error":{"code":-32601,"message":"Method not allowed"}}';
    }

    location / {
        proxy_pass         http://ghostchain_l1_rpc;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header         Access-Control-Allow-Origin "*" always;
        add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
    }
}

