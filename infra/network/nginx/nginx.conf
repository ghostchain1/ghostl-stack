# =============================================================================
# Nginx main configuration — GhostStack edge gateway
# /etc/nginx/nginx.conf
# =============================================================================
#
# Deploy:
#   sudo cp infra/network/nginx/nginx.conf      /etc/nginx/nginx.conf
#   sudo cp infra/network/nginx/conf.d/*.conf   /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format ghoststack '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time us=$upstream_response_time '
                          'vhost=$host';

    access_log /var/log/nginx/access.log ghoststack;
    error_log  /var/log/nginx/error.log warn;

    # ── SSL defaults ───────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # ── Security headers (applied at server level) ─────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;

    # ── Upstream blocks (one per internal service IP) ──────────────────────────
    upstream ghostchain_l1_rpc {
        server 38.247.149.219:18545;
        keepalive 32;
    }

    upstream ghostl2_rpc {
        server 38.247.149.220:29545;
        keepalive 32;
    }

    upstream ghostl3_rpc {
        server 38.247.149.221:39545;
        keepalive 32;
    }

    upstream ghost_api {
        server 38.247.149.222:3001;
        keepalive 32;
    }

    upstream ghost_explorer {
        server 38.247.149.222:3000;
        keepalive 32;
    }

    upstream ghost_wallet {
        server 38.247.149.222:3002;
        keepalive 32;
    }

    upstream ghostbrain_core {
        server 38.247.149.223:7900;
        keepalive 16;
    }

    upstream ghost_ai_swarm {
        server 38.247.149.223:4080;
        keepalive 16;
    }

    upstream grafana {
        server 38.247.149.224:3000;
        keepalive 8;
    }

    upstream prometheus {
        server 38.247.149.224:9090;
        keepalive 8;
    }

    # ── Virtual hosts ──────────────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
