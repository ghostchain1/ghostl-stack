# =============================================================================
# Kong Gateway declarative configuration — kong.yaml
#
# Deployed on: 38.247.149.218 (edge gateway)
# Mode: DB-less (declarative, no PostgreSQL dependency for Kong itself)
#
# Deploy:
#   sudo cp infra/network/kong/kong.yaml /etc/kong/kong.yaml
#   sudo kong start --conf /etc/kong/kong.conf
#   # or via Docker:
#   docker compose -f infra/network/kong/docker-compose.yml up -d
#
# This configuration:
#   - Exposes GhostBrain, ghost-ai-swarm, and the API BFF through Kong
#   - Applies rate-limiting and IP-restriction controls
#   - Internal-only routes (GhostBrain, AI Swarm) are locked to the /24
#     subnet at both nginx and Kong layers
#   - Application-level HMAC verification is performed by ghostos-core
#     (not a Kong OSS HMAC plugin) for internal control-plane requests
#   - JWT/OIDC validation for user-facing routes uses the ghost-jwks-guard
#     Traefik ForwardAuth sidecar (see infra/docker/docker-compose.prod.yml)
#   - Kong sits behind nginx and enforces API-level controls
# =============================================================================

_format_version: "3.0"
_transform: true

# ── Services ──────────────────────────────────────────────────────────────────
services:
  # GhostChain L1 RPC
  - name: ghostchain-l1-rpc
    url: http://38.247.149.219:18545
    connect_timeout: 10000
    write_timeout:   30000
    read_timeout:    30000
    retries: 2
    routes:
      - name: l1-rpc-route
        protocols: [https]
        hosts: [rpc.ghostchain.cloud]
        methods: [POST, OPTIONS]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          hide_client_headers: false
      - name: cors
        config:
          origins: ["*"]
          methods: [POST, OPTIONS]
          headers: [Content-Type]
          max_age: 3600

  # GhostL2 RPC
  - name: ghostl2-rpc
    url: http://38.247.149.220:7260
    connect_timeout: 10000
    write_timeout:   30000
    read_timeout:    30000
    retries: 2
    routes:
      - name: l2-rpc-route
        protocols: [https]
        hosts: [l2.ghostchain.cloud]
        methods: [POST, OPTIONS]
        strip_path: false
