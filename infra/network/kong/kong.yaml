  # GhostStack API BFF
  - name: ghost-api
    url: http://38.247.149.222:3001
    connect_timeout: 5000
    write_timeout:   30000
    read_timeout:    30000
    retries: 1
    routes:
      - name: api-route
        protocols: [https]
        hosts: [api.ghostchain.cloud]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          policy: local
      - name: cors
        config:
          origins: ["https://explorer.ghostchain.world", "https://wallet.ghostchain.world"]
          methods: [GET, POST, OPTIONS]
          headers: [Content-Type, Authorization]
          credentials: true

  # ── Geo-distributed RPC routes ──────────────────────────────────────────────
  # Each region domain routes through Kong with the same rate-limiting + CORS
  # as the primary RPC services. Kong's upstream health checks detect when a
  # geo node goes down and removes it from rotation automatically.

  - name: ghostchain-l1-rpc-us
    url: http://38.247.149.219:18545
    connect_timeout: 10000
    write_timeout:   30000
    read_timeout:    30000
    retries: 3
    routes:
      - name: l1-rpc-us-route
        protocols: [https]
        hosts: [rpc-us.ghostchain.cloud]
        methods: [POST, OPTIONS]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 150
          policy: local
          hide_client_headers: false
      - name: cors
        config:
          origins: ["*"]
          methods: [POST, OPTIONS]
          headers: [Content-Type]
          max_age: 3600
      - name: request-transformer
        config:
          add:
            headers: ["X-Ghost-Region:us"]

