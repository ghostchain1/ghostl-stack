# =============================================================================
# HAProxy — Geo-distributed RPC load balancer
#
# This config is used when dedicated geo nodes are provisioned and you need
# active health-checked round-robin across multiple RPC servers in a region.
#
# Deployment:
#   sudo apt install haproxy
#   sudo cp infra/network/haproxy/haproxy-geo.cfg /etc/haproxy/haproxy.cfg
#   sudo systemctl reload haproxy
#
# For single-server phase: HAProxy is OPTIONAL — nginx upstream blocks in
# nginx.conf already handle failover. Use HAProxy once you have 2+ nodes
# in a region for active load balancing with granular health checks.
#
# HAProxy listens on 127.0.0.1 so nginx proxies through it:
#   nginx upstream:  server 127.0.0.1:18545;
#   haproxy backend: actual remote L1 RPC nodes
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect  5s
    timeout client   30s
    timeout server   30s
    retries 2
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# =============================================================================
# Stats endpoint (internal only)
# =============================================================================
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
    stats auth ghost:changeme        # change before production
    stats hide-version

# =============================================================================
# GhostChain L1 RPC — geo pools
# Each frontend listens on a distinct loopback port (nginx proxies here).
# =============================================================================

# ── L1 US ─────────────────────────────────────────────────────────────────────
frontend l1_us_frontend
    bind 127.0.0.1:18545
    default_backend l1_us_backend
    option http-use-htx

backend l1_us_backend
    balance leastconn
    option httpchk POST / HTTP/1.1\r\nHost:\ rpc-us.ghostchain.cloud\r\nContent-Type:\ application/json\r\nContent-Length:\ 49\r\n\r\n{"jsonrpc":"2.0","method":"ghost_chainId","id":1}
    http-check expect status 200
    default-server inter 10s fall 2 rise 3 slowstart 30s
    # Primary node (current host):
    server l1-us-primary 38.247.149.219:18545 check weight 10
    # Add additional US nodes below:
    # server l1-us-node2  <us-node-2-ip>:18545 check weight 10

# ── L1 EU ─────────────────────────────────────────────────────────────────────
frontend l1_eu_frontend
    bind 127.0.0.1:18546
    default_backend l1_eu_backend

backend l1_eu_backend
    balance leastconn
    option httpchk POST / HTTP/1.1\r\nHost:\ rpc-eu.ghostchain.cloud\r\nContent-Type:\ application/json\r\nContent-Length:\ 49\r\n\r\n{"jsonrpc":"2.0","method":"ghost_chainId","id":1}
    http-check expect status 200
    default-server inter 10s fall 2 rise 3 slowstart 30s
    # Fallback to US primary until EU node is provisioned:
    server l1-eu-fallback 38.247.149.219:18545 check weight 1 backup
    # Add EU node below when provisioned (set weight 10 and remove backup flag):
    # server l1-eu-primary <eu-node-ip>:18545 check weight 10

# ── L1 Asia ───────────────────────────────────────────────────────────────────
frontend l1_asia_frontend
    bind 127.0.0.1:18547
    default_backend l1_asia_backend

backend l1_asia_backend
    balance leastconn
    option httpchk POST / HTTP/1.1\r\nHost:\ rpc-asia.ghostchain.cloud\r\nContent-Type:\ application/json\r\nContent-Length:\ 49\r\n\r\n{"jsonrpc":"2.0","method":"ghost_chainId","id":1}
    http-check expect status 200
    default-server inter 10s fall 2 rise 3 slowstart 30s
    server l1-asia-fallback 38.247.149.219:18545 check weight 1 backup
    # server l1-asia-primary <asia-node-ip>:18545 check weight 10

# =============================================================================
# GhostL2 RPC — geo pools
# =============================================================================
# Frontend bind ports below are local geo-routing ingress slots. The canonical
# direct GhostL2 backend RPC remains :29547, and :29545 must not be treated as
# the default host-level L2 RPC outside this compatibility/internal layer.

frontend l2_us_frontend
    bind 127.0.0.1:29545
    default_backend l2_us_backend

backend l2_us_backend
    balance leastconn
    option httpchk POST / HTTP/1.1\r\nHost:\ l2-us.ghostchain.cloud\r\nContent-Type:\ application/json\r\nContent-Length:\ 49\r\n\r\n{"jsonrpc":"2.0","method":"ghost_chainId","id":1}
