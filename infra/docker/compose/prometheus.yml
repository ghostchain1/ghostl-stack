global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: op-node
    static_configs:
      - targets: ["op-node:7300"]

  - job_name: op-batcher
    static_configs:
      - targets: ["op-batcher:7301"]

  - job_name: op-proposer
    static_configs:
      - targets: ["op-proposer:7302"]

  - job_name: op-gate
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["op-gate:8545"]

  - job_name: l3-op-node
    static_configs:
      - targets: ["l3-op-node:8300"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: l3-op-geth
    static_configs:
      - targets: ["l3-geth:6060"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: l3-op-batcher
    static_configs:
      - targets: ["l3-op-batcher:8301"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: l3-op-proposer
    static_configs:
      - targets: ["l3-op-proposer:8302"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: ghost-api-logs
    metrics_path: /observability/logs/api/metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: consensus-telemetry
    metrics_path: /metrics
    static_configs:
      - targets: ["consensus-telemetry-service:7635"]

  - job_name: ghostchain-l1
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:18660"]

  - job_name: ghostchain-rpc-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18545"]

  - job_name: ai-monitor-l2
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7575"]

  - job_name: ai-monitor-l1
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7576"]

  - job_name: ai-monitor-l3
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7577"]

  - job_name: ai-clock-sync
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7690"]
