        "migrate": {
          "condition": "service_completed_successfully",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        },
        "redis": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "ATTESTATION_EXPIRY_SECONDS": 900,
        "ATTESTATION_PRIVATE_KEY": "${COMPLIANCE_ATTESTATION_PRIVATE_KEY:-}",
        "CORS_ORIGIN": "http://localhost:3200",
        "DATABASE_URL": "postgresql://ghost:${POSTGRES_PASSWORD:-ghostpass}@postgres:5432/ghost_compliance",
        "JWT_SECRET": "${COMPLIANCE_JWT_SECRET:-change-me}",
        "NODE_ENV": "production",
        "PORT": 8090,
        "REDIS_URL": "redis://redis:6379"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 20,
        "test": [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8090/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""
        ],
        "timeout": "3s"
      },
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
