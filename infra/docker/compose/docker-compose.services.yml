  "services": {
    "ai-clock-sync": {
      "build": {
        "context": "./ai-clock-sync",
        "dockerfile": "Dockerfile"
      },
      "env_file": [
        {
          "path": "./stack.env.example",
          "required": true
        }
      ],
      "environment": [
        "PORT=7690",
        "CLOCK_SYNC_RPC_L1",
        "CLOCK_SYNC_RPC_L2",
        "CLOCK_SYNC_RPC_L3",
        "CLOCK_SYNC_INTERVAL_MS",
        "CLOCK_SYNC_DRIFT_THRESHOLD_SEC"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "image": "ghostl/ai-clock-sync:local",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "7690",
          "target": 7690
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "ai-clock-sync",
        "com.ghost.k8s.role": "ai",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
