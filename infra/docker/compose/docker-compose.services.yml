        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "ghost-compliance": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "COMPLIANCE_API_URL": "http://ghost-compliance:8090",
        "DATABASE_URL": "postgresql://ghost:${POSTGRES_PASSWORD:-ghostpass}@postgres:5432/ghost_compliance",
        "NODE_ENV": "production",
        "PREDICT_INTERVAL_SECONDS": 60,
        "REDIS_URL": "redis://redis:6379"
      },
      "networks": {
        "default": null
      },
      "restart": "unless-stopped",
      "labels": {
        "com.ghost.k8s.name": "ghost-compliance-worker",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "ClusterIP"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "ghost-ui": {
      "build": {
        "context": "./apps/ghost-ui",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "ghost-compliance": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "COMPLIANCE_ANALYST_JWT": "${COMPLIANCE_ANALYST_JWT:-}",
        "COMPLIANCE_URL": "http://ghost-compliance:8090",
        "NEXT_PUBLIC_COMPLIANCE_URL": "http://localhost:8090",
        "NODE_ENV": "production",
        "PORT": 3200
      },
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "3200",
          "target": 3200
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "ghost-ui",
        "com.ghost.k8s.role": "ui",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "LoadBalancer"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "migrate": {
      "command": [
        "sh",
        "-lc",
        "npm install && npm run migrate"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy",
          "required": true
        },
        "redis": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "ATTESTATION_EXPIRY_SECONDS": 900,
        "ATTESTATION_PRIVATE_KEY": "${COMPLIANCE_ATTESTATION_PRIVATE_KEY:-}",
        "DATABASE_URL": "postgresql://ghost:${POSTGRES_PASSWORD:-ghostpass}@postgres:5432/ghost_compliance",
        "JWT_SECRET": "${COMPLIANCE_JWT_SECRET:-change-me}",
        "REDIS_URL": "redis://redis:6379"
      },
      "image": "node:22-alpine",
      "networks": {
        "default": null
      },
      "restart": "no",
      "volumes": [
        {
          "bind": {
            "create_host_path": true
          },
          "source": "./services/ghost-compliance",
          "target": "/work",
          "type": "bind"
        }
      ],
      "working_dir": "/work",
      "labels": {
        "com.ghost.k8s.name": "migrate",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "./services/ghost-compliance",
        "com.ghost.k8s.service.type": "ClusterIP"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "postgres": {
      "environment": {
        "POSTGRES_DB": "ghost_compliance",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:-ghostpass}",
        "POSTGRES_USER": "ghost"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 20,
        "test": [
          "CMD-SHELL",
          "pg_isready -U ghost -d ghost_compliance"
        ],
        "timeout": "3s"
      },
      "image": "postgres:16-alpine",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "5432",
          "target": 5432
        }
      ],
      "volumes": [
        {
          "source": "pg_data",
          "target": "/var/lib/postgresql/data",
          "type": "volume",
          "volume": {}
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "postgres",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "pg_data",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "redis": {
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "healthcheck": {
        "interval": "5s",
        "retries": 20,
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "timeout": "3s"
      },
      "image": "redis:7-alpine",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "6379",
          "target": 6379
        }
      ],
      "volumes": [
        {
          "source": "redis_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "redis",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "redis_data",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "core-service": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "cap_drop": [
        "ALL"
      ],
      "cpus": "0.5",
      "environment": [
        "PORT=8080"
      ],
      "healthcheck": {
        "interval": "30s",
        "retries": 3,
        "start_period": "40s",
        "test": [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz"
        ],
        "timeout": "10s"
      },
      "mem_limit": "256m",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "8080",
          "target": 8080
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "labels": {
        "com.ghost.k8s.name": "core-service",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "NodePort"
      }
    }
  },
  "networks": {
    "default": {
      "name": "core-service_default"
    }
  },
  "volumes": {
    "pg_data": {
      "name": "ghostchain-compliance_pg_data"
    },
    "redis_data": {
      "name": "ghostchain-compliance_redis_data"
    }
  },
  "x-ghost-source-files": [
    "services/docker-compose.yml",
    "docker-compose.yml",
    "core-service/docker-compose.yml"
  ]
}
