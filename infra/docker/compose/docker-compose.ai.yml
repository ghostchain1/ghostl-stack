{
  "services": {
    "ai-monitor": {
      "build": {
        "context": "./ai-monitor",
        "dockerfile": "Dockerfile"
      },
      "env_file": [
        {
          "path": "./stack.env",
          "required": true
        }
      ],
      "environment": [
        "PORT=7575",
        "RPC_L2=${RPC_L2}",
        "GUARD_URL=${GUARD_URL}",
        "ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}",
        "OBSERVE_ONLY=1"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "image": "ghostl/ai-monitor:local",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "7575",
          "target": 7575
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "ai-monitor",
        "com.ghost.k8s.role": "ai",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
