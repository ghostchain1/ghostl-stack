        "com.ghost.k8s.name": "da-server",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "da_data",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "l2": {
      "build": {
        "context": ".",
        "dockerfile": "l2-op-geth.Dockerfile"
      },
      "entrypoint": [
        "/bin/sh",
        "/entrypoint.sh"
      ],
      "environment": {
        "GETH_MINER_RECOMMIT": "100ms"
      },
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "9545",
          "target": 8545
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "8060",
          "target": 6060
        }
      ],
      "volumes": [
        {
          "source": "l2_data",
          "target": "/db",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "${PWD}/../.devnet/genesis-l2.json",
          "target": "/genesis.json",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "${PWD}/test-jwt-secret.txt",
          "target": "/config/jwt-secret.txt",
          "type": "volume",
          "volume": {}
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "l2",
        "com.ghost.k8s.role": "chain",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "true",
        "com.ghost.k8s.volume.claim": "l2_data,${PWD}/../.devnet/genesis-l2.json,${PWD}/test-jwt-secret.txt",
        "com.ghost.k8s.service.type": "NodePort"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "sentinel": {
      "command": "sentinel --datadir=data --l1-rpc-http=http://l1:8545 --l1-rpc-ws=ws://l1:8546 --da-storage-uri=http://da-server:3100 --private-key=${SENTINEL_PRIVATE_KEY:-} --config=/rollup.json\n",
      "image": "quarry/sentinel",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "source": "${PWD}/../.devnet/rollup.json",
          "target": "/rollup.json",
          "type": "volume",
          "volume": {}
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "sentinel",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "${PWD}/../.devnet/rollup.json",
        "com.ghost.k8s.service.type": "ClusterIP"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "ghost-rollup-challenger": {
      "build": {
        "context": "./ghost-rollup-challenger",
        "dockerfile": "Dockerfile"
      },
      "env_file": [
        {
          "path": "./stack.env",
          "required": true
        }
      ],
      "environment": [
        "PORT=7282",
        "RPC_SETTLEMENT=${RPC_L2}",
        "RPC_CHILD=${RPC_L3}",
        "ROLLUP_ADDRESS=${L2_ROLLUP_L3_ADDRESS}",
        "CHALLENGER_PRIVATE_KEY=${CHALLENGER_PRIVATE_KEY}",
        "STATE_DIR=/state"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "image": "ghostl/ghost-rollup-challenger:local",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "7282",
          "target": 7282
        }
      ],
      "volumes": [
        {
          "bind": {
            "create_host_path": true
          },
          "source": "./data",
          "target": "/state",
          "type": "bind"
        }
      ]
    }
