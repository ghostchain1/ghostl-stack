    "ghostchain-node1": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "BOOTNODES=$(tr '\\n' ',' </config/peers.txt | sed 's/,$//')\nexec besu \\\n  --data-path=/data \\\n  --genesis-file=/config/genesis.json \\\n  --rpc-http-enabled \\\n  --rpc-http-host=0.0.0.0 \\\n  --rpc-http-api=ETH,NET,WEB3,IBFT,ADMIN,TXPOOL \\\n  --host-allowlist=\"*\" \\\n  --rpc-http-cors-origins=\"*\" \\\n  --p2p-port=30303 \\\n  --rpc-http-port=8545 \\\n  --rpc-ws-enabled \\\n  --rpc-ws-host=0.0.0.0 \\\n  --rpc-ws-port=8546 \\\n  --metrics-enabled \\\n  --metrics-host=0.0.0.0 \\\n  --metrics-port=6060 \\\n  --node-private-key-file=/config/keys/node1/key \\\n  --bootnodes=$${BOOTNODES}\n"
      ],
      "cpus": "1.0",
      "entrypoint": [
        "/bin/sh",
        "-c"
      ],
      "image": "hyperledger/besu:24.12.0",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "2g",
      "networks": {
        "ghostchain": {
          "ipv4_address": "172.28.0.11"
        }
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "18545",
          "target": 8545
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "18546",
          "target": 8546
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "18551",
          "target": 30303
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "18660",
          "target": 6060
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "bind": {
            "create_host_path": true
          },
          "source": "./ibft/networkFiles",
          "target": "/config",
          "type": "bind"
        },
        {
          "source": "ghostchain-node1-data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ]
