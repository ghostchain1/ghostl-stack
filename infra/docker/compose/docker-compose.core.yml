{
  "services": {
    "l1-mainnet-geth": {
      "cap_drop": [
        "ALL"
      ],
      "command": "--syncmode snap --http --http.addr=0.0.0.0 --http.port=8545 --http.api=eth,net,web3,txpool --http.vhosts=\"*\" --http.corsdomain=\"*\" --ws --ws.addr=0.0.0.0 --ws.port=8546 --ws.api=eth,net,web3 --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.vhosts=\"*\" --datadir=/data --cache=4096 --maxpeers=50 --metrics --metrics.addr=0.0.0.0 --metrics.port=6060\n",
      "cpus": "2.0",
      "image": "ethereum/client-go:stable",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "8g",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "38545",
          "target": 8545
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "38546",
          "target": 8546
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "38551",
          "target": 8551
        },
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "38660",
          "target": 6060
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "user": "0:0",
      "volumes": [
        {
          "source": "l1-mainnet-geth-data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "l1-mainnet-geth",
        "com.ghost.k8s.role": "chain",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "true",
        "com.ghost.k8s.volume.claim": "l1-mainnet-geth-data",
        "com.ghost.k8s.service.type": "NodePort"
      }
    },
    "network-manager": {
      "command": [
        "/usr/local/bin/network-manager.sh"
      ],
      "container_name": "opstack-network-manager",
      "entrypoint": [
        "/bin/sh",
        "-c"
      ],
      "image": "alpine:3.19",
      "network_mode": "host",
      "pid": "host",
      "restart": "unless-stopped",
      "volumes": [
        {
          "bind": {
            "create_host_path": true
          },
          "read_only": true,
          "source": "./bin/network-manager.sh",
          "target": "/usr/local/bin/network-manager.sh",
          "type": "bind"
        }
      ],
      "labels": {
        "com.ghost.k8s.name": "network-manager",
        "com.ghost.k8s.role": "api",
        "com.ghost.k8s.stateful": "true",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "./bin/network-manager.sh",
        "com.ghost.k8s.service.type": "ClusterIP"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "ai-monitor": {
      "build": {
        "context": "../../services/ai-monitor",
        "dockerfile": "../../services/common.Dockerfile"
      },
      "cap_drop": [
        "ALL"
      ],
      "cpus": "0.25",
      "depends_on": {
        "l2-geth": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "ADMIN_TOKEN": "${AI_MONITOR_ADMIN_TOKEN:-}",
        "GUARD_URL": "${GUARD_URL:-http://ghost-guard:7070}",
        "OBSERVE_ONLY": "${AI_MONITOR_OBSERVE_ONLY:-1}",
        "RPC_L2": "http://l2-geth:8545"
      },
      "healthcheck": {
        "interval": "20s",
        "retries": 6,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "wget -qO- http://localhost:7575/health >/dev/null"
        ],
        "timeout": "10s"
      },
      "image": "local/ai-monitor:${OPSTACK_IMAGE_TAG:-devnet}",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "256m",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "7575",
          "target": 7575
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "labels": {
        "com.ghost.k8s.name": "ai-monitor",
        "com.ghost.k8s.role": "ai",
        "com.ghost.k8s.stateful": "false",
        "com.ghost.k8s.no_recreate": "false",
        "com.ghost.k8s.volume.claim": "",
        "com.ghost.k8s.service.type": "NodePort"
      }
    },
