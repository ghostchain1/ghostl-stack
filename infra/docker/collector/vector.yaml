sources:
  docker_logs:
    type: docker_logs
    docker_host: "unix:///var/run/docker.sock"
    exclude_containers:
      - vector
transforms:
  enrich_logs:
    type: remap
    inputs: [docker_logs]
    source: |
      .raw_message = .message
      if .timestamp != null { .event_time = .timestamp }
      .timestamp = now()
      parsed = parse_json(.message) ?? {}
      if parsed != {} {
        .structured = parsed
      }
      .level = downcase(to_string(parsed.level) ?? "info")
      .component = to_string(parsed.component) ?? .container_name
      .event = to_string(parsed.event) ?? "log_event"
      .layer = "INFRA"
      .component_lower = downcase(to_string(.component) ?? "")
      if contains(.component_lower, "l3") { .layer = "L3" }
      if contains(.component_lower, "l2") { .layer = "L2" }
      if contains(.component_lower, "l1") || contains(.component_lower, "ghostchain") { .layer = "L1" }
      .chain = "Infrastructure"
      if .layer == "L1" { .chain = "GhostChain" }
      if .layer == "L2" { .chain = "GhostL2" }
      if .layer == "L3" { .chain = "GhostL3" }
      if exists(parsed.trace_id) { .trace_id = parsed.trace_id }
      if exists(parsed.request_id) { .request_id = parsed.request_id }
      if exists(parsed.tx_hash) { .tx_hash = parsed.tx_hash }
      if exists(parsed.block_number) { .block_number = parsed.block_number }
      if exists(parsed.node_id) { .node_id = parsed.node_id }

sinks:
  loki:
    type: loki
    inputs: [enrich_logs]
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      job: "{{container_name}}"
      component: "{{component}}"
      layer: "{{layer}}"
      chain: "{{chain}}"
      level: "{{level}}"
      instance: "{{host}}"
