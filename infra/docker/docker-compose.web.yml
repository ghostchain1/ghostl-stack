# ============================================================
# ghost-web VM — Traefik + Next.js web app
# Deploy target: the dedicated ghost-web KVM VM (10.50.99.10)
#
# Prerequisites (set in /etc/ghostl-stack/web.env on the VM):
#   NEXT_PUBLIC_BASE_DOMAIN, NEXTAUTH_SECRET, NEXTAUTH_URL,
#   NEXT_KEYCLOAK_ID, NEXT_KEYCLOAK_SECRET, NEXT_KEYCLOAK_URL,
#   ACME_EMAIL, WEB_DOMAIN
#
# Usage:
#   docker compose -f infra/docker/docker-compose.web.yml up -d
# ============================================================

name: ghostweb

services:
  # ── Traefik TLS edge proxy ────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      # API dashboard (internal only — bind only on localhost)
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # HTTP entrypoint (redirect → HTTPS)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt / ACME
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ops@ghostchain.cloud}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - ghost_web
    labels:
      # Dashboard — accessible only from MGMT subnet via SSH tunnel
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.internal`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dash.service=api@internal"

  # ── Next.js web app ────────────────────────────────────────
  web:
    # Use pre-built image when available:
    # image: ghcr.io/ghostchain1/web:latest
    # Build from source (default — works without registry credentials):
    build:
      context: /opt/ghostl-stack
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - /etc/ghostl-stack/web.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Internal self-fetch bypasses public DNS
      NEXT_SERVER_URL: "http://web:3000"
    expose:
      - "3000"
    networks:
      - ghost_web
    labels:
      - "traefik.enable=true"

      # ── Canonical redirect middleware ─────────────────────────────────────────
      # All alternative TLDs permanently redirect to ghostchain.cloud (SEO canonical)
      - "traefik.http.middlewares.to-canonical.redirectregex.regex=^https?://(?:www\\.)?(ghostchain\\.(?:info|life|live|online|space|store|world)|ghostchainlink\\.com|ghostchainsolutions\\.com|ghostschain\\.com)(.*)"
      - "traefik.http.middlewares.to-canonical.redirectregex.replacement=https://ghostchain.cloud$${2}"
      - "traefik.http.middlewares.to-canonical.redirectregex.permanent=true"

      # ── Primary domain: ghostchain.cloud ─────────────────────────────────────
      - "traefik.http.routers.web-apex.rule=Host(`${WEB_DOMAIN:-ghostchain.cloud}`) || Host(`www.${WEB_DOMAIN:-ghostchain.cloud}`)"
      - "traefik.http.routers.web-apex.entrypoints=websecure"
      - "traefik.http.routers.web-apex.tls=true"
      - "traefik.http.routers.web-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-apex.service=web"

      # ── Public subdomains of ghostchain.cloud ────────────────────────────────
      - >-
        traefik.http.routers.web-subdomains.rule=
        Host(`status.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`explorer.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`validators.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`governance.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`investors.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`token.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`developers.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`docs.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`employee.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`management.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`app.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`api.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`rpc.${WEB_DOMAIN:-ghostchain.cloud}`) ||
        Host(`rpc-l3.${WEB_DOMAIN:-ghostchain.cloud}`)
      - "traefik.http.routers.web-subdomains.entrypoints=websecure"
      - "traefik.http.routers.web-subdomains.tls=true"
      - "traefik.http.routers.web-subdomains.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-subdomains.service=web"

      # ── Alternative TLDs (redirect → ghostchain.cloud) ───────────────────────
      # Covers: ghostchain.{info,life,live,online,space,store,world}
      #         ghostchainlink.com  ghostchainsolutions.com  ghostschain.com
      - >-
        traefik.http.routers.web-altdomains.rule=
        Host(`ghostchain.info`) || Host(`www.ghostchain.info`) ||
        Host(`ghostchain.life`) || Host(`www.ghostchain.life`) ||
        Host(`ghostchain.live`) || Host(`www.ghostchain.live`) ||
        Host(`ghostchain.online`) || Host(`www.ghostchain.online`) ||
        Host(`ghostchain.space`) || Host(`www.ghostchain.space`) ||
        Host(`ghostchain.store`) || Host(`www.ghostchain.store`) ||
        Host(`ghostchain.world`) || Host(`www.ghostchain.world`) ||
        Host(`ghostchainlink.com`) || Host(`www.ghostchainlink.com`) ||
        Host(`ghostchainsolutions.com`) || Host(`www.ghostchainsolutions.com`) ||
        Host(`ghostschain.com`) || Host(`www.ghostschain.com`)
      - "traefik.http.routers.web-altdomains.entrypoints=websecure"
      - "traefik.http.routers.web-altdomains.tls=true"
      - "traefik.http.routers.web-altdomains.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-altdomains.middlewares=to-canonical"
      - "traefik.http.routers.web-altdomains.service=web"

      # ── HTTP entrypoint routers (needed to obtain ACME certs via HTTP challenge)
      - "traefik.http.routers.web-apex-http.rule=Host(`${WEB_DOMAIN:-ghostchain.cloud}`) || Host(`www.${WEB_DOMAIN:-ghostchain.cloud}`)"
      - "traefik.http.routers.web-apex-http.entrypoints=web"
      - "traefik.http.routers.web-apex-http.service=web"
      - >-
        traefik.http.routers.web-altdomains-http.rule=
        Host(`ghostchain.info`) || Host(`www.ghostchain.info`) ||
        Host(`ghostchain.life`) || Host(`www.ghostchain.life`) ||
        Host(`ghostchain.live`) || Host(`www.ghostchain.live`) ||
        Host(`ghostchain.online`) || Host(`www.ghostchain.online`) ||
        Host(`ghostchain.space`) || Host(`www.ghostchain.space`) ||
        Host(`ghostchain.store`) || Host(`www.ghostchain.store`) ||
        Host(`ghostchain.world`) || Host(`www.ghostchain.world`) ||
        Host(`ghostchainlink.com`) || Host(`www.ghostchainlink.com`) ||
        Host(`ghostchainsolutions.com`) || Host(`www.ghostchainsolutions.com`) ||
        Host(`ghostschain.com`) || Host(`www.ghostschain.com`)
      - "traefik.http.routers.web-altdomains-http.entrypoints=web"
      - "traefik.http.routers.web-altdomains-http.service=web"

      # ── Backend service ───────────────────────────────────────────────────────
      - "traefik.http.services.web.loadbalancer.server.port=3000"

volumes:
  traefik_acme:
    driver: local

networks:
  ghost_web:
    driver: bridge
