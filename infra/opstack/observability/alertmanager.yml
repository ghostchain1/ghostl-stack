global:
  resolve_timeout: 5m

route:
  receiver: dev-null
  group_by: [alertname, layer, type, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: sovereignty-critical-webhook
      matchers:
        - severity="critical"
        - alertname=~"GhostSovereigntyViolationSignal|GhostLayerUnhealthy|GhostConsensusTelemetryDown"
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 5m
    - receiver: sovereignty-warning-webhook
      matchers:
        - alertname=~"GhostCascadingFinalityLag|GhostSettlementAgeHigh|GhostBridgeFinalizeStalled"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [layer, type]

receivers:
  - name: dev-null
  - name: sovereignty-critical-webhook
    webhook_configs:
      - url: ${ALERTMANAGER_SOVEREIGNTY_CRITICAL_WEBHOOK_URL}
        send_resolved: true
        max_alerts: 0
  - name: sovereignty-warning-webhook
    webhook_configs:
      - url: ${ALERTMANAGER_SOVEREIGNTY_WARNING_WEBHOOK_URL}
        send_resolved: true
        max_alerts: 0
