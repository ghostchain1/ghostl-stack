global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: op-node
    static_configs:
      - targets: ["op-node:7300"]

  - job_name: op-batcher
    static_configs:
      - targets: ["op-batcher:7301"]

  - job_name: op-proposer
    static_configs:
      - targets: ["op-proposer:7302"]

  - job_name: op-gate
    metrics_path: /metrics/prom
    static_configs:
      - targets: ["op-gate:8545"]

  - job_name: l3-op-node
    static_configs:
      - targets: ["l3-op-node:8300"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: l3-op-batcher
    static_configs:
      - targets: ["l3-op-batcher:8301"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3

  - job_name: l3-op-proposer
    static_configs:
      - targets: ["l3-op-proposer:8302"]
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: network
        replacement: l3
