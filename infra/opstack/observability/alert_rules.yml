groups:
  - name: ghost-observability-logs
    rules:
      - alert: GhostCriticalLogs
        expr: increase(ghost_observability_log_events_total{severity=~"CRITICAL|SLASHING_RISK|SECURITY_EVENT"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical observability logs detected"
          description: "Critical, slashing-risk, or security log events observed in the last 5 minutes."
      - alert: GhostErrorRateSpike
        expr: increase(ghost_observability_log_events_total{severity=~"ERROR|CONSENSUS_RISK"}[5m]) > 25
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate spike detected"
          description: "Error or consensus-risk logs are spiking above normal thresholds."
  - name: ghost-opstack-l2
    rules:
      - alert: OpNodeL1HeadStalled
        expr: time() - op_node_default_refs_time{layer="l1",type="l1_head"} > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "L1 head updates stalled in op-node"
          description: "op-node has not observed a new L1 head within 2 minutes."
      - alert: OpNodeDerivationErrors
        expr: increase(op_node_default_derivation_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "L2 derivation errors detected"
          description: "op-node derivation errors are increasing; investigate L1/L2 connectivity."
      - alert: OpNodeL1ReorgDetected
        expr: increase(op_node_default_l1_reorg_depth_count[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "L1 reorg detected by op-node"
          description: "op-node observed L1 reorg activity; verify L1 stability."
      - alert: OpBatcherIdle
        expr: op_batcher_default_last_batcher_tx_unix{stage="success"} > 0 and (time() - op_batcher_default_last_batcher_tx_unix{stage="success"} > 900)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Batcher idle"
          description: "op-batcher has not submitted a successful batch for over 15 minutes."
      - alert: OpProposerIdle
        expr: op_proposer_default_txmgr_last_publish_unix > 0 and (time() - op_proposer_default_txmgr_last_publish_unix > 900)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proposer idle"
          description: "op-proposer has not published an output for over 15 minutes."

  - name: ghost-cascading-finality
    rules:
      - alert: GhostConsensusTelemetryDown
        expr: up{job="consensus-telemetry"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consensus telemetry is down"
          description: "Prometheus cannot scrape consensus-telemetry for more than 2 minutes."

      - alert: GhostLayerUnhealthy
        expr: ghost_consensus_layer_up{layer=~"L1|L2|L3"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ghost layer unhealthy"
          description: "Layer {{ $labels.layer }} is not reporting healthy consensus telemetry."

      - alert: GhostCascadingFinalityLag
        expr: ghost_consensus_op_lag_blocks{layer=~"L2|L3",type="safe_finalized"} > 240
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cascading finality lag elevated"
          description: "Layer {{ $labels.layer }} safe->finalized lag is {{ $value }} blocks for over 5 minutes."

      - alert: GhostSettlementAgeHigh
        expr: ghost_consensus_output_oracle_age_seconds{layer=~"L2|L3"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Settlement age high"
          description: "Layer {{ $labels.layer }} output oracle age is {{ $value }} seconds."

      - alert: GhostBridgeFinalizeStalled
        expr: ghost_consensus_bridge_oldest_pending_age_seconds > 1800 and ghost_consensus_bridge_oldest_pending_age_seconds != -1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bridge finalization backlog is stale"
          description: "Oldest pending L2->L3 bridge item exceeds 30 minutes."

      - alert: GhostSovereigntyViolationSignal
        expr: max by (layer, type) (ghost_consensus_incident{type=~"bridge_finalize_without_deposit|oracle_block_mismatch|oracle_index_mismatch|oracle_zero_root|oracle_output_missing"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sovereignty violation signal"
          description: "Incident {{ $labels.type }} is active on {{ $labels.layer }} and requires immediate triage."
