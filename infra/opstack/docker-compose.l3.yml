        condition: service_healthy
      op-gate:
        condition: service_healthy
    command:
      - op-proposer
      - --l1-eth-rpc=${L3_L1_RPC:-http://op-gate:8545}
      - --rollup-rpc=http://l3-op-node:${L3_ROLLUP_RPC_PORT:-19546}
      - --game-factory-address=${L3_GAME_FACTORY_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      - --proposal-interval=${L3_PROPOSAL_INTERVAL:-10s}
      - --game-type=0
      - --private-key=${L3_PROPOSER_KEY:-${PROPOSER_KEY}}
      - --allow-non-finalized
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_PROPOSER_RPC_PORT:-18560}
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_PROPOSER_PORT:-8302}
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/config:/config:ro
    ports:
      - "${L3_PROPOSER_HOST_PORT:-39560}:${L3_PROPOSER_RPC_PORT:-18560}"
      - "${L3_METRICS_PROPOSER_HOST_PORT:-8302}:${L3_METRICS_PROPOSER_PORT:-8302}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ghost_blockNumber\",\"params\":[]}' http://localhost:${L3_PROPOSER_RPC_PORT:-18560} >/dev/null || wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:${L3_PROPOSER_RPC_PORT:-18560} >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

