x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  l3-geth:
    image: ghcr.io/ethereum-optimism/op-geth:${OPSTACK_IMAGE_TAG:-latest}
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l2-geth:
        condition: service_healthy
    ports:
      - "${L3_HOST_RPC:-39545}:8545"
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/data:/data
      - ./l3/${L3_NAME:-ghostl3}/config/jwt.txt:/config/jwt.txt:ro
      - ./l3/${L3_NAME:-ghostl3}/config/genesis.json:/config/genesis.json:ro
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -e
        ENODE_L2="enode://ee9270b480cc105aae5217e7d7fc175ea2a0e15fdda90947ecbfd23b89607f79c1a21890091ff13c058c12c6629c198c65d343db6164dc0a0d5a9310cd95cad6@l2-geth:30303"
        if [ ! -d /data/geth ]; then
          echo "[l3-geth] initializing genesis..."
          geth init --datadir /data /config/genesis.json
        fi
        echo "[\"${L3_BOOTNODES:-$$ENODE_L2}\"]" > /data/static-nodes.json
        exec geth \
          --http --http.addr=0.0.0.0 --http.api=eth,net,web3,debug \
          --http.vhosts="*" \
          --ws --ws.addr=0.0.0.0 --ws.origins="*" \
          --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.vhosts="*" --authrpc.jwtsecret=/config/jwt.txt \
          --datadir=/data \
          --networkid=${L3_CHAIN_ID:-902} \
          --gcmode=archive \
          --bootnodes=${L3_BOOTNODES:-$$ENODE_L2} \
          --nodiscover \
          --rollup.disabletxpoolgossip=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:8545 >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    <<: *default-security
    mem_limit: 4g
    cpus: "2.0"

  l3-op-node:
    image: ghcr.io/ethereum-optimism/op-node:${OPSTACK_IMAGE_TAG:-latest}
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l3-geth:
        condition: service_healthy
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/data/op-node:/data
      - ./l3/${L3_NAME:-ghostl3}/config/rollup.json:/config/rollup.json:ro
      - ./l3/${L3_NAME:-ghostl3}/config/jwt.txt:/config/jwt.txt:ro
      - ./l3/${L3_NAME:-ghostl3}/config/l1-chain.json:/config/l1-chain.json:ro
    environment:
      OP_NODE_L1_BEACON_IGNORE: "1"
      OP_NODE_SEQUENCER_ENABLED: "1"
    command:
      - op-node
      - --l1=${L3_L1_RPC:-http://l2-geth:8545}
      - --l2=http://l3-geth:8551
      - --l2.jwt-secret=/config/jwt.txt
      - --rollup.config=/config/rollup.json
      - --rollup.l1-chain-config=/config/l1-chain.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_ROLLUP_RPC_PORT:-19546}
      - --l1.rpckind=basic
      - --p2p.disable
      - --l1.beacon.ignore
      - --sequencer.enabled
      - --sequencer.l1-confs=0
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_NODE_PORT:-8300}
    ports:
      - "${L3_ROLLUP_RPC_HOST_PORT:-39546}:${L3_ROLLUP_RPC_PORT:-19546}"
      - "${L3_METRICS_NODE_HOST_PORT:-8300}:${L3_METRICS_NODE_PORT:-8300}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"optimism_syncStatus\",\"params\":[]}' http://localhost:${L3_ROLLUP_RPC_PORT:-19546} >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  l3-op-batcher:
    image: ghcr.io/ethereum-optimism/op-batcher:${OPSTACK_IMAGE_TAG:-latest}
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l3-op-node:
        condition: service_healthy
    environment:
      L2OO_ADDRESS: "${L3_L2OO_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}"
    command:
      - op-batcher
      - --l1-eth-rpc=${L3_L1_RPC:-http://l2-geth:8545}
      - --l2-eth-rpc=http://l3-geth:8545
      - --rollup-rpc=http://l3-op-node:${L3_ROLLUP_RPC_PORT:-19546}
      - --private-key=${L3_BATCHER_KEY:-${BATCHER_KEY}}
      - --data-availability-type=${L3_DA_TYPE:-calldata}
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_BATCHER_RPC_PORT:-18551}
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_BATCHER_PORT:-8301}
      - --throttle.unsafe-da-bytes-lower-threshold=0
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/config/rollup.json:/config/rollup.json:ro
    ports:
      - "${L3_BATCHER_HOST_PORT:-39551}:${L3_BATCHER_RPC_PORT:-18551}"
      - "${L3_METRICS_BATCHER_HOST_PORT:-8301}:${L3_METRICS_BATCHER_PORT:-8301}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:${L3_BATCHER_RPC_PORT:-18551} >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

  l3-op-proposer:
    image: ghcr.io/ethereum-optimism/op-proposer:${OPSTACK_IMAGE_TAG:-latest}
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
