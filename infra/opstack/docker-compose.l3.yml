      - --game-factory-address=${L3_GAME_FACTORY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      - --proposal-interval=30s
      - --game-type=0
      - --private-key=${L3_PROPOSER_KEY:-${PROPOSER_KEY}}
      - --allow-non-finalized
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_PROPOSER_RPC_PORT:-18560}
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_PROPOSER_PORT:-8302}
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/config/rollup.json:/config/rollup.json:ro
    ports:
      - "${L3_PROPOSER_HOST_PORT:-39560}:${L3_PROPOSER_RPC_PORT:-18560}"
      - "${L3_METRICS_PROPOSER_HOST_PORT:-8302}:${L3_METRICS_PROPOSER_PORT:-8302}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:${L3_PROPOSER_RPC_PORT:-18560} >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

