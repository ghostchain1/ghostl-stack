# L3 overlay compose. Use with infra/opstack/docker-compose.yml; it is not a standalone stack file.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  l3-geth:
    image: local/op-geth:${OPSTACK_IMAGE_TAG:-local}
    user: "${OPSTACK_UID:-1000}:${OPSTACK_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    depends_on:
      l2-geth:
        condition: service_healthy
    ports:
      - "${L3_HOST_RPC:-39545}:8545"
      - "${L3_HOST_WS:-39548}:8546"
      - "${L3_GETH_METRICS_HOST_PORT:-39606}:${L3_GETH_METRICS_PORT:-6060}"
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/data-${L3_CHAIN_ID:-903}${L3_DATA_PROFILE:+-${L3_DATA_PROFILE}}:/data
      - ./l3/${L3_NAME:-ghostl3}/config:/config:ro
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -e
        ENODE_L2="enode://ee9270b480cc105aae5217e7d7fc175ea2a0e15fdda90947ecbfd23b89607f79c1a21890091ff13c058c12c6629c198c65d343db6164dc0a0d5a9310cd95cad6@l2-geth:30303"
        if [ ! -d /data/geth ]; then
          echo "[l3-geth] initializing genesis..."
          geth init --state.scheme=hash --datadir /data /config/genesis.json
        fi
        echo "[\"${L3_BOOTNODES:-$$ENODE_L2}\"]" > /data/static-nodes.json
        exec geth \
          --http --http.addr=0.0.0.0 --http.api=eth,net,web3,debug,txpool \
          --http.vhosts="*" \
          --ws --ws.addr=0.0.0.0 --ws.origins="*" \
          --metrics --metrics.addr=0.0.0.0 --metrics.port=${L3_GETH_METRICS_PORT:-6060} \
          --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.vhosts="*" --authrpc.jwtsecret=/config/jwt.txt \
          --datadir=/data \
          --networkid=${L3_CHAIN_ID:-903} \
          --state.scheme=hash \
          --gcmode=archive \
          --bootnodes=${L3_BOOTNODES:-$$ENODE_L2} \
          --nodiscover \
          --rollup.computependingblock=true \
          --rollup.enabletxpooladmission=true \
          --rollup.disabletxpoolgossip=false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ghost_blockNumber\",\"params\":[]}' http://localhost:8545 >/dev/null || wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:8545 >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    <<: *default-security
    mem_limit: 4g
    cpus: "2.0"

  l3-op-node:
    image: local/op-node:${OPSTACK_IMAGE_TAG:-local}
    user: "${OPSTACK_UID:-1000}:${OPSTACK_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    depends_on:
      l3-geth:
        condition: service_healthy
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/data-${L3_CHAIN_ID:-903}${L3_DATA_PROFILE:+-${L3_DATA_PROFILE}}/op-node:/data
      - ./l3/${L3_NAME:-ghostl3}/config:/config:ro
    environment:
      OP_NODE_L1_BEACON_IGNORE: "1"
      OP_NODE_SEQUENCER_ENABLED: "1"
    command:
      - op-node
      - --l1=${L3_L1_RPC:-http://ghost-exec-l2:7260}
      - --l2=http://l3-geth:8551
      - --l2.jwt-secret=/config/jwt.txt
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_ROLLUP_RPC_PORT:-19546}
      - --l1.rpckind=basic
      - --l1.trustrpc
      - --p2p.disable
      - --l1.beacon.ignore
      - --sequencer.enabled
      - --sequencer.l1-confs=${L3_SEQUENCER_L1_CONFS:-2}
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_NODE_PORT:-8300}
    ports:
      - "${L3_OP_NODE_DIRECT_RPC_PORT:-39646}:${L3_ROLLUP_RPC_PORT:-19546}"
      - "${L3_METRICS_NODE_HOST_PORT:-8300}:${L3_METRICS_NODE_PORT:-8300}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${L3_METRICS_NODE_PORT:-8300}/metrics >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  ghost-rollup-proxy-l3:
    build:
      context: ../../services/ghost-rpc-proxy
      dockerfile: Dockerfile
    image: local/ghost-rpc-proxy:${OPSTACK_IMAGE_TAG:-devnet}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l3-op-node:
        condition: service_healthy
    environment:
      PORT: 8546
      UPSTREAM_URL: http://l3-op-node:${L3_ROLLUP_RPC_PORT:-19546}
      RPC_ENABLE_GST_NAMESPACE: "1"
      RPC_DEPRECATE_LEGACY_NAMESPACE: "1"
      RPC_RATE_LIMIT_ALLOWLIST: ${L3_ROLLUP_RPC_RATE_LIMIT_ALLOWLIST:-127.0.0.1,::1,172.28.0.1}
      RPC_CORS_ORIGINS: ${L3_ROLLUP_RPC_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    ports:
      - "${L3_ROLLUP_RPC_HOST_PORT:-39546}:8546"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8546 -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ghost_compat_syncStatus\",\"params\":[]}' >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s
    <<: *default-security
    mem_limit: 128m
    cpus: "0.25"

  l3-op-batcher:
    image: local/op-batcher:${OPSTACK_IMAGE_TAG:-local}
    user: "${OPSTACK_UID:-1000}:${OPSTACK_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    depends_on:
      l3-op-node:
        condition: service_healthy
      op-gate:
        condition: service_healthy
    environment:
      L2OO_ADDRESS: "${L3_L2OO_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}"
      # Match L2 batcher defaults: without a max channel duration, L3 "safe" head can stall for a long time
      # (no more batches posted to the parent), which blocks L3->L2 economic finality + withdrawals.
      OP_BATCHER_MAX_CHANNEL_DURATION: ${L3_OP_BATCHER_MAX_CHANNEL_DURATION:-2}
      OP_BATCHER_NUM_CONFIRMATIONS: ${L3_OP_BATCHER_NUM_CONFIRMATIONS:-1}
      OP_BATCHER_POLL_INTERVAL: ${L3_OP_BATCHER_POLL_INTERVAL:-1s}
      OP_BATCHER_RPC_ENABLE_ADMIN: ${L3_OP_BATCHER_RPC_ENABLE_ADMIN:-true}
      OP_BATCHER_SUB_SAFETY_MARGIN: ${L3_OP_BATCHER_SUB_SAFETY_MARGIN:-4}
    command:
      - op-batcher
      - --l1-eth-rpc=${L3_L1_RPC:-http://op-gate:8545}
      - --l2-eth-rpc=http://ghost-exec-l3:7270
      - --rollup-rpc=http://l3-op-node:${L3_ROLLUP_RPC_PORT:-19546}
      - --private-key=${L3_BATCHER_KEY:-${BATCHER_KEY}}
      - --data-availability-type=${L3_DA_TYPE:-calldata}
      - --rpc.addr=0.0.0.0
      - --rpc.port=${L3_BATCHER_RPC_PORT:-18551}
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=${L3_METRICS_BATCHER_PORT:-8301}
      # Disable DA throttling in local dev: our geth does not expose miner_setMaxDASize.
      - --throttle-interval=0
    volumes:
      - ./l3/${L3_NAME:-ghostl3}/config:/config:ro
    ports:
      - "${L3_BATCHER_HOST_PORT:-39551}:${L3_BATCHER_RPC_PORT:-18551}"
      - "${L3_METRICS_BATCHER_HOST_PORT:-8301}:${L3_METRICS_BATCHER_PORT:-8301}"
    healthcheck:
      # Avoid spamming logs with JSON-RPC methods that op-batcher doesn't implement.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${L3_METRICS_BATCHER_PORT:-8301}/metrics >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

  l3-op-proposer:
    image: local/op-proposer:${OPSTACK_IMAGE_TAG:-local}
    user: "${OPSTACK_UID:-1000}:${OPSTACK_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    depends_on:
