x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  l1:
    image: ${FOUNDRY_IMAGE:-ghcr.io/foundry-rs/foundry:nightly-2024-09-18}
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "${L1_CHAIN_ID:-31337}"
      - --timestamp
      - "${L1_TIMESTAMP:-1767502513}"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "28545:8545"
    restart: unless-stopped
    logging: *default-logging
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

  op-gate:
    image: ${OP_GATE_IMAGE:-local/op-gate:0.1.0}
    build:
      context: ./gate
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${OP_STACK_BASE_IMAGE:-node:22-alpine3.19}
    user: "1000:1000"
    working_dir: /app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l1:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "${GATE_PORT:-8545}"
      UPSTREAM_RPC: "${GATE_UPSTREAM_RPC:-http://l1:8545}"
      STATE_DIR: "/state"
      ADMIN_TOKEN: "${GATE_ADMIN_TOKEN:-}"
      ALLOW_INSECURE_ADMIN: "${GATE_ALLOW_INSECURE_ADMIN:-0}"
      DEFAULT_DELAY_SECONDS: "${GATE_DEFAULT_DELAY_SECONDS:-0}"
      GUARD_URL: "${GATE_GUARD_URL:-http://host.docker.internal:7070}"
      BATCH_SENDER_ADDRESS: "${BATCH_SENDER_ADDRESS:-}"
      PROPOSER_ADDRESS: "${PROPOSER_ADDRESS:-}"
    volumes:
      - op_gate_state:/state
    ports:
      - "28546:8545"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8545/gate/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    <<: *default-security
    mem_limit: 512m
    cpus: "0.5"

  l2-geth:
    image: local/op-geth:${OPSTACK_IMAGE_TAG:-devnet}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l1:
        condition: service_healthy
      op-gate:
        condition: service_healthy
    ports:
      - "29545:8545"
    volumes:
      - ./data/l2-geth:/data
      - ./config/jwt.txt:/config/jwt.txt:ro
      - ./config/genesis-l2.json:/config/genesis-l2.json:ro
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -e
        if [ ! -d /data/geth ]; then
          echo "[l2-geth] initializing genesis..."
          geth init --datadir /data /config/genesis-l2.json
        fi
        exec geth \
          --http --http.addr=0.0.0.0 --http.api=eth,net,web3,debug \
          --http.vhosts="*" \
          --ws --ws.addr=0.0.0.0 --ws.origins="*" \
          --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.vhosts="*" --authrpc.jwtsecret=/config/jwt.txt \
          --datadir=/data \
          --networkid=${L2_CHAIN_ID:-901} \
          --gcmode=archive \
          --rollup.disabletxpoolgossip=true
    healthcheck:
      test: ["CMD-SHELL", "geth attach http://localhost:8545 --exec net.version >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 4g
    cpus: "2.0"

  op-node:
    image: local/op-node:${OPSTACK_IMAGE_TAG:-devnet}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      l1:
        condition: service_healthy
      l2-geth:
        condition: service_healthy
    volumes:
      - ./data/op-node:/data
      - ./config/rollup.json:/config/rollup.json:ro
      - ./config/jwt.txt:/config/jwt.txt:ro
      - ./config/l1-chain.json:/config/l1-chain.json:ro
    environment:
      OP_NODE_L1_BEACON_IGNORE: "1"
      OP_NODE_SEQUENCER_ENABLED: "1"
    command:
      - op-node
      - --l1=${L1_RPC:-http://l1:8545}
      - --l2=http://l2-geth:8551
      - --l2.jwt-secret=/config/jwt.txt
      - --rollup.config=/config/rollup.json
      - --rollup.l1-chain-config=/config/l1-chain.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=9546
      - --l1.rpckind=basic
      - --p2p.disable
      - --l1.beacon.ignore
      - --sequencer.enabled
      - --sequencer.l1-confs=0
      - --l1.runtime-config-reload-interval=0
      - --guard-url=http://op-gate:8545/guard/op-node
      - --guard-timeout=5s
      - --guard-fail-open=false
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=7300
    ports:
      - "9546:9546"
      - "7300:7300"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:9546 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  op-batcher:
    image: local/op-batcher:${OPSTACK_IMAGE_TAG:-devnet}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      op-node:
        condition: service_healthy
      op-gate:
        condition: service_healthy
    environment:
      L2OO_ADDRESS: "${L2OO_ADDRESS:-0x0000000000000000000000000000000000000000}"
    command:
      - op-batcher
      - --l1-eth-rpc=http://op-gate:8545
      - --l2-eth-rpc=http://l2-geth:8545
      - --rollup-rpc=http://op-node:9546
      - --private-key=${BATCHER_KEY}
      - --rpc.addr=0.0.0.0
      - --rpc.port=8551
      - --throttle.unsafe-da-bytes-lower-threshold=0
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=7301
    volumes:
      - ./config/rollup.json:/config/rollup.json:ro
    ports:
      - "8551:8551"
      - "7301:7301"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:8551 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

  op-proposer:
    image: local/op-proposer:${OPSTACK_IMAGE_TAG:-devnet}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      op-node:
        condition: service_healthy
      op-gate:
        condition: service_healthy
    command:
      - op-proposer
      - --l1-eth-rpc=http://op-gate:8545
      - --rollup-rpc=http://op-node:9546
      - --game-factory-address=${GAME_FACTORY_ADDRESS:-0xa79c78bcb7c9a77f962638cee8f80f39a91f2dc3}
      - --proposal-interval=30s
      - --game-type=0
      - --private-key=${PROPOSER_KEY}
      - --allow-non-finalized
      - --guard-url=http://op-gate:8545/guard/proposer
      - --guard-timeout=5s
      - --guard-fail-open=false
      - --rpc.addr=0.0.0.0
      - --rpc.port=8560
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=7302
    volumes:
      - ./config/rollup.json:/config/rollup.json:ro
    ports:
      - "8560:8560"
      - "7302:7302"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://localhost:8560 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 25s
    <<: *default-security
    mem_limit: 1g
    cpus: "1.0"

  # Challenger requires Kona/cannon base images; leave optional for now.
  # op-challenger:
  #   image: local/op-challenger:latest
  #   restart: unless-stopped
  #   logging: *default-logging
  #   depends_on:
  #     - op-node
  #   command:
  #     - op-challenger
  #     - --l2=http://l2-geth:9545
  #     - --l1=${L1_RPC:-http://l1:8545}
  #     - --rollup.config=/config/rollup.json
  #     - --rpc.addr=0.0.0.0
  #     - --rpc.port=8561
  #     - --private-key=${CHALLENGER_KEY}
  #   volumes:
  #     - ./config/rollup.json:/config/rollup.json:ro
  #   ports:
  #     - "8561:8561"

  prometheus:
    profiles: ["observability"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    <<: *default-security
    mem_limit: 512m
    cpus: "0.5"

  grafana:
    profiles: ["observability"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    <<: *default-security
    mem_limit: 512m
    cpus: "0.5"

volumes:
  op_gate_state:
  prometheus_data:
  grafana_data:
