    - --rollup-rpc=http://op-sequencer:9646
    - --private-key=${BATCHER_KEY}
    - --rpc.addr=0.0.0.0
    - --rpc.port=8551
    # op-geth in this stack does not expose miner_setMaxDASize; disable DA throttling.
    - --throttle-interval=0
