      l1-rpc-proxy:
        condition: service_healthy
    volumes:
    - ./data/op-sequencer:/data
    - ./config:/config:ro
    environment:
      OP_NODE_L1_BEACON_IGNORE: '1'
    command:
    - op-node
    - --l1=http://l1-rpc-proxy:18546
    - --l2=http://l2-geth:8551
    - --l2.jwt-secret=/config/jwt.txt
    - --rollup.config=/config/rollup.json
    - --rpc.addr=0.0.0.0
    - --rpc.port=9646
    - --rpc.enable-admin
    - --rpc.admin-state=/data/admin-state.json
    - --l1.rpckind=basic
    - --l1.trustrpc
    - --p2p.disable
    - --l1.beacon.ignore
    - --sequencer.enabled
    - --sequencer.l1-confs=${SEQUENCER_L1_CONFS:-2}
    - --l1.runtime-config-reload-interval=0
    - --metrics.enabled
    - --metrics.addr=0.0.0.0
    - --metrics.port=7303
    ports:
    - 9646:9646
    - 7303:7303
    healthcheck:
      test:
      - CMD-SHELL
      - 'wget -qO- --header=''Content-Type: application/json'' --post-data=''{"jsonrpc":"2.0","id":1,"method":"optimism_syncStatus","params":[]}''
        http://localhost:9646 >/dev/null'
      interval: 20s
      timeout: 10s
      retries: 6
