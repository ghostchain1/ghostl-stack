x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  l1-mainnet-geth:
    image: ghostl/geth:stable
    restart: unless-stopped
    user: "1001:1001"
    logging: *default-logging
    command: >
      --syncmode snap
      --http --http.addr=0.0.0.0 --http.port=8545 --http.api=eth,net,web3,txpool
      --http.vhosts="*"
      --http.corsdomain="*"
      --ws --ws.addr=0.0.0.0 --ws.port=8546 --ws.api=eth,net,web3
      --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.vhosts="*"
      --datadir=/data
      --cache=4096
      --maxpeers=50
      --metrics --metrics.addr=0.0.0.0 --metrics.port=6060
    ports:
      - "38545:8545"   # HTTP
      - "38546:8546"   # WS
      - "38551:8551"   # Auth RPC (engine)
      - "38660:6060"   # Metrics
    volumes:
      - l1-mainnet-geth-data:/data
    <<: *default-security
    mem_limit: 8g
    cpus: "2.0"

volumes:
  l1-mainnet-geth-data:
