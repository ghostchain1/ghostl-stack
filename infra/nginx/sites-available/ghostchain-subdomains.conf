# ══════════════════════════════════════════════════════════════════════
# GhostChain Portal Subdomains — HTTPS virtual hosts
# All resolve to 38.247.149.218, cert: ghostchain-portals
#
# Subdomain → backend port mapping:
#   app.ghostchain.cloud      → ghostweb-apps     :3013
#   admin.ghostchain.cloud    → ghostweb-portal   :3020
#   investor.ghostchain.cloud → ghostweb-investor :3011
#   employee.ghostchain.cloud → ghostweb-company  :3018
#   validator.ghostchain.cloud→ ghostweb-nodes    :3016
#   docs.ghostchain.cloud     → ghostweb-dev      :3012
#   bridge.ghostchain.cloud   → ghostweb-exchange :3017
#   company.ghostchain.cloud  → ghostweb-company  :3018
#
# TLS cert: /etc/letsencrypt/live/ghostchain-portals/
# Generated: 2026-03-14
# ══════════════════════════════════════════════════════════════════════

# Shared SSL settings macro (can't use variables here; repeated inline)
# SNI: all subdomains share one SAN cert

# ── app.ghostchain.cloud — User App (ghostweb-apps :3013) ─────────────
server {
    listen      38.247.149.218:443 ssl http2;
    server_name app.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/ghostchain-portals/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain-portals/privkey.pem;
    include /home/ghost/ghostl-stack/infra/nginx/snippets/ssl-params.conf;
    include /home/ghost/ghostl-stack/infra/nginx/snippets/security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://ghostweb_apps;
        include /home/ghost/ghostl-stack/infra/nginx/snippets/proxy-params.conf;
        proxy_buffering    off;
    }
}

