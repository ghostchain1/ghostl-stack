# ══════════════════════════════════════════════════════════════════════
# GhostChain public subdomains — HTTPS virtual hosts
# All resolve to 38.247.149.218, cert: ghostchain-portals
#
# Subdomain → backend mapping:
#   apps/app               → ghostweb_apps       :3013
#   portal/admin           → ghostweb_portal     :3020
#   investor               → ghostweb_investor   :3011
#   company/employee       → ghostweb_company    :3018
#   nodes/validator        → ghostweb_nodes      :3016
#   dev                    → ghostweb_dev        :3012
#   docs                   → ghostweb_docs       :3023
#   explorer               → ghostweb_explorer   :3014
#   governance             → ghostweb_governance :3015
#   exchange               → ghostweb_exchange   :3017
#   wallet                 → ghostweb_wallet     :3021
#   bridge                 → ghostweb_bridge     :3022
#   status                 → ghostweb_status     :3019
#   ai                     → ghostweb_ai         :3025
#   rpc                    → ghostweb_rpc_portal :3026
# ══════════════════════════════════════════════════════════════════════

server {
    listen      38.247.149.218:443 ssl http2;
    server_name app.ghostchain.cloud apps.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/ghostchain-portals/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain-portals/privkey.pem;
    include /home/ghost/ghostl-stack/infra/nginx/snippets/ssl-params.conf;
    include /home/ghost/ghostl-stack/infra/nginx/snippets/security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://ghostweb_apps;
        include /home/ghost/ghostl-stack/infra/nginx/snippets/proxy-params.conf;
        proxy_buffering    off;
    }
}

