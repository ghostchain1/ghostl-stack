# ══════════════════════════════════════════════════════════════════════════════
# GhostChain API — Virtual Hosts
#
# api.ghostchain.cloud  → 127.0.0.1:4000  (Express BFF)
# All api.* subdomains share the same upstream.
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen  38.247.149.218:80;
    listen  38.247.149.219:80;
    listen  38.247.149.220:80;
    listen  38.247.149.221:80;
    listen  38.247.149.222:80;
    listen  38.247.149.223:80;
    listen  38.247.149.224:80;

    server_name
        api.ghostchain.cloud
        api.ghostchain.info
        api.ghostchain.life
        api.ghostchain.live
        api.ghostchain.online
        api.ghostchain.space
        api.ghostchain.store
        api.ghostchain.world
        api.ghostchainlink.com
        api.ghostchainsolutions.com
        api.ghostschain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — api.ghostchain.cloud (primary API endpoint) ──────────────────────
server {
    listen      38.247.149.218:443 ssl http2;
    server_name api.ghostchain.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ghostchain.cloud/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # API rate limits — stricter than portal
    limit_conn conn_limit 50;
    limit_req  zone=api_limit burst=100 nodelay;

    # Auth endpoints — extra strict to limit brute force
    location ~* ^/(auth|login|token|oauth)/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_api;
        limit_req  zone=auth_limit burst=10 nodelay;
    }

    # Health-check (inherits server-level api_limit zone, which is fine)
    location = /health {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_api;
    }

    # All other API routes
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_api;

        # CORS preflight pass-through
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }
    }
}

# ── HTTPS — additional api.* aliases (all proxy to ghostchain_api) ─────────
server {
    listen      38.247.149.219:443 ssl http2;
    listen      38.247.149.220:443 ssl http2;
    listen      38.247.149.221:443 ssl http2;
    listen      38.247.149.222:443 ssl http2;
    listen      38.247.149.223:443 ssl http2;
    listen      38.247.149.224:443 ssl http2;
    server_name
        api.ghostchain.info
        api.ghostchain.life
        api.ghostchain.live
        api.ghostchain.online
        api.ghostchain.space
        api.ghostchain.store
        api.ghostchain.world
        api.ghostchainlink.com
        api.ghostchainsolutions.com
        api.ghostschain.com;

    # Re-use the primary cert via Subject Alternative Names
    # (certbot --cert-name api.ghostchain.cloud handles all api.* SANs)
    ssl_certificate     /etc/letsencrypt/live/api.ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ghostchain.cloud/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_limit 50;
    limit_req  zone=api_limit burst=100 nodelay;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_api;
    }
}
