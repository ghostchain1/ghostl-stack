# ══════════════════════════════════════════════════════════════════════════════
# HTTPS — ghostchain.space (38.247.149.222 — GhostBrain AI portal)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen      38.247.149.222:443 ssl http2;
    server_name ghostchain.space www.ghostchain.space;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.space/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_limit 50;
    limit_req  zone=portal_limit burst=30 nodelay;

    location /_next/static/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # GhostBrain API pass-through — SSE streams must not buffer
    location /api/brain/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass         http://ghostbrain_core/;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        limit_req zone=api_limit burst=20 nodelay;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
    }
}

