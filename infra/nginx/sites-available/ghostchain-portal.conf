# ══════════════════════════════════════════════════════════════════════════════
# GhostChain Portal — Primary Virtual Hosts
#
# Domains served by this config:
#   38.247.149.218  ghostchain.cloud   ghostchain.world
#   38.247.149.219  ghostchain.info    ghostchain.online
#   38.247.149.220  ghostchain.life    ghostchain.live
#   38.247.149.221  ghostchain.store
#   38.247.149.222  ghostchain.space
#   38.247.149.223  ghostchainlink.com ghostschain.com
#   38.247.149.224  ghostchainsolutions.com
#
# All HTTP traffic → 301 HTTPS.
# All HTTPS traffic → upstream Next.js portal on 127.0.0.1:3200.
# API traffic (api.*) is handled in ghostchain-api.conf.
#
# Generated: 2026-03-13
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect (all IPs, all domains) ──────────────────────────────
server {
    listen  38.247.149.218:80;
    listen  38.247.149.219:80;
    listen  38.247.149.220:80;
    listen  38.247.149.221:80;
    listen  38.247.149.222:80;
    listen  38.247.149.223:80;
    listen  38.247.149.224:80;

    server_name
        ghostchain.cloud
        ghostchain.info
        ghostchain.life
        ghostchain.live
        ghostchain.online
        ghostchain.space
        ghostchain.store
        ghostchain.world
        ghostchainlink.com
        ghostchainsolutions.com
        ghostschain.com
        # www variants
        www.ghostchain.cloud
        www.ghostchain.info
        www.ghostchain.life
        www.ghostchain.live
        www.ghostchain.online
        www.ghostchain.space
        www.ghostchain.store
        www.ghostchain.world
        www.ghostchainlink.com
        www.ghostchainsolutions.com
        www.ghostschain.com
        # portal subdomains
        app.ghostchain.cloud
        admin.ghostchain.cloud
        investor.ghostchain.cloud
        employee.ghostchain.cloud
        validator.ghostchain.cloud
        docs.ghostchain.cloud
        bridge.ghostchain.cloud
        company.ghostchain.cloud;

    # ACME challenge directory for Let's Encrypt HTTP-01 verification
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# HTTPS — ghostchain.cloud (primary — 38.247.149.218)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen      38.247.149.218:443 ssl http2;
    server_name ghostchain.cloud www.ghostchain.cloud ghostchain.world www.ghostchain.world;

    ssl_certificate     /etc/letsencrypt/live/ghostchain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostchain.cloud/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Rate limiting
    limit_conn conn_limit 100;
    limit_req  zone=portal_limit burst=60 nodelay;

    # Static assets — long cache, served directly from Next.js standalone build
    location /_next/static/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Health check endpoint (inherits portal_limit zone, acceptable for /api/health)
    location = /api/health {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
    }

    # Robots / sitemap
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
        access_log off;
    }

    # Portal — all other traffic
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://ghostchain_portal;
    }
}

