# GhostChain — Shared SSL/TLS Parameters
# Include in every HTTPS server block.
#
# include /etc/nginx/snippets/ssl-params.conf;

# Only TLS 1.2 and 1.3 — ban older broken protocols
ssl_protocols             TLSv1.2 TLSv1.3;

# Strong cipher suite (TLS 1.2 compat + TLS 1.3 defaults)
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;

# Session caching — 1MB ≈ 4000 sessions
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# OCSP stapling — reduces TLS handshake RTT
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout          5s;

# DH params for TLS 1.2 key exchange (generate with: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 4096)
ssl_dhparam               /etc/nginx/ssl/dhparam.pem;

# Buffer size — one record per MTU
ssl_buffer_size           4k;
