# GhostChain — Shared Security Headers
# Include in every HTTPS server block.
#
# include /etc/nginx/snippets/security-headers.conf;

# Enforce HTTPS for 2 years, including subdomains
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# No framing allowed
add_header X-Frame-Options "DENY" always;

# Prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Limit referrer info
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions — minimal footprint for a blockchain dashboard
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Content Security Policy
# 'unsafe-inline' is required for Next.js App Router hydration scripts.
# 'unsafe-eval' is intentionally absent.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Prevent XSS in older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Hide server OS info
server_tokens off;
