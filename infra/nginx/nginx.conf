# GhostChain Production — nginx main configuration
#
# Tuned for a high-throughput blockchain portal:
#   - worker_processes auto    (one per vCPU)
#   - 1024 connections/worker
#   - Gzip + Brotli (if ngx_brotli available)
#   - Buffer tweaks for SSE / large JSON payloads from chain RPCs
#
user  www-data;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    # ── Buffers / timeouts ─────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    client_max_body_size        10m;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_body_timeout         30s;
    client_header_timeout       10s;
    send_timeout                30s;
    proxy_connect_timeout       10s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    proxy_buffer_size           8k;
    proxy_buffers               8 64k;
    proxy_busy_buffers_size     128k;
    # Allow SSE / long-poll responses to stream without buffering
    proxy_buffering             off;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # General API rate limit — 60 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=api_limit:20m     rate=60r/s;
    # Portal page rate limit — 30 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=portal_limit:20m  rate=30r/s;
    # Login/auth endpoint — max 5 req/s
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m    rate=5r/s;

    # ── Connection limiting ────────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── Upstream pools ─────────────────────────────────────────────────────────
    upstream ghostchain_web_main { server 127.0.0.1:3200; keepalive 64; }
    upstream ghostchain_portal {
        server 127.0.0.1:3200;
        keepalive 64;
    }
    upstream ghostweb_main { server 127.0.0.1:3010; keepalive 32; }
    upstream ghostweb_investor { server 127.0.0.1:3011; keepalive 32; }
    upstream ghostweb_dev { server 127.0.0.1:3012; keepalive 32; }
    upstream ghostweb_apps { server 127.0.0.1:3013; keepalive 32; }
    upstream ghostweb_explorer { server 127.0.0.1:3014; keepalive 32; }
    upstream ghostweb_governance { server 127.0.0.1:3015; keepalive 32; }
    upstream ghostweb_nodes { server 127.0.0.1:3016; keepalive 32; }
    upstream ghostweb_exchange { server 127.0.0.1:3017; keepalive 32; }
    upstream ghostweb_company { server 127.0.0.1:3018; keepalive 32; }
    upstream ghostweb_status { server 127.0.0.1:3019; keepalive 32; }
    upstream ghostweb_portal { server 127.0.0.1:3020; keepalive 32; }
    upstream ghostweb_wallet { server 127.0.0.1:3021; keepalive 32; }
    upstream ghostweb_bridge { server 127.0.0.1:3022; keepalive 32; }
    upstream ghostweb_docs { server 127.0.0.1:3023; keepalive 32; }
    upstream ghostweb_live { server 127.0.0.1:3024; keepalive 32; }
    upstream ghostweb_ai { server 127.0.0.1:3025; keepalive 32; }
    upstream ghostweb_rpc_portal { server 127.0.0.1:3026; keepalive 32; }

    upstream ghostchain_api {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    upstream ghostbrain_core {
        server 127.0.0.1:7900;
        keepalive 16;
    }


    upstream ghostxchange {
        server 127.0.0.1:3017;
        keepalive 32;
    }

    # ── Virtual hosts ──────────────────────────────────────────────────────────
    include /etc/nginx/sites-enabled/*.conf;
}
