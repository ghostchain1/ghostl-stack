{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["*"]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "valid-lifetime":  3600,
    "renew-timer":     1800,
    "rebind-timer":    2700,

    "subnet4": [{
      "id": 1,
      "subnet": "10.50.99.0/24",
      "pools": [{ "pool": "10.50.99.100 - 10.50.99.200" }],
      "option-data": [
        { "name": "routers",             "data": "10.50.99.1" },
        { "name": "domain-name-servers", "data": "10.50.99.30" },
        { "name": "domain-search",       "data": "ghostchain.internal" }
      ],
      "reservations": [
        { "hw-address": "52:54:00:00:01:0a", "ip-address": "10.50.99.10",  "hostname": "ghost-web" },
        { "hw-address": "52:54:00:00:01:14", "ip-address": "10.50.99.20",  "hostname": "ghostchain-bootnode" },
        { "hw-address": "52:54:00:00:01:15", "ip-address": "10.50.99.21",  "hostname": "ghostchain-node1" },
        { "hw-address": "52:54:00:00:01:16", "ip-address": "10.50.99.22",  "hostname": "ghostchain-node2" },
        { "hw-address": "52:54:00:00:01:1e", "ip-address": "10.50.99.30",  "hostname": "gns-bind9" },
        { "hw-address": "52:54:00:00:01:1f", "ip-address": "10.50.99.31",  "hostname": "gns-kea" },
        { "hw-address": "52:54:00:00:01:20", "ip-address": "10.50.99.32",  "hostname": "gns-postgres" },
        { "hw-address": "52:54:00:00:01:21", "ip-address": "10.50.99.33",  "hostname": "gns-indexer" },
        { "hw-address": "52:54:00:00:01:22", "ip-address": "10.50.99.34",  "hostname": "gns-api" },
        { "hw-address": "52:54:00:00:01:48", "ip-address": "10.50.99.72",  "hostname": "validator01" },
        { "hw-address": "52:54:00:00:01:49", "ip-address": "10.50.99.73",  "hostname": "validator02" },
        { "hw-address": "52:54:00:00:01:4c", "ip-address": "10.50.99.76",  "hostname": "l2-mainnet" },
        { "hw-address": "52:54:00:00:01:4d", "ip-address": "10.50.99.77",  "hostname": "l2-testnet" },
        { "hw-address": "52:54:00:00:01:4e", "ip-address": "10.50.99.78",  "hostname": "l3-mainnet" },
        { "hw-address": "52:54:00:00:01:4f", "ip-address": "10.50.99.79",  "hostname": "l3-testnet" }
      ]
    }],

    "ddns-send-updates":       true,
    "ddns-qualifying-suffix":  "ghostchain.internal.",
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip":      "127.0.0.1",
      "server-port":    53001
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/lib/kea/kea4-ctrl.sock"
    },

    "loggers": [{
      "name": "kea-dhcp4",
      "output_options": [{ "output": "stdout" }],
      "severity": "INFO"
    }]
  }
}
