{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "l2",
    "labels": {
      "app": "l2"
    }
  },
  "spec": {
    "type": "NodePort",
    "selector": {
      "app": "l2"
    },
    "ports": [
      {
        "port": "9545",
        "targetPort": 8545,
        "protocol": "TCP"
      },
      {
        "port": "8060",
        "targetPort": 6060,
        "protocol": "TCP"
      }
    ]
  }
}
