{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "prometheus",
    "labels": {
      "app": "prometheus"
    }
  },
  "spec": {
    "type": "NodePort",
    "selector": {
      "app": "prometheus"
    },
    "ports": [
      {
        "port": "9090",
        "targetPort": 9090,
        "protocol": "TCP"
      }
    ]
  }
}
