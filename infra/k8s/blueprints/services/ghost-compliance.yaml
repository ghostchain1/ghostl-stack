{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "ghost-compliance",
    "labels": {
      "app": "ghost-compliance"
    }
  },
  "spec": {
    "type": "NodePort",
    "selector": {
      "app": "ghost-compliance"
    },
    "ports": [
      {
        "port": "8090",
        "targetPort": 8090,
        "protocol": "TCP"
      }
    ]
  }
}
