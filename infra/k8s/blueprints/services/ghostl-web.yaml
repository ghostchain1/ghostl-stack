{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "ghostl-web",
    "labels": {
      "app": "ghostl-web"
    }
  },
  "spec": {
    "type": "LoadBalancer",
    "selector": {
      "app": "ghostl-web"
    },
    "ports": [
      {
        "port": "3200",
        "targetPort": 3200,
        "protocol": "TCP"
      }
    ]
  }
}
