{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "op-batcher",
    "labels": {
      "app": "op-batcher",
      "role": "chain"
    },
    "annotations": {
      "ghost.source.compose": "/home/ghost/ghostl-stack/infra/docker/compose/docker-compose.core.yml",
      "ghost.no_recreate": "true"
    }
  },
  "spec": {
    "serviceName": "op-batcher",
    "replicas": 1,
    "podManagementPolicy": "OrderedReady",
    "updateStrategy": {
      "type": "OnDelete"
    },
    "selector": {
      "matchLabels": {
        "app": "op-batcher"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "op-batcher",
          "role": "chain"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "op-batcher",
            "image": "us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:devnet",
            "command": null,
            "args": null,
            "env": [
              {
                "name": "OP_BATCHER_ALTDA_DA_SERVER",
                "value": "http://da-server:3100"
              },
              {
                "name": "OP_BATCHER_ALTDA_DA_SERVICE",
                "value": "${ALTDA_SERVICE}"
              },
              {
                "name": "OP_BATCHER_ALTDA_ENABLED",
                "value": "${ALTDA_ENABLED}"
              },
              {
                "name": "OP_BATCHER_BATCH_TYPE",
                "value": "1"
              },
              {
                "name": "OP_BATCHER_DATA_AVAILABILITY_TYPE",
                "value": "${DA_TYPE}"
              },
              {
                "name": "OP_BATCHER_L1_ETH_RPC",
                "value": "http://l1:8545"
              },
              {
                "name": "OP_BATCHER_L2_ETH_RPC",
                "value": "http://l2:8545"
              },
              {
                "name": "OP_BATCHER_MAX_CHANNEL_DURATION",
                "value": "2"
              },
              {
                "name": "OP_BATCHER_METRICS_ENABLED",
                "value": "true"
              },
              {
                "name": "OP_BATCHER_MNEMONIC",
                "value": "test test test test test test test test test test test junk"
              },
              {
                "name": "OP_BATCHER_NUM_CONFIRMATIONS",
                "value": "1"
              },
              {
                "name": "OP_BATCHER_POLL_INTERVAL",
                "value": "1s"
              },
              {
                "name": "OP_BATCHER_PPROF_ENABLED",
                "value": "true"
              },
              {
                "name": "OP_BATCHER_ROLLUP_RPC",
                "value": "http://op-node:8545"
              },
              {
                "name": "OP_BATCHER_RPC_ENABLE_ADMIN",
                "value": "true"
              },
              {
                "name": "OP_BATCHER_SEQUENCER_HD_PATH",
                "value": "m/44'/60'/0'/0/2"
              },
              {
                "name": "OP_BATCHER_SUB_SAFETY_MARGIN",
                "value": "4"
              }
            ],
            "ports": [
              {
                "containerPort": 6060,
                "protocol": "TCP"
              },
              {
                "containerPort": 7300,
                "protocol": "TCP"
              },
              {
                "containerPort": 8545,
                "protocol": "TCP"
              }
            ],
            "volumeMounts": []
          }
        ]
      }
    },
    "volumeClaimTemplates": []
  }
}
