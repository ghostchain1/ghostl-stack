{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "artifact-server",
    "labels": {
      "app": "artifact-server",
      "role": "api"
    },
    "annotations": {
      "ghost.source.compose": "/home/ghost/ghostl-stack/infra/docker/compose/docker-compose.core.yml",
      "ghost.no_recreate": "false"
    }
  },
  "spec": {
    "serviceName": "artifact-server",
    "replicas": 1,
    "podManagementPolicy": "OrderedReady",
    "updateStrategy": {
      "type": "OnDelete"
    },
    "selector": {
      "matchLabels": {
        "app": "artifact-server"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "artifact-server",
          "role": "api"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "artifact-server",
            "image": "nginx:1.25-alpine",
            "command": null,
            "args": null,
            "env": [],
            "ports": [
              {
                "containerPort": 80,
                "protocol": "TCP"
              }
            ],
            "volumeMounts": [
              {
                "name": "${PWD}/../.devnet/",
                "mountPath": "/usr/share/nginx/html"
              }
            ]
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "${PWD}/../.devnet/"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "10Gi"
            }
          }
        }
      }
    ]
  }
}
