{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "audit-log-service",
    "labels": {
      "app": "audit-log-service",
      "role": "api"
    },
    "annotations": {
      "ghost.source.compose": "/home/ghost/ghostl-stack/infra/docker/compose/docker-compose.services.yml",
      "ghost.no_recreate": "false"
    }
  },
  "spec": {
    "serviceName": "audit-log-service",
    "replicas": 1,
    "podManagementPolicy": "OrderedReady",
    "updateStrategy": {
      "type": "OnDelete"
    },
    "selector": {
      "matchLabels": {
        "app": "audit-log-service"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "audit-log-service",
          "role": "api"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "audit-log-service",
            "image": "ghostl/audit-log-service:local",
            "command": null,
            "args": null,
            "env": [
              {
                "name": "PORT",
                "value": "7641"
              },
              {
                "name": "AUDIT_LOG_PATH",
                "value": "/data/audit.log"
              }
            ],
            "ports": [
              {
                "containerPort": 7641,
                "protocol": "TCP"
              }
            ],
            "volumeMounts": [
              {
                "name": "./data",
                "mountPath": "/data"
              }
            ]
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "./data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "10Gi"
            }
          }
        }
      }
    ]
  }
}
