{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "contract-risk-service",
    "labels": {
      "app": "contract-risk-service",
      "role": "api"
    },
    "annotations": {
      "ghost.source.compose": "/home/ghost/ghostl-stack/infra/docker/compose/docker-compose.services.yml",
      "ghost.no_recreate": "false"
    }
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "contract-risk-service"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "contract-risk-service",
          "role": "api"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "contract-risk-service",
            "image": "ghostl/contract-risk-service:local",
            "command": null,
            "args": null,
            "env": [
              {
                "name": "PORT",
                "value": "7609"
              },
              {
                "name": "PROM_URL",
                "value": "${PROM_URL}"
              }
            ],
            "ports": [
              {
                "containerPort": 7609,
                "protocol": "TCP"
              }
            ],
            "volumeMounts": []
          }
        ]
      }
    }
  }
}
