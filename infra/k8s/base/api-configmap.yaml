apiVersion: v1
kind: ConfigMap
metadata:
  name: ghostl-api-config
  namespace: ghostl
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ALLOW_ORIGINS: "http://localhost:3200"
  AUTH_DB_PATH: "/data/ghostl.db"
  SQLITE_DB_PATH: "/data/ghostl.db"
  NFT_DB_PATH: "/data/ghostl.db"
  NFT_STORE_PATH: "/data/nfts.json"
  MARKET_DATA_FILE: "/data/market-data.json"
  KYC_STORE_PATH: "/data/kyc.json"
  INTEGRATIONS_STORE_PATH: "/data/integrations.json"
  OBSERVABILITY_CRITICAL_LOG_PATH: "/data/critical-logs.jsonl"
  PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
  GRAFANA_URL: "http://grafana.monitoring.svc.cluster.local:3000"
