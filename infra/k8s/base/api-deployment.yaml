apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostl-api
  namespace: ghostl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ghostl-api
  template:
    metadata:
      labels:
        app: ghostl-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/ghostchain1/ghostl-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: ghostl-api-config
            - secretRef:
                name: ghostl-api-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghostl-api-data
        - name: tmp
          emptyDir: {}
