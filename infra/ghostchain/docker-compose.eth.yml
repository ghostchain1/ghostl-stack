x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  ghostchain-bootnode:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    command:
      - bootnode
      - --nodekey
      - /config/boot.key
      - --addr
      - :30301
    volumes:
      - ./data/bootnode:/config
    ports:
      - "30301:30301/udp"
    networks:
      ghostchain:
        ipv4_address: 172.28.0.21
    <<: *default-security
    mem_limit: 256m
    cpus: "0.5"

  ghostchain-node1:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ghostchain-bootnode
    entrypoint: ["/bin/sh", "/config/run-node.sh"]
    volumes:
      - ./data/node1:/data
      - ./geth:/config:ro
      - ./config/bootnode-enode.txt:/run/bootnode-enode.txt:ro
    ports:
      - "18545:8545"
      - "18546:8546"
      - "18552:8551"
      - "18551:30303"
      - "18660:6060"
    environment:
      - CHAIN_ID=14000101
      - SIGNER_ADDRESS=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
      - HTTP_PORT=8545
      - WS_PORT=8546
      - AUTH_PORT=8551
      - P2P_PORT=30303
      - METRICS_PORT=6060
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' --header 'Content-Type: application/json' http://localhost:8545 >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      ghostchain:
        ipv4_address: 172.28.0.22
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

  ghostchain-node2:
    image: ${GETH_IMAGE:-ethereum/client-go:alltools-v1.13.14}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ghostchain-bootnode
    entrypoint: ["/bin/sh", "/config/run-node.sh"]
    volumes:
      - ./data/node2:/data
      - ./geth:/config:ro
      - ./config/bootnode-enode.txt:/run/bootnode-enode.txt:ro
    environment:
      - CHAIN_ID=14000101
      - SIGNER_ADDRESS=0x70997970c51812dc3a010c7d01b50e0d17dc79c8
      - HTTP_PORT=8545
      - WS_PORT=8546
      - AUTH_PORT=8551
      - P2P_PORT=30304
      - METRICS_PORT=6061
    networks:
      ghostchain:
        ipv4_address: 172.28.0.23
    <<: *default-security
    mem_limit: 2g
    cpus: "1.5"

networks:
  ghostchain:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
