services:
  ghostl-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env.example
      - ./apps/api/.env.docker
      - ./services/stack.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ALLOW_ORIGINS=http://localhost:3200
      - SQLITE_DB_PATH=/app/apps/api/data/ghostl.db
      - AUTH_DB_PATH=/app/apps/api/data/ghostl.db
      - NFT_STORE_PATH=/app/apps/api/data/nfts.json
      - MARKET_DATA_FILE=/app/apps/api/data/market-data.json
    volumes:
      - ./:/app
      - ./apps/api/data:/app/apps/api/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  ghostl-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3200:3200"
    env_file:
      - ./apps/web/.env.example
      - ./apps/web/.env.docker
    environment:
      - NODE_ENV=development
      - PORT=3200
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_INTERNAL_URL=http://ghostl-api:4000
      - NEXT_PUBLIC_AI_CORE_URL=http://localhost:3210
      - AI_CORE_URL=http://host.docker.internal:3210
      - NEXT_PUBLIC_GAS_ENGINE_URL=http://localhost:3210
      - GAS_ENGINE_URL=http://host.docker.internal:3210
      - GAS_ENGINE_ADMIN_TOKEN=${GAS_ENGINE_ADMIN_TOKEN}
      - NEXT_PUBLIC_PIL_URL=http://localhost:3220
      - PIL_URL=http://host.docker.internal:3220
    volumes:
      - ./:/app
    depends_on:
      - ghostl-api
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  ghost-gateway:
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: runner
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - API_TARGET=http://ghostl-api:4000
      - WS_TARGET=http://ghost-ws-gateway:8085
      - CORS_ORIGINS=http://localhost:3200,http://localhost:8080
    depends_on:
      - ghostl-api
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
