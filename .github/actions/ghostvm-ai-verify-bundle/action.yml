name: ghostvm-ai verify bundle
description: Verify a GhostVM AI evidence bundle and generate JSONL + markdown summary.

inputs:
  bundle_dir:
    description: Absolute or workspace-relative path to bundle directory containing manifest.json
    required: true
  working_directory:
    description: Working directory where ghostnetsync.py is located
    required: false
    default: services/ghostvm-ai
  jsonl_path:
    description: Output path for JSONL verification details
    required: false
    default: /tmp/ghostvm-ai-verify.jsonl
  summary_path:
    description: Output path for markdown summary
    required: false
    default: /tmp/ghostvm-ai-verify-summary.md
  append_job_summary:
    description: Whether to append markdown summary to GITHUB_STEP_SUMMARY
    required: false
    default: "true"

outputs:
  verify_ok:
    description: true/false verification result
    value: ${{ steps.summarize.outputs.verify_ok }}
  jsonl_path:
    description: Path to JSONL output
    value: ${{ inputs.jsonl_path }}
  summary_path:
    description: Path to markdown summary output
    value: ${{ inputs.summary_path }}

runs:
  using: composite
  steps:
    - name: Run bundle verification JSONL
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        PYTHONPATH=. python3 ghostnetsync.py verify-bundle --bundle-dir "${{ inputs.bundle_dir }}" --jsonl > "${{ inputs.jsonl_path }}"

    - name: Build markdown summary
      id: summarize
      shell: bash
      run: |
        python3 - <<'PY'
import json
from pathlib import Path
import os

jsonl_path = Path("${{ inputs.jsonl_path }}")
summary_path = Path("${{ inputs.summary_path }}")
bundle_dir = "${{ inputs.bundle_dir }}"

lines = jsonl_path.read_text(encoding='utf-8').splitlines()
summary = None
checks = []
for line in lines:
    if not line.strip():
        continue
    obj = json.loads(line)
    if obj.get('type') == 'bundle_summary':
        summary = obj
    elif obj.get('type') == 'check':
        checks.append(obj)

ok = bool(summary and summary.get('ok'))
status = 'PASS' if ok else 'FAIL'

md_lines = [
    f"### GhostVM AI Bundle Verification: {status}",
    "",
    f"- Bundle Dir Input: `{bundle_dir}`",
    f"- Bundle Dir: `{summary.get('bundle_dir') if summary else ''}`",
    f"- Manifest: `{summary.get('manifest') if summary else ''}`",
    "",
    "| Check | OK | Details |",
    "|---|---:|---|",
]
for c in checks:
    md_lines.append(f"| {c.get('name','')} | {'✅' if c.get('ok') else '❌'} | {c.get('details','')} |")

summary_path.write_text('\n'.join(md_lines) + '\n', encoding='utf-8')

github_output = os.environ.get('GITHUB_OUTPUT')
if github_output:
    with open(github_output, 'a', encoding='utf-8') as fh:
        fh.write(f"verify_ok={'true' if ok else 'false'}\n")
PY

    - name: Append GitHub job summary
      if: ${{ inputs.append_job_summary == 'true' }}
      shell: bash
      run: |
        cat "${{ inputs.summary_path }}" >> "$GITHUB_STEP_SUMMARY"
