name: ghostvm-ai workflow lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@3473757e5e13a6bceeb0ace8f12b006d7dcdb411 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          targets = list(Path('.github/workflows').glob('*.yml')) + \
            list(Path('.github/actions').rglob('action.yml') if Path('.github/actions').exists() else [])
          for target in targets:
            yaml.safe_load(target.read_text(encoding='utf-8'))
          print(f"validated_yaml_files={len(targets)}")
          PY

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.11
