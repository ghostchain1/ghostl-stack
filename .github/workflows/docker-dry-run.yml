name: docker-dry-run

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'
  push:
    branches:
      - main
      - master
      - brand/**
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Enforce GST-native gates
        run: |
          bash scripts/gst-leakage-gate.sh
          bash scripts/gst-symbol-gate.sh

      - name: Validate unified compose files
        run: |
          docker compose -f infra/docker/compose/docker-compose.core.yml config
          docker compose -f infra/docker/compose/docker-compose.services.yml config
          docker compose -f infra/docker/compose/docker-compose.ui.yml config
          docker compose -f infra/docker/compose/docker-compose.obs.yml config
          docker compose -f infra/docker/compose/docker-compose.ai.yml config

      - name: Compose diff safety checks
        run: |
          bash infra/docker/tests/compose-diff.sh

      - name: Build API and Web images (dry-run)
        run: |
          docker build -f apps/api/Dockerfile --target runner -t ghostl-api:dry-run .
          docker build -f apps/web/Dockerfile --target runner -t ghostl-web:dry-run .
          docker image rm ghostl-api:dry-run ghostl-web:dry-run || true

      - name: Terraform plan (dry-run)
        run: |
          bash infra/terraform/terraform-plan.sh

      - name: Helm template (dry-run)
        run: |
          bash infra/helm/helm-template.sh
