# CodeQL security analysis — replaces the deprecated github/ossar-action@v1
# which was archived, used the deprecated `set-output` command, and had no
# Node.js 24-compatible release. CodeQL is the maintained GitHub-native
# successor for SARIF-based code scanning.
name: OSSAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 21 * * 2'

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    permissions:
      contents: read        # required by actions/checkout
      security-events: write # required to upload SARIF results
      actions: read         # required by codeql-action in private repos
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        # javascript covers TypeScript as well
        languages: javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript"
