name: econ-engine

on:
  pull_request:
    paths:
      - "contracts/src/econ/**"
      - "contracts/test/foundry/GhostEconomic*.t.sol"
      - "services/hg-*/**"
      - "apps/web/app/econ/**"
      - "apps/web/app/api/econ/**"
      - "observability/**"
      - "docker-compose.econ.*.yml"
      - "scripts/econ/**"
      - "docs/econ/**"
  push:
    branches: ["main", "release/**"]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - run: npm ci
      - run: npm run lint
      - run: npm run build:web
      - run: npm run build:api

  foundry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge test --match-path test/foundry/GhostEconomicRouting.t.sol
      - run: cd contracts && forge test --match-path test/foundry/GhostEconomicGovernanceRisk.t.sol
      - run: cd contracts && forge test --match-path test/foundry/GhostEconomicFlywheel.t.sol

  routing-law-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/econ/verify-routing-law.sh

  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/econ/verify-governance-gate.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          trivy-config: trivy-secret.yaml
          exit-code: 1

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0
          skip-dirs: node_modules,contracts/artifacts,contracts/cache,contracts/out-codex,contracts/cache-codex

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hg images
        run: |
          docker build -t hg-treasury-agent:ci services/hg-treasury-agent
          docker build -t hg-risk-oracle:ci services/hg-risk-oracle
          docker build -t hg-reporting-indexer:ci services/hg-reporting-indexer
          docker build -t hg-proof-snapshotter:ci services/hg-proof-snapshotter

  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Promotion gate not required on non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Promotion gate only enforced on main; marking job successful for this ref."

      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
      - name: Ensure mainnet activation policy script exists
        if: github.ref == 'refs/heads/main'
        run: test -f scripts/econ/verify-governance-gate.sh
