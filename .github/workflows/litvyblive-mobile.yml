name: LitVybz Live — Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/litvyblive/mobile/**'
      - 'packages/ghost_flutter_sdk/**'
      - '.github/workflows/litvyblive-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/litvyblive/mobile/**'
      - 'packages/ghost_flutter_sdk/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - profile

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'
  APP_DIR: apps/litvyblive/mobile
  SDK_DIR: packages/ghost_flutter_sdk

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Analyze & test (runs on ubuntu, fast)
  # ──────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/litvyblive/mobile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install ghost_flutter_sdk dependencies
        working-directory: packages/ghost_flutter_sdk
        run: flutter pub get

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage --reporter=github 2>/dev/null || flutter test --reporter=github

  # ──────────────────────────────────────────────────────────────────────────
  # Android APK + AAB
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: apps/litvyblive/mobile
    env:
      HAS_KEYSTORE:  ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      HAS_FIREBASE_ANDROID: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_BASE64 != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install ghost_flutter_sdk dependencies
        working-directory: packages/ghost_flutter_sdk
        run: flutter pub get

      - name: Install app dependencies
        run: flutter pub get

      # ── Decode keystore (if release signing secrets exist) ──
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/litvyblive-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=litvyblive-release.jks
          EOF

      # ── Inject real Firebase google-services.json if available ──
      - name: Inject Firebase Android config
        if: env.HAS_FIREBASE_ANDROID == 'true'
        run: |
          echo "${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_BASE64 }}" | \
            base64 --decode > android/app/google-services.json

      # ── Debug builds (always) ──
      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=GHOST_L3_RPC=${{ vars.GHOST_L3_RPC || 'http://localhost:39545' }} \
            --dart-define=API_BASE_URL=${{ vars.LITVYB_API_URL || 'http://localhost:7001' }} \
            --dart-define=SOCKET_URL=${{ vars.LITVYB_SOCKET_URL || 'http://localhost:7001' }} \
            --dart-define=GHOSTBRAIN_URL=${{ vars.GHOSTBRAIN_URL || 'http://localhost:7002' }} \
            --dart-define=MEDIASOUP_URL=${{ vars.MEDIASOUP_URL || 'http://localhost:2000' }}

      - name: Build APK (release)
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'pull_request' }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi \
            --dart-define=GHOST_L3_RPC=${{ vars.GHOST_L3_RPC || 'http://localhost:39545' }} \
            --dart-define=API_BASE_URL=${{ vars.LITVYB_API_URL || 'http://localhost:7001' }} \
            --dart-define=SOCKET_URL=${{ vars.LITVYB_SOCKET_URL || 'http://localhost:7001' }} \
            --dart-define=GHOSTBRAIN_URL=${{ vars.GHOSTBRAIN_URL || 'http://localhost:7002' }} \
            --dart-define=MEDIASOUP_URL=${{ vars.MEDIASOUP_URL || 'http://localhost:2000' }}

      - name: Build App Bundle (release)
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name == 'push' }}
        run: |
          flutter build appbundle --release \
            --dart-define=GHOST_L3_RPC=${{ vars.GHOST_L3_RPC || 'http://localhost:39545' }} \
            --dart-define=API_BASE_URL=${{ vars.LITVYB_API_URL || 'http://localhost:7001' }} \
            --dart-define=SOCKET_URL=${{ vars.LITVYB_SOCKET_URL || 'http://localhost:7001' }} \
            --dart-define=GHOSTBRAIN_URL=${{ vars.GHOSTBRAIN_URL || 'http://localhost:7002' }} \
            --dart-define=MEDIASOUP_URL=${{ vars.MEDIASOUP_URL || 'http://localhost:2000' }}

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks-${{ github.sha }}
          path: |
            apps/litvyblive/mobile/build/app/outputs/flutter-apk/*.apk
            apps/litvyblive/mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # iOS IPA (macOS runner — no codesign for unsigned build)
  # ──────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS Build
    runs-on: macos-15
    needs: analyze
    defaults:
      run:
        working-directory: apps/litvyblive/mobile
    env:
      HAS_FIREBASE_IOS:  ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICES_BASE64 != '' && 'true' || 'false' }}
      HAS_APPLE_CERT:    ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
      HAS_PROV_PROFILE:  ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: apps/litvyblive/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/litvyblive/mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install ghost_flutter_sdk dependencies
        working-directory: packages/ghost_flutter_sdk
        run: flutter pub get

      - name: Install app dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ── Inject real Firebase GoogleService-Info.plist if available ──
      - name: Inject Firebase iOS config
        if: env.HAS_FIREBASE_IOS == 'true'
        run: |
          echo "${{ secrets.FIREBASE_IOS_GOOGLE_SERVICES_BASE64 }}" | \
            base64 --decode > ios/Runner/GoogleService-Info.plist

      # ── Signed IPA (if Apple certificates are available) ──
      - name: Import Apple signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download provisioning profile
        if: env.HAS_PROV_PROFILE == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/litvyblive.mobileprovision

      # ── Unsigned build (always passes without certs) ──
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=GHOST_L3_RPC=${{ vars.GHOST_L3_RPC || 'http://localhost:39545' }} \
            --dart-define=API_BASE_URL=${{ vars.LITVYB_API_URL || 'http://localhost:7001' }} \
            --dart-define=SOCKET_URL=${{ vars.LITVYB_SOCKET_URL || 'http://localhost:7001' }} \
            --dart-define=GHOSTBRAIN_URL=${{ vars.GHOSTBRAIN_URL || 'http://localhost:7002' }} \
            --dart-define=MEDIASOUP_URL=${{ vars.MEDIASOUP_URL || 'http://localhost:2000' }}

      # ── Signed IPA export (only with certs) ──
      - name: Export signed IPA
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_PROV_PROFILE == 'true'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.sha }}
          path: |
            apps/litvyblive/mobile/build/ios/iphoneos/Runner.app
            apps/litvyblive/mobile/build/ios/ipa/*.ipa
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Release (tag-triggered — uploads to GitHub Releases)
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/mobile/v')

    steps:
      - uses: actions/checkout@v6

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apks-${{ github.sha }}
          path: dist/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-build-${{ github.sha }}
          path: dist/ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LitVybz Live ${{ github.ref_name }}
          body: |
            ## LitVybz Live — GhostChain-Powered Live Streaming

            ### Android
            - Download the **arm64 APK** for most modern devices
            - Or sideload via `adb install litvyblive-arm64-v8a-release.apk`

            ### iOS
            - Upload the IPA to TestFlight or distribute via MDM
            - Requires Apple Developer account for device installation

            ### Changelogs
            See [PLAN.md](../../PLAN.md) for version history.
          files: |
            dist/android/**/*.apk
            dist/android/**/*.aab
            dist/ios/**/*.ipa
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
