name: Docker Publish
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - prod
        default: staging

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name || github.run_id }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.ref_name == 'main' ||
            github.ref_name == 'master'
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.repository.full_name == github.repository &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Enforce GST-native gates
        run: |
          bash scripts/gst-leakage-gate.sh
          bash scripts/gst-symbol-gate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.DEPLOY_TAG }}

      - name: Build + push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.DEPLOY_TAG }}

  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (
          github.ref_name == 'main' ||
          github.ref_name == 'master'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Validate deploy secret
        run: |
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "KUBE_CONFIG secret is required for deploy job."
            exit 1
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy manifests
        run: kubectl apply -k infra/k8s/${{ github.event.inputs.environment }}
