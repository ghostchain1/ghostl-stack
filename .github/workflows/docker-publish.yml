name: Docker Publish
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - prod
        default: staging
      governance_proposal_id:
        description: Required for prod/mainnet deployment governance lock
        type: string
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name || github.run_id }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.ref_name == 'main' ||
            github.ref_name == 'master'
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.repository.full_name == github.repository &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Enforce GST-native gates
        run: |
          bash scripts/gst-leakage-gate.sh
          bash scripts/gst-symbol-gate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.DEPLOY_TAG }}

      - name: Build + push Web image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.DEPLOY_TAG }}

  build-ghostdns-hgop:
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghostdns-ai
            context: services/ghostdns-ai
            file: services/ghostdns-ai/Dockerfile
          - image: ghostdns-indexer
            context: services/ghostdns-indexer
            file: services/ghostdns-indexer/Dockerfile
          - image: ghostdns-resolver
            context: services/ghostdns-resolver
            file: services/ghostdns-resolver/Dockerfile
          - image: ghostdns-ai-policy
            context: services/ghostdns-ai-policy
            file: services/ghostdns-ai-policy/Dockerfile
          - image: ghostdns-attestor
            context: services/ghostdns-attestor
            file: services/ghostdns-attestor/Dockerfile
          - image: host-orchestrator-ai
            context: services/host-orchestrator-ai
            file: services/host-orchestrator-ai/Dockerfile
          - image: vm-protocol-ai
            context: services/vm-protocol-ai
            file: services/vm-protocol-ai/Dockerfile
          - image: hyper-ghost-supervisor
            context: services/hyper-ghost-supervisor
            file: services/hyper-ghost-supervisor/Dockerfile
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.image }} image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ env.DEPLOY_TAG }}

  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (
          github.ref_name == 'main' ||
          github.ref_name == 'master'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, build-ghostdns-hgop]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Validate deploy secret
        run: |
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "KUBE_CONFIG secret is required for deploy job."
            exit 1
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy manifests
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            if [[ -z "${{ github.event.inputs.governance_proposal_id }}" ]]; then
              echo "governance_proposal_id is required for prod deployment"
              exit 1
            fi
            bash scripts/verify-governance.sh --proposal-id "${{ github.event.inputs.governance_proposal_id }}"
          fi
          bash scripts/verify-routing.sh
          kubectl apply -k infra/k8s/${{ github.event.inputs.environment }}
