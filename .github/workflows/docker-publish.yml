name: Docker Publish
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - prod
        default: staging

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Enforce GST-native gates
        run: |
          bash scripts/gst-leakage-gate.sh
          bash scripts/gst-symbol-gate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-api:${{ env.DEPLOY_TAG }}

      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ghostl-web:${{ env.DEPLOY_TAG }}

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate deploy secret
        run: |
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "KUBE_CONFIG secret is required for deploy job."
            exit 1
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy manifests
        run: kubectl apply -k infra/k8s/${{ github.event.inputs.environment }}
