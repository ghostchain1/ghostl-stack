name: dependabot-auto-triage

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage-and-automerge:
    if: ${{ github.event.pull_request != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Always-pass gate
        run: |
          echo "dependabot-auto-triage gate active"

      - name: Triage gate
        run: |
          echo "PR author: ${{ github.event.pull_request.user.login }}"

      - name: No-op for non-Dependabot PRs
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          echo "Non-Dependabot PR detected; triage job is a no-op."

      - name: Fetch Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply triage labels
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.pull_request.number;
            const updateType = process.env.UPDATE_TYPE || "";
            const ecosystem = process.env.ECOSYSTEM || "unknown";

            const labels = ["dependencies", "dependabot", `ecosystem:${ecosystem}`];
            if (updateType === "version-update:semver-patch") {
              labels.push("semver:patch", "automerge:candidate");
            } else if (updateType === "version-update:semver-minor") {
              labels.push("semver:minor", "automerge:candidate");
            } else if (updateType === "version-update:semver-major") {
              labels.push("semver:major");
            } else {
              labels.push("semver:unknown");
            }

            const labelColors = {
              dependencies: "0E8A16",
              dependabot: "1D76DB",
              "semver:patch": "0E8A16",
              "semver:minor": "FBCA04",
              "semver:major": "B60205",
              "semver:unknown": "5319E7"
            };

            for (const label of labels) {
              const color = labelColors[label] || "0366D6";
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color,
                    description: `Auto-managed label for ${label}`
                  });
                } catch (createError) {
                  // Ignore races where another run created the same label first.
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels
            });

      - name: Enable auto-merge for patch/minor updates
        if: github.event.pull_request.user.login == 'dependabot[bot]' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number }}"
          if [ "$(gh pr view "${pr_number}" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already enabled for PR #${pr_number}."
            exit 0
          fi
          gh pr merge --auto --squash "${pr_number}"
