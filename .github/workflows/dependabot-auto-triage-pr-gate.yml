name: dependabot-auto-triage

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  triage-and-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required check gate
        run: |
          echo "Required triage check pass for pull_request context"
