name: ghoststack-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:

  # ── TypeScript build (GhostBrain monorepo) ───────────────────
  ghostbrain-build:
    name: GhostBrain TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyper-ghost-ai/services

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: hyper-ghost-ai/services/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all 21 packages
        run: pnpm -r build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostbrain-dist
          path: hyper-ghost-ai/services/*/dist/
          retention-days: 7

  # ── Security scan ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ghostbrain-build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: hyper-ghost-ai/services
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        working-directory: hyper-ghost-ai/services
        run: pnpm audit --audit-level=high || true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  # ── Next.js dashboard build ───────────────────────────────────
  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dashboard dependencies
        working-directory: apps/web
        run: npm install

      - name: Build Next.js dashboard
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SCP_URL: http://localhost:9500
          NEXT_PUBLIC_GRAFANA_URL: http://localhost:3001
          NEXT_PUBLIC_CHAIN_RPC: http://localhost:8545

  # ── Docker image builds ───────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: ghostbrain-build
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - ghostbrain-control-plane
          - ghostbrain-swarm
          - ghostbrain-kernel
          - ghostbrain-data-mesh
          - ghostbrain-economy-engine
          - ghostbrain-validator-fabric

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: hyper-ghost-ai/services/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Contract compilation (if contracts/ is non-empty) ─────────
  contracts-compile:
    name: Smart Contract Compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for Hardhat project
        id: has-contracts
        run: |
          if [[ -f "contracts/hardhat.config.ts" || -f "contracts/hardhat.config.js" ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install contract dependencies
        if: steps.has-contracts.outputs.exists == 'true'
        working-directory: contracts
        run: npm install

      - name: Compile contracts
        if: steps.has-contracts.outputs.exists == 'true'
        working-directory: contracts
        run: npx hardhat compile

  # ── Deployment (main branch only) ────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ghostbrain-build, security-scan, dashboard-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull latest code on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/ghost/ghostl-stack && git pull origin main"

      - name: Rebuild GhostBrain services
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/ghost/hyperghost-tooling/hyper-ghost-ai/services && pnpm install --frozen-lockfile && pnpm -r build"

      - name: Restart GhostBrain stack
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/ghost/ghostl-stack && docker compose -f infrastructure/docker/ghostbrain-stack.yml up -d --build"

      - name: Health check
        run: |
          sleep 15
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/ghost/ghostl-stack && bash scripts/maintenance/health-check.sh" || true
