name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  repo-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          TRIVY_VERSION="0.69.0"
          wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar zx
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy secret scan (tracked repo)
        env:
          # Prefer a dedicated PAT if configured; otherwise use the built-in workflow token.
          GITHUB_TOKEN: ${{ secrets.TRIVY_GITHUB_TOKEN || github.token }}
        run: |
          trivy fs \
            --timeout 10m \
            --scanners secret \
            --secret-config trivy-secret.yaml \
            --exit-code 1 \
            --skip-dirs node_modules,contracts/node_modules,dist,contracts/dist,contracts/artifacts,contracts/cache,contracts/.hardhat-cache,contracts/typechain-types,contracts/proposals \
            --skip-files ops/security/trivy-fs.json,contracts/reports/formal/scribble/scribble.json,contracts/artifacts/build-info/*.json,infra/opstack/op-geth/signer/fourbyte/4byte.json \
            .

  ghost-helper:
    needs: [repo-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Ghost Helper Bots deps
        working-directory: ghost-helper-bots
        run: npm ci

      - name: Build Ghost Helper Bots
        working-directory: ghost-helper-bots
        run: npm run build

      - name: Run Ghost Helper Bots loop (non-destructive)
        env:
          GHOST_REPO_ROOT: ${{ github.workspace }}
          GHOST_HELPER_MAX_ITERS: "1"
          GHOST_POLICY_OK: "true"
        working-directory: ghost-helper-bots
        run: node dist/loops/loop.js

      - name: Upload Ghost Helper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-helper-artifacts
          path: |
            ghost-helper-bots/reports
            ghost-helper-bots/evidence
            ghost-helper-bots/attestations
            ghost-helper-bots/sbom
