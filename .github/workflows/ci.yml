name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  ghost-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Ghost Helper Bots deps
        working-directory: ghost-helper-bots
        run: npm ci

      - name: Build Ghost Helper Bots
        working-directory: ghost-helper-bots
        run: npm run build

      - name: Run Ghost Helper Bots loop (non-destructive)
        env:
          GHOST_REPO_ROOT: ${{ github.workspace }}
          GHOST_HELPER_MAX_ITERS: "1"
          GHOST_POLICY_OK: "true"
        working-directory: ghost-helper-bots
        run: node dist/loops/loop.js

      - name: Upload Ghost Helper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-helper-artifacts
          path: |
            ghost-helper-bots/reports
            ghost-helper-bots/evidence
            ghost-helper-bots/attestations
            ghost-helper-bots/sbom
