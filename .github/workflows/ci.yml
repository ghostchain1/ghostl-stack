name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contracts install + build
        working-directory: contracts
        run: |
          npm install
          npm run build

      - name: Guard install
        working-directory: services/ghost-guard
        run: npm install
