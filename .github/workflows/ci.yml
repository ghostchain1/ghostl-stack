name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build apps
        run: npm run build

      - name: Contracts install + build
        working-directory: contracts
        run: |
          npm ci
          npm run build

      - name: Contracts test
        working-directory: contracts
        run: npm test

      - name: Guard install
        working-directory: services/ghost-guard
        run: npm ci

      - name: Relayer install
        working-directory: services/ghost-relayer
        run: npm ci
