name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'
  push:
    branches:
      - main
      - master
      - brand/**
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rpc-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Enforce gst_* Canonical RPC Namespace
        run: |
          bash ops/scripts/check-no-eth-rpc.sh

      - name: Enforce GST-native branding (no legacy leakage)
        run: |
          bash scripts/gst-leakage-gate.sh

      - name: Enforce GST symbol (no legacy symbol)
        run: |
          bash scripts/gst-symbol-gate.sh

  shellcheck:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: ShellCheck (core scripts)
        run: |
          set -euo pipefail
          ( git ls-files -z '*.sh' \
              | tr '\0' '\n' \
              | grep -E '^(dev-stack\\.sh|scripts/|ops/scripts/|ops/ghost-bots/|launch-system/|infra/ghostchain/ibft/|infra/scripts/)' \
              || true ) \
            | xargs -r shellcheck -S error

  ghost-bots-python:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Ghost Bots smoke (non-runtime)
        run: |
          bash scripts/ghost-bots-smoke.sh

      - name: Upload Ghost Bots smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-bots-smoke-artifacts
          path: |
            ops/ghost-bots/reports
          if-no-files-found: warn

  node-lint-build:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  hyper-ghost-supervisor:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: services/hyper-ghost-supervisor/package-lock.json

      - name: Install deps
        working-directory: services/hyper-ghost-supervisor
        run: npm ci

      - name: Build
        working-directory: services/hyper-ghost-supervisor
        run: npm run build

      - name: Test
        working-directory: services/hyper-ghost-supervisor
        run: npm test

  contracts-hardhat-compile:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts deps
        working-directory: contracts
        run: npm ci

      - name: Compile (Hardhat)
        working-directory: contracts
        run: npm run build

  contracts-gst-invariant:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: stable

      - name: Run GST invariant (Foundry)
        working-directory: contracts
        run: |
          forge test --match-path test/GSTInvariant.t.sol

  contracts-lge-tests:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: stable

      - name: Run Liquidity Gravity Engine tests (Foundry)
        working-directory: contracts
        run: |
          forge test --match-path 'test/foundry/*LiquidityGravityEngine*.t.sol'

  repo-security:
    needs: [rpc-namespace]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          TRIVY_VERSION="0.69.0"
          wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar zx
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy secret scan (tracked repo)
        env:
          # Prefer a dedicated PAT if configured; otherwise use the built-in workflow token.
          GITHUB_TOKEN: ${{ secrets.TRIVY_GITHUB_TOKEN || github.token }}
        run: |
          trivy fs \
            --timeout 10m \
            --scanners secret \
            --secret-config trivy-secret.yaml \
            --exit-code 1 \
            --skip-dirs node_modules,contracts/node_modules,dist,contracts/dist,contracts/artifacts,contracts/cache,contracts/.hardhat-cache,contracts/typechain-types,contracts/proposals \
            --skip-files ops/security/trivy-fs.json,contracts/reports/formal/scribble/scribble.json,contracts/artifacts/build-info/*.json,infra/opstack/op-geth/signer/fourbyte/4byte.json \
            .

  ghost-helper:
    needs: [repo-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"

      - name: Install Ghost Helper Bots deps
        working-directory: ghost-helper-bots
        run: npm ci

      - name: Build Ghost Helper Bots
        working-directory: ghost-helper-bots
        run: npm run build

      - name: Run Ghost Helper Bots loop (non-destructive)
        env:
          GHOST_REPO_ROOT: ${{ github.workspace }}
          GHOST_HELPER_MAX_ITERS: "1"
          GHOST_POLICY_OK: "true"
        working-directory: ghost-helper-bots
        run: node dist/loops/loop.js --mode analyze --maxIters 1

      - name: Upload Ghost Helper artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-helper-artifacts
          path: |
            ghost-helper-bots/reports
            ghost-helper-bots/evidence
            ghost-helper-bots/attestations
            ghost-helper-bots/sbom
