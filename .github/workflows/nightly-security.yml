name: Nightly Security

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          TRIVY_VERSION="0.69.0"
          wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar zx
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy filesystem scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy fs \
            --timeout 20m \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json -o trivy-fs.json \
            --skip-dirs node_modules,contracts/node_modules,dist,contracts/dist,contracts/artifacts,contracts/cache,contracts/.hardhat-cache,contracts/typechain-types,contracts/proposals,ops/preflight,ops/security,ops/snapshots,ops/docker/snapshots,ops/docker/attestations,backups,infra/docker/_backup,infra/docker/runtime,infra/ghostchain/data,infra/ghostchain/secrets,infra/opstack/data,infra/opstack/broadcast,infra/opstack/secrets,infra/opstack/l3/secrets,chains \
            .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-security
          path: trivy-fs.json
