name: Supply Chain Security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  doctor-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify routing law
        run: bash scripts/verify-routing.sh

      - name: Verify governance gate template
        run: bash scripts/verify-governance.sh --proposal-id EXAMPLE-0001

      - name: Run supervisor doctor gate
        run: node --experimental-strip-types tools/ghostcontrol/supervisor.ts --no-docker --fail-on critical

  container-vuln-sbom-sign:
    needs: [doctor-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -t ghostl-api:security-scan -f apps/api/Dockerfile .

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.69.0"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Vulnerability gate (HIGH/CRITICAL)
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output trivy-image.json \
            ghostl-api:security-scan

      - name: Install Syft
        run: |
          set -euo pipefail
          SYFT_VERSION="1.18.1"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" \
            | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SBOM
        run: syft packages ghostl-api:security-scan -o spdx-json=sbom.spdx.json

      - name: Install Cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION="v2.4.1"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o cosign
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign
          cosign version

      - name: Sign SBOM (keyless)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --output-signature sbom.spdx.sig \
            --output-certificate sbom.spdx.pem \
            sbom.spdx.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supply-chain-security-artifacts
          path: |
            trivy-image.json
            sbom.spdx.json
            sbom.spdx.sig
            sbom.spdx.pem
          if-no-files-found: warn

