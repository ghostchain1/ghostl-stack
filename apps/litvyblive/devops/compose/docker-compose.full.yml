  notification-service:
    build:
      <<: *build-api
      context: ../../backend/notification-service
      args: [PORT=7026]
    container_name: litvyblive-notifications
    ports: ["7026:7026"]
    environment:
      <<: *common-env
      PORT: "7026"
    volumes: [notification-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7026/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ══════════════════════════════════════════════════════════════════════════
  # STREAMING INFRASTRUCTURE (ports 3000-3005)
  # WebRTC SFU services use host networking for UDP RTP port ranges
  # ══════════════════════════════════════════════════════════════════════════

  mediasoup-server:
    build:
      <<: *build-stream
      context: ../../streaming/mediasoup-server
      args:
        - PORT=3000
        - INSTALL_FFMPEG=false
    container_name: litvyblive-stream-core
    network_mode: host
    environment:
      <<: *common-env
      PORT:          "3000"
      ANNOUNCED_IP:  "${PUBLIC_IP:-127.0.0.1}"
      RTC_MIN_PORT:  "40000"
      RTC_MAX_PORT:  "49999"
      NODE_ID:       "${MEDIASOUP_NODE_ID:-ms-core-1}"
      REGION:        "${REGION:-default}"
      HOST:          "${PUBLIC_IP:-127.0.0.1}"
    volumes: [mediasoup-data:/data]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      <<: *hc-http

  webrtc-gateway:
    build:
      <<: *build-stream
      context: ../../streaming/webrtc-gateway
      args: [PORT=3001]
    container_name: litvyblive-webrtc-gw
    ports: ["3001:3001"]
    environment:
      <<: *common-env
      PORT:                  "3001"
      MEDIASOUP_WS_URL:      "ws://${PUBLIC_IP:-127.0.0.1}:3000"
      STREAM_CONTROLLER_URL: "http://stream-controller:3002"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      <<: *hc-http
    <<: *svc-defaults

  stream-controller:
    build:
      <<: *build-stream
      context: ../../streaming/stream-controller
      args: [PORT=3002]
    container_name: litvyblive-stream-ctrl
    ports: ["3002:3002"]
    environment:
      <<: *common-env
      PORT:          "3002"
      MEDIASOUP_URL: "http://host.docker.internal:3000"
    volumes: [stream-ctrl-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      <<: *hc-http
    <<: *svc-defaults

  edge-node-us-east:
    build:
      <<: *build-stream
      context: ../../streaming/edge-nodes
      args: [PORT=3003]
    container_name: litvyblive-edge-us
    network_mode: host
    environment:
      <<: *common-env
      PORT:               "3003"
      ANNOUNCED_IP:       "${PUBLIC_IP:-127.0.0.1}"
      CORE_MEDIASOUP_URL: "ws://${PUBLIC_IP:-127.0.0.1}:3000"
      CORE_HTTP_URL:      "http://127.0.0.1:3000"
      RTC_MIN_PORT:       "41000"
      RTC_MAX_PORT:       "41999"
      NODE_ID:            "edge-us-east-1"
      REGION:             "us-east"
    volumes: [edge-us-data:/data]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      <<: *hc-http

  edge-node-eu-west:
    build:
      <<: *build-stream
      context: ../../streaming/edge-nodes
      args: [PORT=3013]
    container_name: litvyblive-edge-eu
    network_mode: host
    environment:
      <<: *common-env
      PORT:               "3013"
      ANNOUNCED_IP:       "${EU_WEST_IP:-127.0.0.1}"
      CORE_MEDIASOUP_URL: "ws://${PUBLIC_IP:-127.0.0.1}:3000"
      CORE_HTTP_URL:      "http://127.0.0.1:3000"
      RTC_MIN_PORT:       "42000"
      RTC_MAX_PORT:       "42999"
      NODE_ID:            "edge-eu-west-1"
      REGION:             "eu-west"
    volumes: [edge-eu-data:/data]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3013/health"]
      <<: *hc-http

  edge-node-asia:
    build:
      <<: *build-stream
      context: ../../streaming/edge-nodes
      args: [PORT=3023]
    container_name: litvyblive-edge-asia
    network_mode: host
    environment:
      <<: *common-env
      PORT:               "3023"
      ANNOUNCED_IP:       "${ASIA_IP:-127.0.0.1}"
      CORE_MEDIASOUP_URL: "ws://${PUBLIC_IP:-127.0.0.1}:3000"
      CORE_HTTP_URL:      "http://127.0.0.1:3000"
      RTC_MIN_PORT:       "43000"
      RTC_MAX_PORT:       "43999"
      NODE_ID:            "edge-asia-1"
      REGION:             "asia"
    volumes: [edge-asia-data:/data]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3023/health"]
      <<: *hc-http

  ffmpeg-transcoder:
    build:
      <<: *build-stream
      context: ../../streaming/ffmpeg-transcoder
      args:
        - PORT=3004
        - INSTALL_FFMPEG=true
    container_name: litvyblive-transcoder
    ports: ["3004:3004"]
    environment:
      <<: *common-env
      PORT:              "3004"
      MEDIASOUP_HTTP_URL: "http://host.docker.internal:3000"
      RECORDINGS_DIR:    "/recordings"
      HLS_DIR:           "/hls"
      RECORD_ALL:        "${RECORD_ALL:-false}"
    volumes:
      - transcoder-data:/data
      - recordings-data:/recordings
      - hls-data:/hls
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      <<: *hc-http
    <<: *svc-defaults

  redis-bus:
    build:
      <<: *build-stream
      context: ../../streaming/redis-bus
      args: [PORT=3005]
    container_name: litvyblive-redis-bus
    ports: ["3005:3005"]
    environment:
      <<: *common-env
      PORT: "3005"
    volumes: [redis-bus-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ══════════════════════════════════════════════════════════════════════════
  # MONITORING STACK
  # ══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: litvyblive-prometheus
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks: [litvyblive-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.2
    container_name: litvyblive-grafana
    ports: ["3100:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-ghost-admin}"
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "${GRAFANA_URL:-http://localhost:3100}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped
    networks: [litvyblive-net]

  # Node Exporter — host metrics (CPU, memory, disk, network)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: litvyblive-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    ports: ["9100:9100"]
    pid: host
    restart: unless-stopped
    networks: [litvyblive-net]

volumes:
  # Infrastructure
  redis-data:
  postgres-data:
  # Backend services
  gateway-data:
  auth-data:
  user-data:
  stream-data:
  chat-data:
  gift-data:
  wallet-data:
  agency-data:
  match-data:
  games-data:
  ranking-data:
  event-data:
  launchpad-data:
  treasury-data:
  marketing-data:
  fraud-data:
  analytics-data:
  notification-data:
  # Streaming
  mediasoup-data:
  stream-ctrl-data:
  edge-us-data:
  edge-eu-data:
  edge-asia-data:
  transcoder-data:
  recordings-data:
  hls-data:
  redis-bus-data:
  # Monitoring
  prometheus-data:
  grafana-data:

networks:
  litvyblive-net:
    driver: bridge
    name: litvyblive-net
