      <<: *build-api
      context: ../../backend/stream-service
      args: [PORT=7012]
    container_name: litvyblive-streams
    ports: ["7012:7012"]
    environment:
      <<: *common-env
      PORT:               "7012"
      STREAM_CTRL_URL:    "http://stream-controller:3002"
    volumes: [stream-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
