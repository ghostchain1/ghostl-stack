    <<: *svc-defaults

  wallet-service:
    build:
      <<: *build-api
      context: ../../backend/wallet-service
      args: [PORT=7015]
    container_name: litvyblive-wallet
    ports: ["7015:7015"]
    environment:
      <<: *common-env
      PORT: "7015"
    volumes: [wallet-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7015/health"]
      <<: *hc-http
    <<: *svc-defaults

  agency-service:
    build:
