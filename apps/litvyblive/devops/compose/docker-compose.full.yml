      <<: *hc-http
    <<: *svc-defaults

  launchpad-service:
    build:
      <<: *build-api
      context: ../../backend/launchpad-service
      args: [PORT=7021]
    container_name: litvyblive-launchpad
    ports: ["7021:7021"]
    environment:
