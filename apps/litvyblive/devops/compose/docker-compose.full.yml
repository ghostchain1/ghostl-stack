# LitVybzLive — Master Docker Compose
# Deploys ALL platform services: 18 backend + 6 streaming + monitoring
#
# Usage:
#   cp devops/.env.example devops/.env
#   docker compose -f devops/compose/docker-compose.full.yml up -d
#
# Single-command deploy via script:
#   bash devops/scripts/deploy.sh [environment]        # dev|staging|prod
#
# All transactions settle on GhostL3 (chain_id=903, RPC :7270) using GST Token.

name: litvyblive-full

x-build-api: &build-api
  context: ../../backend
  dockerfile: ../devops/docker/Dockerfile.api

x-build-stream: &build-stream
  context: ../../streaming
  dockerfile: ../devops/docker/Dockerfile.stream

x-common-env: &common-env
  JWT_SECRET:           "${LITVYB_JWT_SECRET:-litvyblive-dev-secret}"
  REDIS_URL:            "redis://redis:6379"
  DATA_DIR:             "/data"
  GHOST_L3_RPC:         "${GHOST_L3_RPC:-http://host.docker.internal:7270}"
  GHOST_L3_CHAIN_ID:    "903"
  CORS_ORIGIN:          "${CORS_ORIGIN:-*}"
  GHOSTBRAIN_URL:       "${GHOSTBRAIN_URL:-http://host.docker.internal:7900}"
  NODE_ENV:             "${NODE_ENV:-development}"
  LOG_LEVEL:            "${LOG_LEVEL:-info}"

x-svc-defaults: &svc-defaults
  restart: unless-stopped
  networks: [litvyblive-net]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-hc-http: &hc-http
  interval: 15s
  timeout:  5s
  retries:  5
  start_period: 30s

services:

  # ══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: litvyblive-redis
    command: >
      redis-server
      --appendonly yes
      --tcp-backlog 511
      --maxmemory "${REDIS_MAX_MEMORY:-512mb}"
      --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    networks: [litvyblive-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: litvyblive-postgres
    environment:
      POSTGRES_DB:       litvyblive
      POSTGRES_USER:     "${POSTGRES_USER:-litvyb}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5434:5432"]
    restart: unless-stopped
    networks: [litvyblive-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litvyb} -d litvyblive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════════════════════
  # BACKEND MICROSERVICES (ports 7001-7026)
  # ══════════════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      <<: *build-api
      args: [PORT=7001]
      context: ../../backend/api-gateway
    container_name: litvyblive-gateway
    ports: ["7001:7001"]
    environment:
      <<: *common-env
      PORT: "7001"
      AUTH_SVC:          "http://auth-service:7010"
      USER_SVC:          "http://user-service:7011"
      STREAM_SVC:        "http://stream-service:7012"
      CHAT_SVC:          "http://chat-service:7013"
      GIFT_SVC:          "http://gift-service:7014"
      WALLET_SVC:        "http://wallet-service:7015"
      AGENCY_SVC:        "http://agency-service:7016"
      MATCHMAKING_SVC:   "http://matchmaking-service:7017"
      GAMES_SVC:         "http://games-service:7018"
      RANKING_SVC:       "http://ranking-service:7019"
      EVENT_SVC:         "http://event-service:7020"
      LAUNCHPAD_SVC:     "http://launchpad-service:7021"
      TREASURY_SVC:      "http://treasury-service:7022"
      ANALYTICS_SVC:     "http://analytics-service:7025"
      NOTIFICATION_SVC:  "http://notification-service:7026"
    volumes: [gateway-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/health"]
      <<: *hc-http
    <<: *svc-defaults

  auth-service:
    build:
      <<: *build-api
      context: ../../backend/auth-service
      args: [PORT=7010]
    container_name: litvyblive-auth
    ports: ["7010:7010"]
    environment:
      <<: *common-env
      PORT: "7010"
    volumes: [auth-data:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7010/health"]
      <<: *hc-http
    <<: *svc-defaults

  user-service:
