# Streaming manifests: mediasoup-server (hostNetwork), webrtc-gateway,
# stream-controller, edge-nodes, ffmpeg-transcoder, redis-bus
---
# mediasoup-server uses hostNetwork=true for direct UDP RTP — one DaemonSet per node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mediasoup-server
  namespace: litvyblive
  labels:
    app: mediasoup-server
    tier: streaming
spec:
  selector:
    matchLabels:
      app: mediasoup-server
  template:
    metadata:
      labels:
        app: mediasoup-server
        tier: streaming
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        litvyblive/streaming: "true"
      containers:
        - name: mediasoup-server
          image: "${REGISTRY:-ghcr.io/ghostchain}/litvyblive-stream:${IMAGE_TAG:-latest}"
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              hostPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ANNOUNCED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RTC_MIN_PORT
              value: "40000"
            - name: RTC_MAX_PORT
              value: "49999"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litvyblive-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: litvyblive-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# Internal headless service for pod discovery
apiVersion: v1
kind: Service
metadata:
  name: mediasoup-server
  namespace: litvyblive
  labels:
    app: mediasoup-server
spec:
  clusterIP: None
  selector:
    app: mediasoup-server
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# webrtc-gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrtc-gateway
  namespace: litvyblive
  labels:
    app: webrtc-gateway
    tier: streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webrtc-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: webrtc-gateway
        tier: streaming
    spec:
      containers:
        - name: webrtc-gateway
          image: "${REGISTRY:-ghcr.io/ghostchain}/litvyblive-stream:${IMAGE_TAG:-latest}"
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litvyblive-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: litvyblive-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webrtc-gateway
  namespace: litvyblive
spec:
  type: LoadBalancer
  selector:
    app: webrtc-gateway
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
# stream-controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-controller
  namespace: litvyblive
  labels:
    app: stream-controller
    tier: streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stream-controller
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: stream-controller
        tier: streaming
    spec:
      containers:
        - name: stream-controller
          image: "${REGISTRY:-ghcr.io/ghostchain}/litvyblive-stream:${IMAGE_TAG:-latest}"
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: PORT
              value: "3002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litvyblive-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: litvyblive-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stream-controller
  namespace: litvyblive
spec:
  type: ClusterIP
  selector:
    app: stream-controller
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
# ffmpeg-transcoder — needs a PVC for recordings + HLS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg-transcoder
  namespace: litvyblive
  labels:
    app: ffmpeg-transcoder
    tier: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg-transcoder
  template:
    metadata:
      labels:
        app: ffmpeg-transcoder
        tier: streaming
    spec:
      containers:
        - name: ffmpeg-transcoder
          image: "${REGISTRY:-ghcr.io/ghostchain}/litvyblive-stream-ffmpeg:${IMAGE_TAG:-latest}"
          ports:
            - containerPort: 3004
              name: http
          env:
            - name: PORT
              value: "3004"
            - name: INSTALL_FFMPEG
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litvyblive-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: litvyblive-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: recordings
              mountPath: /recordings
            - name: hls
              mountPath: /hls
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: recordings-pvc
        - name: hls
          persistentVolumeClaim:
            claimName: hls-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings-pvc
  namespace: litvyblive
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hls-pvc
  namespace: litvyblive
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-transcoder
  namespace: litvyblive
spec:
  type: ClusterIP
  selector:
    app: ffmpeg-transcoder
  ports:
    - name: http
      port: 3004
      targetPort: 3004
---
# redis-bus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-bus
  namespace: litvyblive
  labels:
    app: redis-bus
    tier: streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis-bus
  template:
    metadata:
      labels:
        app: redis-bus
        tier: streaming
    spec:
      containers:
        - name: redis-bus
          image: "${REGISTRY:-ghcr.io/ghostchain}/litvyblive-stream:${IMAGE_TAG:-latest}"
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: PORT
              value: "3005"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litvyblive-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: litvyblive-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-bus
  namespace: litvyblive
spec:
  type: ClusterIP
  selector:
    app: redis-bus
  ports:
    - name: http
      port: 3005
      targetPort: 3005
