    environment:
      <<: *common-env
      PORT: "7016"
    volumes: [agency-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7016/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Matchmaking / AI (port 7017) ───────────────────────────────────────────

  matchmaking-service:
    build: { context: ., dockerfile: matchmaking-service/Dockerfile }
    container_name: litvyblive-matchmaking
    ports: ["7017:7017"]
    environment:
      <<: *common-env
      PORT: "7017"
      STREAM_SVC: "http://stream-service:7012"
      RANKING_SVC: "http://ranking-service:7019"
      GHOSTBRAIN_URL: "${GHOSTBRAIN_URL:-http://host.docker.internal:7900}"
    volumes: [match-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7017/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Games (port 7018) ──────────────────────────────────────────────────────

  games-service:
    build: { context: ., dockerfile: games-service/Dockerfile }
    container_name: litvyblive-games
