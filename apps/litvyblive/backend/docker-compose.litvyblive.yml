# LitVybzLive microservice stack
# Usage:  docker compose -f apps/litvyblive/backend/docker-compose.litvyblive.yml up -d
# Env:    copy backend/config/.env.example to backend/config/.env and source it
#
# All platform transactions settle on GhostL3 (chain_id=903, RPC :39545)
# using GhostChain GST Token.

name: litvyblive

x-common-env: &common-env
  JWT_SECRET: "${LITVYB_JWT_SECRET:-litvyblive-dev-secret}"
  DATA_DIR: /data
  REDIS_URL: "redis://redis:6379"
  GHOST_L3_RPC: "${GHOST_L3_RPC:-http://host.docker.internal:39545}"
  GHOST_L3_CHAIN_ID: "903"
  CORS_ORIGIN: "${CORS_ORIGIN:-*}"

x-service-defaults: &svc-defaults
  restart: unless-stopped
  networks: [litvyblive-net]

x-healthcheck-http: &hc-http
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: litvyblive-redis
    ports: ["6390:6379"]
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [litvyblive-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (port 7001) ────────────────────────────────────────────────

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    container_name: litvyblive-gateway
    ports: ["7001:7001"]
    environment:
      <<: *common-env
      PORT: "7001"
      AUTH_SVC: "http://auth-service:7010"
      USER_SVC: "http://user-service:7011"
      STREAM_SVC: "http://stream-service:7012"
      CHAT_SVC: "http://chat-service:7013"
      GIFT_SVC: "http://gift-service:7014"
      WALLET_SVC: "http://wallet-service:7015"
      AGENCY_SVC: "http://agency-service:7016"
      MATCH_SVC: "http://matchmaking-service:7017"
      GAMES_SVC: "http://games-service:7018"
      RANKING_SVC: "http://ranking-service:7019"
      EVENT_SVC: "http://event-service:7020"
      LAUNCHPAD_SVC: "http://launchpad-service:7021"
      TREASURY_SVC: "http://treasury-service:7022"
      MARKETING_SVC: "http://marketing-service:7023"
      FRAUD_SVC: "http://fraud-service:7024"
      ANALYTICS_SVC: "http://analytics-service:7025"
      NOTIFICATION_SVC: "http://notification-service:7026"
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Auth (port 7010) ───────────────────────────────────────────────────────

  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    container_name: litvyblive-auth
    ports: ["7010:7010"]
    environment:
      <<: *common-env
      PORT: "7010"
    volumes: [auth-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7010/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── User (port 7011) ───────────────────────────────────────────────────────

  user-service:
    build: { context: ., dockerfile: user-service/Dockerfile }
    container_name: litvyblive-users
    ports: ["7011:7011"]
    environment:
      <<: *common-env
      PORT: "7011"
    volumes: [user-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7011/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Stream (port 7012) ─────────────────────────────────────────────────────

  stream-service:
    build: { context: ., dockerfile: stream-service/Dockerfile }
    container_name: litvyblive-streams
    ports: ["7012:7012"]
    environment:
      <<: *common-env
      PORT: "7012"
    volumes: [stream-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7012/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Chat / WebSocket (port 7013) ───────────────────────────────────────────

  chat-service:
    build: { context: ., dockerfile: chat-service/Dockerfile }
    container_name: litvyblive-chat
    ports: ["7013:7013"]
    environment:
      <<: *common-env
      PORT: "7013"
    volumes: [chat-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7013/health"]
      <<: *hc-http
    <<: *svc-defaults

  # ── Gift Economy (port 7014) ───────────────────────────────────────────────

  gift-service:
    build: { context: ., dockerfile: gift-service/Dockerfile }
    container_name: litvyblive-gifts
    ports: ["7014:7014"]
    environment:
      <<: *common-env
      PORT: "7014"
    volumes: [gift-data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
