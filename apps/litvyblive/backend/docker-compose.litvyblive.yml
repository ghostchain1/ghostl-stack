      <<: *hc-http
    <<: *svc-defaults

  # ── Wallet / GST (port 7015) ───────────────────────────────────────────────

  wallet-service:
    build: { context: ., dockerfile: wallet-service/Dockerfile }
    container_name: litvyblive-wallet
