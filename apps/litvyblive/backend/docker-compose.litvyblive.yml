  redis-data:
  auth-data:
  user-data:
  stream-data:
  chat-data:
  gift-data:
  wallet-data:
  agency-data:
  match-data:
  games-data:
  ranking-data:
  event-data:
  launchpad-data:
  treasury-data:
  marketing-data:
  fraud-data:
  analytics-data:
  notification-data:

networks:
  litvyblive-net:
    driver: bridge
