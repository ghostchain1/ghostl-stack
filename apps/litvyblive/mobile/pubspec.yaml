name: litvyblive
description: LitVybzLive — GhostChain-powered live streaming platform (Android & iOS)
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # GhostChain Flutter SDK (local path)
  ghost_flutter_sdk:
    path: ../../../packages/ghost_flutter_sdk

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # WebRTC streaming
  flutter_webrtc: ^0.10.0

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  rive: ^0.13.4

  # Navigation
  go_router: ^13.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Local storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # Crypto / wallet
  web3dart: ^2.7.3
  convert: ^3.1.1

  # Media
  camera: ^0.10.5+9
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/avatars/
    - assets/gifts/
