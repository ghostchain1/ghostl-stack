name: ghostchain-api

services:
  api:
    build:
      context: /home/ghost/ghostl-stack
      dockerfile: apps/api/Dockerfile
      network: host
    environment:
      NODE_ENV: production
      PORT: 4000
    env_file:
      - /home/ghost/ghostl-stack/apps/api/.env
    ports:
      - "4000:4000"
    volumes:
      - api_data:/home/ghost/ghostl-stack/apps/api/data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  api_data:
