<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ghost-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23d6a6"/>
      <stop offset="50%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="ghost-body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#23d6a6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0ba882" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="ghost-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="rounded">
      <rect width="48" height="48" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Dark background -->
    <rect width="48" height="48" fill="#05070f"/>
    <!-- Subtle hex ring -->
    <polygon points="24,2.5 43,13 43,35 24,45.5 5,35 5,13"
             stroke="url(#ghost-grad)" stroke-width="0.8" stroke-opacity="0.35" fill="none"/>
    <!-- Ghost body with glow -->
    <path d="M24 10
             C17.5 10 13 15 13 21.5
             L13 35
             L16.5 31
             L20 35
             L23 31.5
             L24 33
             L27 31.5
             L30 35
             L33.5 31
             L35 35
             L35 21.5
             C35 15 30.5 10 24 10 Z"
          fill="url(#ghost-body)" filter="url(#ghost-glow)"/>
    <!-- Eyes -->
    <circle cx="20" cy="22" r="2.4" fill="#05070f"/>
    <circle cx="28" cy="22" r="2.4" fill="#05070f"/>
    <!-- Eye glow -->
    <circle cx="20.8" cy="21.2" r="0.8" fill="#23d6a6" opacity="0.9"/>
    <circle cx="28.8" cy="21.2" r="0.8" fill="#23d6a6" opacity="0.9"/>
  </g>
</svg>
