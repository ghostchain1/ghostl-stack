<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23d6a6"/>
      <stop offset="60%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="ghost-icon-body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#23d6a6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0ba882" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon mark (40×40 on 60px canvas, centred) -->
  <g transform="translate(10, 10)">
    <rect width="40" height="40" rx="10" fill="#0a0f1b"/>
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11"
             stroke="url(#logo-grad)" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M20 8
             C15 8 11 12.5 11 17.5
             L11 28
             L13.8 25
             L16.5 28
             L19 25.5
             L20 27
             L21 25.5
             L23.5 28
             L26.2 25
             L29 28
             L29 17.5
             C29 12.5 25 8 20 8 Z"
          fill="url(#ghost-icon-body)" filter="url(#icon-glow)"/>
    <circle cx="16.5" cy="18.5" r="1.9" fill="#0a0f1b"/>
    <circle cx="23.5" cy="18.5" r="1.9" fill="#0a0f1b"/>
    <circle cx="17.2" cy="17.8" r="0.65" fill="#23d6a6" opacity="0.9"/>
    <circle cx="24.2" cy="17.8" r="0.65" fill="#23d6a6" opacity="0.9"/>
  </g>

  <!-- Wordmark: "GhostChain" -->
  <text x="60" y="38"
        font-family="'Sora','Space Grotesk',system-ui,sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="0.04em"
        fill="url(#logo-grad)">GhostChain</text>

  <!-- Tagline / sub-brand -->
  <text x="61" y="52"
        font-family="'Space Grotesk',system-ui,sans-serif"
        font-size="9"
        font-weight="500"
        letter-spacing="0.18em"
        fill="#9fb1c8"
        text-anchor="start">SOVEREIGN L1 · L2 · L3</text>
</svg>
