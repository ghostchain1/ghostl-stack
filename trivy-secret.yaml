# Trivy secret scanning config.
# - Loaded automatically when present as `trivy-secret.yaml` in the working directory
# - Or explicitly via: `trivy ... --secret-config ./trivy-secret.yaml`
#
# NOTE: For faster scans, also use CLI flags `--skip-dirs` / `--skip-files`.

allow-rules:
  - id: generated-build-info
    description: Skip large build info artifacts
    path: ^contracts/artifacts/build-info/
  - id: scribble-report
    description: Skip large scribble reports
    path: ^contracts/reports/formal/scribble/
  - id: fourbyte-db
    description: Skip op-geth fourbyte database
    path: ^infra/opstack/op-geth/signer/fourbyte/4byte\.json$
  - id: node-modules
    description: Skip dependency directories
    path: (^|.*/)node_modules/
  - id: contracts-build-output
    description: Skip contract build outputs and caches
    path: ^contracts/(artifacts|cache|typechain-types|proposals|\.hardhat-cache|\.foundry-(out|cache)(-local)?|out-codex|cache-codex)/
  - id: local-runtime-data
    description: Skip local runtime data, snapshots, and backups
    path: ^(ops/snapshots|ops/preflight|ops/security|backups|chains/.*/data|infra/ghostchain/data|infra/opstack/(data|broadcast|secrets|l3/secrets))/
