# GhostBrain AI Stack — all 16 GhostBrain services
# Build contexts point to the TypeScript monorepo at ~/hyperghost-tooling

name: ghostbrain

networks:
  ghostbrain-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  scp-logs:
  scp-policies:
  gdm-data:
  gdm-blockchain-index:
  gdm-memory:
  kernel-data:
  governance-proposals:

services:

  # ── Swarm Bus (must start first) ─────────────────────────────
  ghostbrain-swarm:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-swarm
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-swarm:latest
    container_name: ghostbrain-swarm
    restart: always
    ports:
      - "${GHOSTBRAIN_SWARM_PORT:-9000}:9000"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_SWARM_PORT=9000
      - GHOSTBRAIN_KERNEL_URL=http://ghostbrain-kernel:9300
      - GHOSTBRAIN_AEE_URL=http://ghostbrain-economy-engine:9800
      - GHOSTBRAIN_GVF_URL=http://ghostbrain-validator-fabric:9700
      - GHOSTBRAIN_GDM_URL=http://ghostbrain-data-mesh:9900
      - GHOSTBRAIN_SCP_URL=http://ghostbrain-control-plane:9500
    networks:
      - ghostbrain-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Kernel (hypervisor control) ──────────────────────────────
  ghostbrain-kernel:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-kernel
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-kernel:latest
    container_name: ghostbrain-kernel
    restart: always
    ports:
      - "${GHOSTBRAIN_KERNEL_PORT:-9300}:9300"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_KERNEL_PORT=9300
      - GHOSTBRAIN_HYPERVISOR_HOST=${HYPERVISOR_HOST:-208.110.71.164}
      - GHOSTBRAIN_HYPERVISOR_URL=${GHOSTBRAIN_HYPERVISOR_URL:-http://208.110.71.164:8787}
    volumes:
      - kernel-data:/app/data
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9300/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Economic Modeling ────────────────────────────────────────
  ghostbrain-economic:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-economic
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-economic:latest
    container_name: ghostbrain-economic
    restart: always
    ports:
      - "${GHOSTBRAIN_ECONOMIC_PORT:-9050}:9050"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_ECONOMIC_PORT=9050
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Digital Twin ─────────────────────────────────────────────
  ghostbrain-digital-twin:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-digital-twin
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-digital-twin:latest
    container_name: ghostbrain-digital-twin
    restart: always
    ports:
      - "${GHOSTBRAIN_TWIN_PORT:-9100}:9100"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_TWIN_PORT=9100
      - GHOSTBRAIN_KERNEL_URL=http://ghostbrain-kernel:9300
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-kernel

  # ── Conscious Core ───────────────────────────────────────────
  ghostbrain-conscious-core:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-conscious-core
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-conscious-core:latest
    container_name: ghostbrain-conscious-core
    restart: always
    ports:
      - "${GHOSTBRAIN_CONSCIOUS_PORT:-9150}:9150"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_CONSCIOUS_PORT=9150
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Simulation Lab ───────────────────────────────────────────
  ghostbrain-simulation-lab:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-simulation-lab
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-simulation-lab:latest
    container_name: ghostbrain-simulation-lab
    restart: always
    ports:
      - "${GHOSTBRAIN_SIMLAB_PORT:-9200}:9200"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_SIMLAB_PORT=9200
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Evolution Engine ─────────────────────────────────────────
  ghostbrain-evolution-engine:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-evolution-engine
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-evolution-engine:latest
    container_name: ghostbrain-evolution-engine
    restart: always
    ports:
      - "${GHOSTBRAIN_EVOLUTION_PORT:-9250}:9250"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_EVOLUTION_PORT=9250
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm
      - ghostbrain-simulation-lab

  # ── Kernel (already defined above) — ordering reference ──────
  # ghostbrain-kernel: port 9300

  # ── Multichain Engine ────────────────────────────────────────
  ghostbrain-multichain:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-multichain
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-multichain:latest
    container_name: ghostbrain-multichain
    restart: always
    ports:
      - "${GHOSTBRAIN_MULTICHAIN_PORT:-9350}:9350"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_MULTICHAIN_PORT=9350
      - GHOSTCHAIN_L1_RPC=${GHOSTCHAIN_L1_RPC:-http://ghostchain-devnet:8545}
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-kernel

  # ── DevOps AI ────────────────────────────────────────────────
  ghost-devops-ai:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghost-devops-ai
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghost-devops-ai:latest
    container_name: ghost-devops-ai
    restart: always
    ports:
      - "${GHOSTBRAIN_DEVOPS_PORT:-9400}:9400"
    environment:
      - NODE_ENV=production
      - GHOST_DEVOPS_PORT=9400
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Sovereign Control Plane (SCP — master) ───────────────────
  ghostbrain-control-plane:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-control-plane
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-control-plane:latest
    container_name: ghostbrain-control-plane
    restart: always
    ports:
      - "${GHOSTBRAIN_SCP_PORT:-9500}:9500"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_SCP_PORT=9500
      - GHOSTBRAIN_KERNEL_URL=http://ghostbrain-kernel:9300
      - GHOSTBRAIN_AEE_URL=http://ghostbrain-economy-engine:9800
      - GHOSTBRAIN_GVF_URL=http://ghostbrain-validator-fabric:9700
      - GHOSTBRAIN_GDM_URL=http://ghostbrain-data-mesh:9900
      - GHOSTBRAIN_SIMLAB_URL=http://ghostbrain-simulation-lab:9200
      - GHOSTBRAIN_GOVERNANCE_URL=http://ghostbrain-governance:9550
      - SCP_API_KEYS=${SCP_API_KEYS:-ghoststack-admin:admin}
      - SCP_LOGS_DIR=/app/logs
      - SCP_POLICIES_DIR=/app/policies
    volumes:
      - scp-logs:/app/logs
      - scp-policies:/app/policies
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-kernel
      - ghostbrain-swarm
      - ghostbrain-simulation-lab
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9500/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Interchain Bridge AI ─────────────────────────────────────
  ghostbrain-interchain:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-interchain
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-interchain:latest
    container_name: ghostbrain-interchain
    restart: always
    ports:
      - "${GHOSTBRAIN_INTERCHAIN_PORT:-9450}:9450"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_INTERCHAIN_PORT=9450
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-multichain

  # ── Governance AI ────────────────────────────────────────────
  ghostbrain-governance:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-governance
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-governance:latest
    container_name: ghostbrain-governance
    restart: always
    ports:
      - "${GHOSTBRAIN_GOVERNANCE_PORT:-9550}:9550"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_GOVERNANCE_PORT=9550
      - GHOSTCHAIN_L1_RPC=${GHOSTCHAIN_L1_RPC:-http://ghostchain-devnet:8545}
    volumes:
      - governance-proposals:/app/proposals
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Research AI ──────────────────────────────────────────────
  ghostbrain-research-ai:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-research-ai
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-research-ai:latest
    container_name: ghostbrain-research-ai
    restart: always
    ports:
      - "${GHOSTBRAIN_RESEARCH_PORT:-9600}:9600"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_RESEARCH_PORT=9600
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Validator Fabric AI (GVF) ────────────────────────────────
  ghostbrain-validator-fabric:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-validator-fabric
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-validator-fabric:latest
    container_name: ghostbrain-validator-fabric
    restart: always
    ports:
      - "${GHOSTBRAIN_GVF_PORT:-9700}:9700"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_GVF_PORT=9700
      - GHOSTCHAIN_L1_RPC=${GHOSTCHAIN_L1_RPC:-http://ghostchain-devnet:8545}
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-kernel

  # ── Economy Engine AI (AEE) ──────────────────────────────────
  ghostbrain-economy-engine:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-economy-engine
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-economy-engine:latest
    container_name: ghostbrain-economy-engine
    restart: always
    ports:
      - "${GHOSTBRAIN_AEE_PORT:-9800}:9800"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_AEE_PORT=9800
      - GHOSTCHAIN_L1_RPC=${GHOSTCHAIN_L1_RPC:-http://ghostchain-devnet:8545}
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-swarm

  # ── Global Data Mesh (GDM) ───────────────────────────────────
  ghostbrain-data-mesh:
    build:
      context: ${GHOSTBRAIN_SRC:-/home/ghost/hyperghost-tooling/hyper-ghost-ai/services}/ghostbrain-data-mesh
      dockerfile: ../../Dockerfile.ghostbrain
    image: ghostbrain-data-mesh:latest
    container_name: ghostbrain-data-mesh
    restart: always
    ports:
      - "${GHOSTBRAIN_GDM_PORT:-9900}:9900"
    environment:
      - NODE_ENV=production
      - GHOSTBRAIN_GDM_PORT=9900
      - GHOSTCHAIN_L1_RPC=${GHOSTCHAIN_L1_RPC:-http://ghostchain-devnet:8545}
    volumes:
      - gdm-data:/app/data
      - gdm-blockchain-index:/app/index
      - gdm-memory:/app/memory
    networks:
      - ghostbrain-net
    depends_on:
      - ghostbrain-kernel
      - ghostbrain-swarm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
