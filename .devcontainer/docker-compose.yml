services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/home/ghost/ghostl-stack:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SAFE_CONTRACTS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266:L2 Ops Safe (dev),0x70997970C51812dc3A010C7d01b50e0d17dc79C8:L3 Ops Safe (dev)"
    networks: [ghostnet]

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --block-time
      - "1"
    restart: unless-stopped
    ports:
      - "8545:8545"
    networks: [ghostnet]
    healthcheck:
      test: ["CMD-SHELL", "anvil --version >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  anvil-rpc-proxy:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../services/ghost-rpc-proxy:/app:ro
    environment:
      PORT: "8546"
      UPSTREAM_URL: "http://anvil:8545"
      LOG_REQUESTS: "${GHOST_RPC_PROXY_LOG_REQUESTS:-0}"
    command: ["node", "index.mjs"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "18545:8546"
    networks: [ghostnet]
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8546/health').then(r=>r.json()).then(j=>{if(!j.ok) process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  ghost-guard:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-guard:/app
      - ghost_guard_node_modules:/app/node_modules
      - ghost_guard_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-guard/.env
    environment:
      RPC_L2: "http://host.docker.internal:29545"
      STATE_DIR: "/state"
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7070/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
  ghost-relayer:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-relayer:/app
      - ghost_relayer_node_modules:/app/node_modules
      - ghost_relayer_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-relayer/.env
    environment:
      RPC_L1: "http://host.docker.internal:28545"
      RPC_L2: "http://host.docker.internal:29545"
      RPC_L3: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7171:7171"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7171/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
      anvil:
        condition: service_healthy
  ghost-rollup-proposer-l2:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-rollup-proposer:/app
      - ghost_rollup_proposer_node_modules:/app/node_modules
      - ghost_rollup_proposer_l2_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-proposer/.env.l2
    environment:
      RPC_SETTLEMENT: "http://host.docker.internal:28545"
      RPC_CHILD: "http://host.docker.internal:29545"
      STATE_DIR: "/state"
    ports:
      - "7272:7272"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7272/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
      anvil:
        condition: service_healthy
  ghost-rollup-proposer-l3:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-rollup-proposer:/app
      - ghost_rollup_proposer_node_modules:/app/node_modules
      - ghost_rollup_proposer_l3_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-proposer/.env.l3
    environment:
      RPC_SETTLEMENT: "http://host.docker.internal:9545"
      RPC_CHILD: "http://host.docker.internal:39545"
      STATE_DIR: "/state"
    ports:
      - "7373:7373"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7373/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
  ghost-rollup-challenger-l2:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-rollup-challenger:/app
      - ghost_rollup_challenger_node_modules:/app/node_modules
      - ghost_rollup_challenger_l2_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-challenger/.env.l2
    environment:
      RPC_SETTLEMENT: "http://host.docker.internal:28545"
      RPC_CHILD: "http://host.docker.internal:29545"
      STATE_DIR: "/state"
    ports:
      - "7282:7282"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7282/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
      anvil:
        condition: service_healthy
  ghost-rollup-challenger-l3:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ghost-rollup-challenger:/app
      - ghost_rollup_challenger_node_modules:/app/node_modules
      - ghost_rollup_challenger_l3_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-challenger/.env.l3
    environment:
      RPC_SETTLEMENT: "http://host.docker.internal:9545"
      RPC_CHILD: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7383:7383"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7383/health | grep -q '\"ok\":true'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
  ai-monitor:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../services/ai-monitor:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RPC_L2: "http://host.docker.internal:29545"
      GUARD_URL: "http://ghost-guard:7070"
      PORT: "7575"
      OBSERVE_ONLY: "${AI_MONITOR_OBSERVE_ONLY:-0}"
      THROTTLE_THRESHOLD: "${AI_MONITOR_THROTTLE_THRESHOLD:-70}"
      PAUSE_THRESHOLD: "${AI_MONITOR_PAUSE_THRESHOLD:-90}"
      BASE_DELAY_MS: "${AI_MONITOR_BASE_DELAY_MS:-2000}"
      MAX_DELAY_MS: "${AI_MONITOR_MAX_DELAY_MS:-8000}"
      ADMIN_TOKEN: "${AI_MONITOR_ADMIN_TOKEN:-}"
    command: sh -lc "npm ci --no-audit --no-fund && npm start"
    ports:
      - "7575:7575"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7575/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ghostnet]
    depends_on:
      ghost-guard:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [ghostnet]
    depends_on:
      - ghost-guard
      - ghost-relayer
      - ghost-rollup-proposer-l2
      - ghost-rollup-proposer-l3
      - ghost-rollup-challenger-l2
      - ghost-rollup-challenger-l3

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks: [ghostnet]
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  ghostnet:

volumes:
  ghost_guard_node_modules:
  ghost_relayer_node_modules:
  ghost_guard_state:
  ghost_relayer_state:
  ghost_rollup_proposer_node_modules:
  ghost_rollup_proposer_l2_state:
  ghost_rollup_proposer_l3_state:
  ghost_rollup_challenger_node_modules:
  ghost_rollup_challenger_l2_state:
  ghost_rollup_challenger_l3_state:
  prometheus_data:
  grafana_data:
