services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/ghostl-stack:cached
    networks: [ghostnet]

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--block-time"
      - "1"
    ports:
      - "8545:8545"
    networks: [ghostnet]

  ghostl2:
    image: 0xpolygon/polygon-edge:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        if [ ! -f /data/genesis.json ]; then
          mkdir -p /data/validator-1;
          if [ ! -f /data/validator-1/consensus/validator.key ]; then
            polygon-edge secrets init --insecure --data-dir /data/validator-1 >/dev/null;
          fi;
          NODE_ID="$(polygon-edge secrets output --data-dir /data/validator-1 --node-id | tail -n 1 | tr -d '\r\n')";
          polygon-edge genesis \
            --dir /data/genesis.json \
            --name GhostL2 \
            --chain-id 7192 \
            --premine 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266:1000000000000000000000000 \
            --bootnode "/ip4/127.0.0.1/tcp/14792/p2p/$$NODE_ID" \
            --consensus ibft \
            --validators-path /data \
            --validators-prefix validator- \
            --block-gas-limit 30000000;
        fi;
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:9632 \
          --libp2p 0.0.0.0:14792 \
          --jsonrpc 0.0.0.0:9545
    ports:
      - "9545:9545"
    volumes:
      - ghostl2_data:/data
    networks: [ghostnet]
    depends_on: [anvil]

  ghostl3:
    image: 0xpolygon/polygon-edge:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        if [ ! -f /data/genesis.json ]; then
          mkdir -p /data/validator-1;
          if [ ! -f /data/validator-1/consensus/validator.key ]; then
            polygon-edge secrets init --insecure --data-dir /data/validator-1 >/dev/null;
          fi;
          NODE_ID="$(polygon-edge secrets output --data-dir /data/validator-1 --node-id | tail -n 1 | tr -d '\r\n')";
          polygon-edge genesis \
            --dir /data/genesis.json \
            --name GhostL3 \
            --chain-id 7393 \
            --premine 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266:1000000000000000000000000 \
            --bootnode "/ip4/127.0.0.1/tcp/16793/p2p/$$NODE_ID" \
            --consensus ibft \
            --validators-path /data \
            --validators-prefix validator- \
            --block-gas-limit 30000000;
        fi;
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:10632 \
          --libp2p 0.0.0.0:16793 \
          --jsonrpc 0.0.0.0:10545
    ports:
      - "10545:10545"
    volumes:
      - ghostl3_data:/data
    networks: [ghostnet]
    depends_on: [ghostl2]

  ghost-guard:
    image: node:22-alpine
    user: node
    working_dir: /app
    volumes:
      - ../services/ghost-guard:/app
      - ghost_guard_node_modules:/app/node_modules
    command: sh -lc "test -f node_modules/.package-lock.json || npm ci --no-audit --no-fund; npm run dev"
    env_file:
      - ../services/ghost-guard/.env
    environment:
      RPC_L2: "http://ghostl2:9545"
      RPC_L3: "http://ghostl3:10545"
      PRIVATE_KEY: "${PRIVATE_KEY-}"
    ports:
      - "7070:7070"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

networks:
  ghostnet:

volumes:
  ghostl2_data:
  ghostl3_data:
  ghost_guard_node_modules:
