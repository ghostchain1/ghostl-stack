services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/ghostl-stack:cached
    networks: [ghostnet]

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--block-time"
      - "1"
    ports:
      - "8545:8545"
    networks: [ghostnet]

  ghostl2:
    image: 0xpolygon/polygon-edge:latest
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        test -f /data/genesis.json || { echo "Missing /data/genesis.json (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        test -f /data/validator-1/consensus/validator.key || { echo "Missing /data/validator-1 (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:9632 \
          --libp2p 0.0.0.0:14792 \
          --jsonrpc 0.0.0.0:9545
    ports:
      - "9545:9545"
    volumes:
      - ../chains/l2/data:/data
    networks: [ghostnet]
    depends_on: [anvil]

  ghostl3:
    image: 0xpolygon/polygon-edge:latest
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        test -f /data/genesis.json || { echo "Missing /data/genesis.json (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        test -f /data/validator-1/consensus/validator.key || { echo "Missing /data/validator-1 (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:10632 \
          --libp2p 0.0.0.0:16793 \
          --jsonrpc 0.0.0.0:10545
    ports:
      - "10545:10545"
    volumes:
      - ../chains/l3/data:/data
    networks: [ghostnet]
    depends_on: [ghostl2]

  ghost-guard:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-guard:/app
      - ghost_guard_node_modules:/app/node_modules
      - ghost_guard_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-guard/.env
    environment:
      RPC_L2: "http://ghostl2:9545"
      RPC_L3: "http://ghostl3:10545"
      PRIVATE_KEY: "${PRIVATE_KEY-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN-}"
      ALLOW_INSECURE_ADMIN: "${ALLOW_INSECURE_ADMIN-0}"
      AUTO_PAUSE: "${AUTO_PAUSE-1}"
      RISK_WINDOW_SECONDS: "${RISK_WINDOW_SECONDS-300}"
      CONFIRMATIONS: "${CONFIRMATIONS-0}"
      STATE_DIR: "/state"
    ports:
      - "7070:7070"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

  ghost-relayer:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-relayer:/app
      - ghost_relayer_node_modules:/app/node_modules
      - ghost_relayer_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-relayer/.env
    environment:
      RPC_L2: "http://ghostl2:9545"
      RPC_L3: "http://ghostl3:10545"
      RELAYER_PRIVATE_KEY: "${RELAYER_PRIVATE_KEY-}"
      L2_RELAYER_PRIVATE_KEY: "${L2_RELAYER_PRIVATE_KEY-}"
      CONFIRMATIONS: "${CONFIRMATIONS-0}"
      STATE_DIR: "/state"
    ports:
      - "7171:7171"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

networks:
  ghostnet:

volumes:
  ghost_guard_node_modules:
  ghost_relayer_node_modules:
  ghost_guard_state:
  ghost_relayer_state:
