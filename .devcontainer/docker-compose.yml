services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/ghostl-stack:cached
    networks: [ghostnet]

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--block-time"
      - "1"
    ports:
      - "8545:8545"
    networks: [ghostnet]

  ghostl2:
    image: 0xpolygon/polygon-edge:latest
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        test -f /data/genesis.json || { echo "Missing /data/genesis.json (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        test -f /data/validator-1/consensus/validator.key || { echo "Missing /data/validator-1 (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:9632 \
          --libp2p 0.0.0.0:14792 \
          --jsonrpc 0.0.0.0:9545
    ports:
      - "9545:9545"
    volumes:
      - ../chains/l2/data:/data
    networks: [ghostnet]
    depends_on: [anvil]

  ghostl3:
    image: 0xpolygon/polygon-edge:latest
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        test -f /data/genesis.json || { echo "Missing /data/genesis.json (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        test -f /data/validator-1/consensus/validator.key || { echo "Missing /data/validator-1 (run: bash infra/scripts/chains/init.sh)"; exit 1; }
        exec polygon-edge server \
          --data-dir /data/validator-1 \
          --chain /data/genesis.json \
          --grpc-address 0.0.0.0:10632 \
          --libp2p 0.0.0.0:16793 \
          --jsonrpc 0.0.0.0:10545
    ports:
      - "10545:10545"
    volumes:
      - ../chains/l3/data:/data
    networks: [ghostnet]
    depends_on: [ghostl2]

  ghost-guard:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-guard:/app
      - ghost_guard_node_modules:/app/node_modules
      - ghost_guard_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-guard/.env
    environment:
      RPC_L2: "http://ghostl2:9545"
      RPC_L3: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7070:7070"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

  ghost-relayer:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-relayer:/app
      - ghost_relayer_node_modules:/app/node_modules
      - ghost_relayer_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-relayer/.env
    environment:
      RPC_L1: "http://anvil:8545"
      RPC_L2: "http://ghostl2:9545"
      RPC_L3: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7171:7171"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

  ghost-rollup-proposer-l2:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-rollup-proposer:/app
      - ghost_rollup_proposer_node_modules:/app/node_modules
      - ghost_rollup_proposer_l2_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-proposer/.env.l2
    environment:
      RPC_SETTLEMENT: "http://anvil:8545"
      RPC_CHILD: "http://ghostl2:9545"
      STATE_DIR: "/state"
    ports:
      - "7272:7272"
    networks: [ghostnet]
    depends_on: [anvil, ghostl2]

  ghost-rollup-proposer-l3:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-rollup-proposer:/app
      - ghost_rollup_proposer_node_modules:/app/node_modules
      - ghost_rollup_proposer_l3_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-proposer/.env.l3
    environment:
      RPC_SETTLEMENT: "http://ghostl2:9545"
      RPC_CHILD: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7373:7373"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

  ghost-rollup-challenger-l2:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-rollup-challenger:/app
      - ghost_rollup_challenger_node_modules:/app/node_modules
      - ghost_rollup_challenger_l2_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-challenger/.env.l2
    environment:
      RPC_SETTLEMENT: "http://anvil:8545"
      RPC_CHILD: "http://ghostl2:9545"
      STATE_DIR: "/state"
    ports:
      - "7282:7282"
    networks: [ghostnet]
    depends_on: [anvil, ghostl2]

  ghost-rollup-challenger-l3:
    image: node:22-alpine
    user: "0:0"
    working_dir: /app
    volumes:
      - ../services/ghost-rollup-challenger:/app
      - ghost_rollup_challenger_node_modules:/app/node_modules
      - ghost_rollup_challenger_l3_state:/state
    command: sh -lc "test -f node_modules/.package-lock.json || (test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund); npm run start"
    env_file:
      - ../services/ghost-rollup-challenger/.env.l3
    environment:
      RPC_SETTLEMENT: "http://ghostl2:9545"
      RPC_CHILD: "http://ghostl3:10545"
      STATE_DIR: "/state"
    ports:
      - "7383:7383"
    networks: [ghostnet]
    depends_on: [ghostl2, ghostl3]

networks:
  ghostnet:

volumes:
  ghost_guard_node_modules:
  ghost_relayer_node_modules:
  ghost_guard_state:
  ghost_relayer_state:
  ghost_rollup_proposer_node_modules:
  ghost_rollup_proposer_l2_state:
  ghost_rollup_proposer_l3_state:
  ghost_rollup_challenger_node_modules:
  ghost_rollup_challenger_l2_state:
  ghost_rollup_challenger_l3_state:
